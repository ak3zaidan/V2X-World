<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="V2X World logo">
  <title>V2X World</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- globe meridians: the "world" -->
    <circle cx="64" cy="64" r="50" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/>
    <ellipse cx="64" cy="64" rx="22" ry="50" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="3"/>
    <!-- road in perspective -->
    <path d="M26 128 L60 66 H68 L102 128 Z" fill="#fff"/>
    <rect x="63" y="70" width="2" height="5" fill="url(#bg)"/>
    <rect x="62.5" y="80" width="3" height="7" fill="url(#bg)"/>
    <rect x="62" y="93" width="4" height="10" fill="url(#bg)"/>
    <rect x="61" y="110" width="6" height="14" fill="url(#bg)"/>
  </g>
  <!-- the connected vehicle and its broadcast -->
  <circle cx="64" cy="52" r="7" fill="#fff"/>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <path d="M54.1 42.1 A14 14 0 0 1 73.9 42.1"/>
    <path d="M45.6 33.6 A26 26 0 0 1 82.4 33.6" stroke-opacity=".75"/>
    <path d="M37.1 25.1 A38 38 0 0 1 90.9 25.1" stroke-opacity=".45"/>
  </g>
</svg>

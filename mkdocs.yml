# Documentation site for V2X World.
#
# Built with Zensical (`zensical build`), which reads this file; the same file builds with
# mkdocs-material. The configuration reference under docs/configuration/reference/ is
# generated from the engine's published settings surface (`just docs-gen`), and the Rust
# API docs are built by `cargo doc` into site/api/ in CI (.github/workflows/docs.yml).
#
# `site_name` is the project's public name, V2X World (the README's title and CITATION.cff's
# `title`); keep the three in step.

site_name: "V2X World"
site_description: >-
  A deterministic, discrete-event simulator of connected-vehicle (V2X) systems: traffic,
  radio, network, IEEE 1609.2 security, the SCMS and ETSI PKI, attackers and misbehaviour
  detection.
site_url: https://ak3zaidan.github.io/V2X-World/
repo_url: https://github.com/ak3zaidan/V2X-World
repo_name: ak3zaidan/V2X-World
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
# docs/README.md is the documentation map for readers browsing the repository on GitHub;
# on the site the home page (docs/index.md) takes its place. The other patterns keep
# working notes that may sit beside the documentation in a checkout (design records,
# validation logs, papers in preparation) off the published site.
exclude_docs: |
  README.md
  /adr/
  /benchmark/
  /calibration/
  /design/
  /guides/
  /papers/
  /redteam/
  /site/
  /validation/
copyright: >-
  © 2026 Ahmed Zaidan · code
  <a href="https://github.com/ak3zaidan/V2X-World/blob/main/LICENSE">Apache-2.0</a> · dataset
  <a href="https://huggingface.co/datasets/akzaidan/v2x-scms-mbd-mini">CC BY 4.0</a>

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme)"
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ak3zaidan/V2X-World


# worlds/cities.yaml — the city library: every real city a scenario can run on.
#
# A scenario says what happens (traffic, radio, network, security, attacks); a city says
# where. Any scenario runs on any city here: `v2xw run <scenario> --city <id>`, the
# server's `run.start` / `scenario.load` with a `city`, and the Studio's city picker.
#
# What is here: the largest city of every US state and of the District of Columbia, plus
# the cities most studied for connected vehicles where they differ (the USDOT connected-
# vehicle pilots in New York and Tampa, Ann Arbor's connected environment, Smart Columbus,
# Pittsburgh's adaptive signals, and the large Texas and California cores), and Berlin-Mitte
# for the European stack. Each entry is a downtown box of about 1.5 km x 1.5 km chosen to
# take in the core's signalised arterials.
#
# Fields:
#   id              the city's name in every interface; its extract is worlds/cache/<id>.osm.xml
#   name, state     what a person reads; `state` is the USPS code
#   region          northeast, southeast, south, midwest, southwest, west (US Census-style)
#   role            largest (the state's largest city), studied (a connected-vehicle study
#                   site or large core), metro (the largest metropolitan core), international
#   bbox            [south, west, north, east] degrees, WGS 84. It fixes the world frame: the
#                   south-west corner is the origin, so re-fetching cannot move a coordinate.
#   utc_offset_h    standard-time offset, for a scenario's `time.local_start`
#   highway_preset  the jurisdiction's default speed limits and rules of the road
#                   (crates/v2xw-world/src/jurisdiction.rs cites each one)
#   fetched         the date the extract was downloaded, which becomes `world.imported_at`
#   description     the area the box covers
#   drive_lane_km   kilometres of driving lane in the imported network, and
#   signals         signalised intersections in it — both measured by the city audit
#                   (`cargo run -p v2xw-cli --bin city_audit -- <scenario>`); a fixed
#                   arrival rate moved to another city is rescaled by the lane-km ratio
#
# Every city is imported and its traffic run under the traffic auditor before it is offered:
# 90 simulated seconds at 12.5 vehicles per hour per kilometre of driving lane (Midtown's
# 1,500 veh/h, the load of the validation suite's cities checks) with 100 pedestrians and
# eight roadside units placed at its signalised intersections. A city passes when it imports,
# vehicles complete trips, the units find intersections, and no safety invariant is broken
# (collisions, red-light entries, vehicles in buildings, pedestrians hit, impossible motion).
# A city's world leaves out `highway=service` alleys and driveways (world.service_roads).
#
# Source and licence: the extracts are OpenStreetMap data, (c) OpenStreetMap contributors,
# available under the Open Database License (ODbL) 1.0, https://www.openstreetmap.org/copyright.
# They are fetched from the Overpass API by `worlds/fetch.sh` and never committed (they are
# large and ODbL share-alike); a world built from one carries the attribution.
#
# Fetch one with `worlds/fetch.sh <id>`, every missing one with `worlds/fetch.sh --all`.
# A city that fails to import or whose traffic does not pass the auditor is listed under
# `dropped:` with the reason instead of shipping broken.
schema: v2xw/cities/1
source: "OpenStreetMap, via the Overpass API (worlds/fetch.sh)"
licence: "ODbL-1.0"
attribution: "(c) OpenStreetMap contributors, ODbL 1.0, https://www.openstreetmap.org/copyright"


# ============================================================================
# The whole US SCMS in one five-minute run: every entity doing its job with the vehicles.
# ============================================================================
#
# Open it in the page and press Backend. Every authority of the CAMP / USDOT SCMS is there
# with its own queue, keys and messages — the SCMS Manager and Policy Generator, the
# electors, the offline Root CA, the Intermediate CA, the Device Configuration Manager, the
# Enrolment CA, the Location Obscurer Proxy, the Registration Authority, both Linkage
# Authorities, the Pseudonym CA, the Misbehaviour Authority, the CRL Generator and Store —
# and the vehicles reach them only over cellular Uu or through the roadside unit's backhaul,
# never over the safety channel. What a run shows:
#
#  * bootstrap: every vehicle is enrolled through the DCM with the electors' trust list,
#    the chain file and the RA's policy file before it drives;
#  * pseudonym batches: each i-period's certificates, a batch at a time, and a top-up through
#    the LOP when the vehicle is down to its last period — encrypted batch files it downloads
#    after the RA's request shuffle and the Linkage Authorities' pre-linkage values;
#  * certificate change inside a batch on the J2945/1 five-minute rule, and the move to the
#    next i-period's certificates at the rollover;
#  * enrolment renewal: an enrolment certificate near its end is replaced by a successor
#    from the Enrolment CA;
#  * misbehaviour: a few vehicles broadcast a false position from 60 s; honest vehicles
#    report them over cellular or through the roadside unit, the RA shuffles the reports,
#    the MA investigates through the PCA and both LAs, the RA blocklists the enrolment (no
#    more top-ups, no successor) and the CRL Generator publishes the linkage seeds, which the
#    vehicles download and the roadside unit repeats on the air.
#
# ## What is compressed, and why it is safe to read the rest as real
#
# The real calendar does not fit in five minutes: an i-period is a week (CAMP-EE
# §2.1.5.3.2), an enrolment certificate lasts years, the RA's report shuffle is "10,000
# reports or one day" (CAMP-EE SCMS-765) and the CRL is published daily (Brecht 2018
# §VI-G). `security.protocol.params` scales exactly those windows down and leaves every
# other number — certificate and message sizes, cryptographic costs, the protocol steps and
# who may see what — as cited. A top-up here happens every minute instead of every week;
# what a top-up *is* has not changed. Quote no latency from this file without substituting
# the real windows back (they are separate stages of the decomposition).
#
# The six-year enrolment lifetime is compressed to ten minutes so renewals happen at all;
# each vehicle's enrolment is somewhere in its life when the run starts (uniform), so a
# share of the fleet renews during the run.
schema: v2xw/scenario/1

meta:
  name: credential-lifecycle
  description: >-
    Every US SCMS entity in the loop with the vehicles on a small procedural grid:
    bootstrap, pseudonym batches and top-ups through the LOP, certificate change,
    enrolment renewal, misbehaviour reports, revocation through the LAs and the CRL, with
    the deployment calendar compressed to five minutes and everything else cited.
  authors: [v2xw]
  tags: [scms, credentials, backend, revocation, procedural]
  created: "2026-09-29"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T08:00:00Z"
  duration_s: 300.0
  mobility_step_ms: 100
  des_resolution: 1us

world:
  source:
    kind: procedural
    generator: world/source/procedural-grid
    params:
      # Five avenues by eight streets of the Midtown grid: 1.1 km by 0.6 km, small enough
      # that the debug build runs it in real time and the one roadside unit reaches most of
      # it.
      cols: 5
      rows: 8
      block_x_m: 274.0
      block_y_m: 80.0
      lanes_per_direction: 2
      lane_width_m: 3.5
      sidewalk_m: 2.0
      speed_limit_mps: 11.176
      signalised: true
      cycle_s: 60.0
      amber_s: 3.0
      crossings: true
      block_buildings: true
      building_height_m: 30.0
      rsu_at_junctions: false
      corner_radius_m: 4.5
  imported_at: "2026-09-18T00:00:00Z"
  buildings:
    enabled: true
    keep_holes: true
  terrain:
    dem: null

actors:
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      rate_veh_per_h: 1500.0

  # One roadside unit in the middle of the grid, on its backhaul: it forwards the reports
  # vehicles hand it, relays top-ups for a vehicle without a modem, and repeats the CRL on
  # the air.
  rsus:
    - position_m: [548.0, 280.0, 0.0]
      roles: [report-forward, crl, provisioning-proxy]
      profile: rsu/cohda-mk5-rsu

  backend:
    protocol: protocol/scms/camp

weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    propagation: medium
    phy: medium
    mac: medium

net:
  layer: wsmp
  # Every vehicle has a cellular modem: requests, batch downloads, reports and CRL fetches
  # go over Uu.
  uu:
    id: cellular/uu/fixed-latency
    params: {preset: 4g-east-coast}

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  # A detector only judges what the node verified; see revocation-latency.yaml.
  verification_policy: verify-all
  signer_id_policy:
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    strategy: time
    period_s: 300.0
  protocol:
    id: protocol/scms/camp
    params:
      # One-minute i-periods, each certificate valid a second past its period (the real
      # hour of overlap, scaled), five certificates a period, two periods held, a top-up
      # when one is left.
      i_period_s: 60
      cert_lifetime_s: 61
      certs_per_period: 5
      pool_periods: 2
      topup_below_periods: 1
      cert_shuffle_window_s: 5
      first_batch_delay_s: 2
      download_poll_interval_s: 2
      # Enrolment certificates of ten minutes, renewed two minutes before they end.
      enrolment_lifetime_s: 600
      reenrol_lead_s: 120
      # The report shuffle and the CRL cadence at thirty seconds each, and a CRL poll every
      # thirty seconds over Uu.
      report_shuffle_window_s: 30
      crl_cadence_s: 30
      crl_fetch_interval_s: 30

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

threats:
  attackers:
    - id: threat/attacker/legacy/ConstPos
      fraction: 0.05
      schedule:
        from_s: 60.0
        to_s: 300.0

detection:
  local:
    - id: detect/legacy-12
  # The Misbehaviour Authority decides on independent evidence over time
  # (threat/ma/corroborated): reports about one pseudonym are correlated into events — one
  # glitch heard by ten receivers is one piece of evidence, not ten — an event counts when
  # two independent trusted reporters witnessed it, and revocation takes four such events
  # inside a minute from at least three reporters. The legacy persistence gate
  # (threat/ma/legacy-window) counted one event heard by many as many and revoked honest
  # vehicles in dense traffic.
  ma:
    id: threat/ma/corroborated

metrics: [all]
exporters: []

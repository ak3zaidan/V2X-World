# Radio sensitivity rows for the C-V2X sidelink (LTE-V2X mode 4 and NR-V2X mode 2).
# `v2xw sensitivity scenarios/sensitivity/radio-cv2x.yaml`; the same rows run one test each
# in crates/v2xw-engine/tests/sensitivity_radio.rs. docs/validation/sensitivity-radio.md
# gives the theory and the measured table.
base: lte-grid.yaml
rows:
  # Link budget.
  - name: LTE tx power 20->5 dBm
    set: {radio.devices.obu.tx_power_dbm: 5.0}
    metric: range90_m
    expect: down
    source: log-distance link budget; -15 dB moves the PRR edge in by 10^(15/10n)
  - name: LTE tx power 20->5 dBm
    set: {radio.devices.obu.tx_power_dbm: 5.0}
    metric: prr_600_1000
    expect: down
  - name: LTE noise figure 9->15 dB (5 dBm)
    base_set: {radio.devices.obu.tx_power_dbm: 5.0}
    set: {radio.sidelink.noise_figure_db: 15.0}
    metric: prr_600_1000
    expect: down
    source: noise floor = kTB + NF (TR 36.885 A.1.1); +6 dB NF is -6 dB SNR
  - name: LTE MCS 7->11
    base_set: {radio.devices.obu.tx_power_dbm: 5.0}
    set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {mcs: 11}}}
    metric: prr_600_1000
    expect: down
    source: a higher MCS needs a higher SINR for the same BLER (TS 36.213 Table 8.6.1-1)
  - name: LTE MCS 5->7
    base_set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {mcs: 5}}}
    set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {mcs: 7}}}
    metric: cbr_mean
    expect: down
    source: >-
      a higher MCS carries the same transport block on fewer sub-channels (TS 36.213 Table
      7.1.7.2.1-1), and CBR counts busy sub-channels. Measured on MCS 5 -> 7 since the real
      80 B pseudonym certificate (WP-C1; CAMP Table 3): a signed BSM is 161 B with a digest
      and 225 B with the certificate, and J3161/1's two-sub-channel minimum carries 288 B at
      MCS 7 and 462 B at MCS 11, so 7 -> 11 moves nothing (0.1784 -> 0.1783). At MCS 5 two
      sub-channels carry 210 B, so a certificate frame takes three, and MCS 7 takes it in two
      (docs/design/scms-real/testing/rerun-2026-10-22.md §1)
  - name: LTE MCS 7->11
    set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {mcs: 11}}}
    metric: airtime_us
    expect: same
    source: a sidelink transmission is one subframe (1 ms) whatever the MCS; the MCS moves frequency, not time
  - name: LTE certificate on every message
    base_set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {mcs: 5}}}
    set: {security.signer_id_policy.full_cert_every_ms: 0, security.signer_id_policy.digest_otherwise: false}
    metric: cbr_mean
    expect: up
    source: >-
      the larger transport block needs more sub-channels at the same MCS. At MCS 5: the
      225 B certificate frame needs three sub-channels where the 161 B digest frame needs two;
      at MCS 7 both fit the two-sub-channel minimum (288 B) since the real 80 B certificate
      (rerun-2026-10-22.md §1)
  # Load.
  - name: LTE vehicles 40->120
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: cbr_mean
    expect: up
    source: CBR is the busy share of sub-channels (TS 36.214 5.1.30), linear in offered load
  - name: LTE vehicles 40->120
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: collision_rate
    expect: up
  - name: LTE vehicles 40->120
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: prr
    expect: down
  - name: LTE vehicles 40->120
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: e2e_ms_mean
    expect: same
    min_change: 0.1
    source: >-
      SPS e2e is the reservation's offset after generation, uniform over the selection window
      whatever the load (TS 36.213 14.1.1.6): about 50 ms, and its mean over 40 vehicles
      carries about +-4.6 ms of sampling spread. Load adds the verify wait (+3.4 ms at 115
      vehicles). Measured 67.66 -> 65.12 ms: access 52.0 -> 46.1, verify wait 0.09 -> 3.51
      (rerun-2026-10-22.md §1). It was `up` (59.5 -> 63.6 ms before), inside the same spread
  - name: LTE rate 10->20 Hz (RRI 50)
    base_set: {time.mobility_step_ms: 50, radio.sidelink.reservation_interval_ms: 50}
    set: {messages.rate_hz: 20.0}
    metric: cbr_mean
    expect: up
    band: [1.5, 2.5]
  # Blind retransmissions.
  - name: LTE transmissions 2->1
    set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {max_transmissions: 1}}}
    metric: cbr_mean
    expect: down
    band: [0.4, 0.65]
    source: each blind retransmission occupies another sub-channel set (TS 36.213 14.1.1.4C)
  - name: LTE transmissions 2->1
    base_set: {radio.devices.obu.tx_power_dbm: 5.0}
    set: {radio.models.sidelink: {id: access/sidelink/engine-coupling, params: {max_transmissions: 1}}}
    metric: prr
    expect: down
    source: >-
      HARQ combining of the blind copy recovers marginal links, so the row runs where links
      are marginal (5 dBm, as the MCS and noise-figure rows): 0.886 -> 0.783. At 20 dBm the
      links inside 1 km are not marginal and the copy only adds collisions (collision rate
      0.0116 -> 0.0010 without it): PRR 0.985 -> 0.990 (rerun-2026-10-22.md §1)
  # SPS.
  - name: LTE RRI 100->50 ms
    set: {radio.sidelink.reservation_interval_ms: 50}
    metric: access_ms
    expect: down
    band: [0.4, 0.7]
    source: a packet waits for its next reserved slot, on average about RRI/2
  - name: LTE keep probability 0.8->0
    set: {radio.sidelink.resource_keep_probability: 0.0}
    metric: sl_selections
    expect: up
    band: [1.6, 4.0]
    source: reselection after each reselection counter expiry unless kept with P (TS 36.321 5.14.1.1)
  # Sensing acts at (re)selections, and every UE powers on at t = 0 with an empty sensing
  # window, so its first pick is blind either way. With exact periodic phases, keep
  # probability 0.8 and 5 to 15 periods per counter, a 3 s run holds 40 blind first picks
  # against about 13 reselections, and its collision count is set by one or two persistent
  # pairs: on this seed one UE whose both copies collided carried 697 of the 722 losses
  # (sensing on 0.0161, off 0.0020). Seeds 0x1111 and 0x2222 at 3 s go the other way
  # (0.0009 / 0.0142, 0.0010 / 0.0077); at 8 s every seed tried has sensing ahead (this one
  # 0.0072 / 0.0105, 0x1111 0.0003 / 0.0082, 0x2222 0.0005 / 0.0101, 0x3333 0.0142 /
  # 0.0203). radio-2026-10-24.md §6.
  - name: LTE sensing off
    base_set: {time.duration_s: 8.0}
    set: {radio.sidelink.sensing: false}
    metric: collision_rate
    expect: up
    source: random selection baseline (Ali 2021 II.1) loses the sensing exclusion, in steady state (8 s)
  - name: LTE sensing off
    base_set: {time.duration_s: 8.0}
    set: {radio.sidelink.sensing: false}
    metric: sl_overlapping
    expect: up
  - name: LTE RSRP threshold -> -60 dBm
    set: {radio.sidelink.rsrp_threshold_dbm: -60.0}
    metric: collision_rate
    expect: changes
    min_change: 0.05
    source: non-monotone (Gonzalez-Martin 2019); the direction depends on density
  # NR-V2X twins.
  - name: NR tx power 20->5 dBm
    base_set: {radio.rat: nr-v2x-pc5}
    set: {radio.devices.obu.tx_power_dbm: 5.0}
    metric: range90_m
    expect: down
  - name: NR vehicles 40->120
    base_set: {radio.rat: nr-v2x-pc5}
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: cbr_mean
    expect: up
  - name: NR vehicles 40->120
    base_set: {radio.rat: nr-v2x-pc5}
    set: {actors.vehicles.demand.params.max_total_vehicles: 120}
    metric: collision_rate
    expect: up
  - name: NR noise figure 9->15 dB (5 dBm)
    base_set: {radio.rat: nr-v2x-pc5, radio.devices.obu.tx_power_dbm: 5.0}
    set: {radio.sidelink.noise_figure_db: 15.0}
    metric: prr_600_1000
    expect: down
  - name: NR keep probability 0->0.8
    base_set: {radio.rat: nr-v2x-pc5}
    set: {radio.sidelink.resource_keep_probability: 0.8}
    metric: sl_selections
    expect: down
    band: [0.3, 0.7]
    source: at each counter expiry a new selection happens with 1 - P (TS 38.321 5.22.1.1; NR's default sl-ProbResourceKeep is 0)

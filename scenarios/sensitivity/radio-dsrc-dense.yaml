# Radio sensitivity rows for 802.11p on the dense base (about a hundred vehicles in a 300 m
# square, every one in range of every other): EDCA, the MAC queue and congestion control,
# where contention decides the outcome. Run with `v2xw sensitivity`; the same rows are tests
# in crates/v2xw-engine/tests/sensitivity_radio.rs (docs/validation/sensitivity-radio.md).
base: dsrc-dense.yaml
rows:
  - name: CWmin 3->63
    base_set: {radio.dcc.enabled: false}
    set: {radio.mac.cw_min_vo: 63}
    metric: backoff_us
    expect: up
    source: mean backoff is CW/2 slots of 13 us (IEEE 802.11-2020 10.3.2.3; EN 302 663 Table B.3)
  - name: CWmin 3->63
    base_set: {radio.dcc.enabled: false}
    set: {radio.mac.cw_min_vo: 63}
    metric: access_ms
    expect: up
  - name: AIFSN 2->9
    base_set: {radio.dcc.enabled: false}
    set: {radio.mac.aifsn_vo: 9}
    metric: aifs_us
    expect: up
    band: [2.0, 3.0]
    source: AIFS = SIFS + AIFSN x slot = 32 + 13 AIFSN us at 10 MHz, 58 -> 149 us
  - name: AIFSN 2->9
    base_set: {radio.dcc.enabled: false}
    set: {radio.mac.aifsn_vo: 9}
    metric: access_ms
    expect: up
  - name: queue 64->1, saturated
    base_set: {radio.dcc.enabled: false, messages.rate_hz: 50.0, time.mobility_step_ms: 20}
    set: {radio.mac.queue_length: 1}
    metric: mac_drops
    expect: up
    source: a full single-slot queue drops each new frame while one waits for the channel
  - name: reactive DCC off->on
    base_set: {radio.models.dcc: {id: dcc/etsi/reactive-ts102687}, radio.dcc.enabled: false, messages.rate_hz: 20.0, time.mobility_step_ms: 50}
    set: {radio.dcc.enabled: true}
    metric: cbr_mean
    expect: down
    source: the reactive states cap the rate as CBR crosses 30/40/50/60 % (TS 102 687 V1.2.1 Table A.1)
  - name: reactive DCC off->on
    base_set: {radio.models.dcc: {id: dcc/etsi/reactive-ts102687}, radio.dcc.enabled: false, messages.rate_hz: 20.0, time.mobility_step_ms: 50}
    set: {radio.dcc.enabled: true}
    metric: tx_rate_hz
    expect: down
  - name: reactive DCC off->on
    base_set: {radio.models.dcc: {id: dcc/etsi/reactive-ts102687}, radio.dcc.enabled: false, messages.rate_hz: 20.0, time.mobility_step_ms: 50}
    set: {radio.dcc.enabled: true}
    metric: aoi_ms
    expect: up
  - name: J2945/1 B 25->5
    set: {radio.dcc.density_coefficient: 5.0}
    metric: tx_rate_hz
    expect: down
    source: ITT = 100 ms x N/B above B, capped at vMax_ITT 600 ms (SAE J2945/1 6.3.6)
  - name: J2945/1 B 25->5
    set: {radio.dcc.density_coefficient: 5.0}
    metric: cbr_mean
    expect: down
  - name: J2945/1 B 25->5
    set: {radio.dcc.density_coefficient: 5.0}
    metric: ipg_ms_mean
    expect: up
  - name: ETSI adaptive target 0.68->0.15
    base_set: {radio.models.dcc: {id: dcc/etsi/adaptive-ts102687}, messages.rate_hz: 20.0, time.mobility_step_ms: 50}
    set: {radio.dcc.cbr_target: 0.15}
    metric: cbr_mean
    expect: down
    source: LIMERIC steers the duty cycle until CBR meets the target (TS 102 687 V1.2.1 5.4)
  - name: ETSI adaptive target 0.68->0.15
    base_set: {radio.models.dcc: {id: dcc/etsi/adaptive-ts102687}, messages.rate_hz: 20.0, time.mobility_step_ms: 50}
    set: {radio.dcc.cbr_target: 0.15}
    metric: tx_rate_hz
    expect: down

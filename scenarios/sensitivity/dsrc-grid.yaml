# The base of the radio sensitivity checks (docs/validation/sensitivity-radio.md).
#
# A small procedural grid in open air: 6 x 6 blocks of 200 m (1.2 km square, no buildings),
# so every distance from 0 to about 1 km occurs and nothing but the radio decides who hears
# whom. Forty vehicles are bulk-spawned through the demand model's trip cap, and the run is
# three seconds: long enough for 30 BSMs per vehicle and three metric windows, short enough
# that a row (base plus change) costs seconds. The rows change one field at a time on the
# same seed (crates/v2xw-engine/src/sensitivity.rs).
schema: v2xw/scenario/1

meta:
  name: sensitivity-dsrc-grid
  description: >-
    Open-air 1.2 km procedural grid with a bulk-spawned fleet of forty, 802.11p with BSMs,
    for one-at-a-time radio sensitivity checks.
  authors: [v2xw]
  tags: [sensitivity, validation, dsrc, procedural]
  created: "2026-10-11"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T08:00:00Z"
  duration_s: 3.0
  mobility_step_ms: 100
  des_resolution: 1us

world:
  source:
    kind: procedural
    generator: world/source/procedural-grid
    params:
      cols: 6
      rows: 6
      block_x_m: 200.0
      block_y_m: 200.0
      lanes_per_direction: 1
      lane_width_m: 3.5
      sidewalk_m: 2.0
      speed_limit_mps: 13.9
      signalised: false
      crossings: false
      block_buildings: false
      rsu_at_junctions: false
  imported_at: "2026-09-18T00:00:00Z"
  buildings:
    enabled: false
    keep_holes: true
  terrain:
    dem: null

actors:
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      rate_veh_per_h: 3600000.0
      params:
        max_total_vehicles: 40

weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    propagation: medium
    phy: medium
    mac: medium

net:
  layer: wsmp

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  verification_policy: verify-all
  signer_id_policy:
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    strategy: time
    period_s: 300.0

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

metrics: [cbr]
exporters: []

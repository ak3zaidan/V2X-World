# ============================================================================
# The credential lifecycle on the deployment's own calendar: a week of the US SCMS, with
# the quiet stretches fast-forwarded.
# ============================================================================
#
# `credential-lifecycle.yaml` compresses the calendar so that every stage fits in five
# radio minutes. This file runs the same fleet, roadside unit, detectors and corroborating
# MA on the REAL calendar (WP-D2) — one-week i-periods from 2015-01-06 04:00 Eastern, the
# CAMP 1.2.2 certificate shuffle (1,000 requests or 2 days), the RA's report shuffle
# (10,000 reports or one day), the CV-pilot manual MA review (8 h, an assumption), the
# provider's "within 1 business day" CRL publication at its 10:00 Eastern slot (US
# federal holidays observed), an hourly CRL fetch and the six-year enrolment — and lets
# the weeks pass with `time.fast_forward`: inside a window the traffic is frozen where it
# stands, no radio frame is generated, and only the backend runs, stopping at each of its
# events on the mobility-step grid. What a run shows, in order:
#
#  * 0–900 s, radio on (Tuesday 2026-10-20 08:50 UTC): bootstrap, the liars from 60 s,
#    the detectors and their reports; at 600 s the i-period rolls from 614 to 615 and
#    every vehicle tops up through the LOP;
#  * fast-forward to Thursday 15:20 UTC: the report shuffle releases a day later, the MA
#    operator reviews for eight hours, the CRL Generator publishes at Thursday's 10:00 ET
#    slot, and the vehicles' hourly fetches bring the list down;
#  * 300 s of radio: the revoked liars are refused on the air;
#  * fast-forward to the next Tuesday's rollover (i = 616): every honest vehicle tops up
#    again and the blocklisted ones are refused;
#  * 300 s of radio to end.
#
# Every number is the deployment's; nothing is compressed. The manifest lists each
# fast-forward window, and radio and traffic metrics are not observed inside them.
schema: v2xw/scenario/1

meta:
  name: credential-weeks
  description: >-
    The US SCMS lifecycle on the real calendar over one week: top-ups at the real
    i-period rollover, the real shuffles, the manual MA review and the business-day CRL,
    with the quiet stretches fast-forwarded and the radio on around each event.
  authors: [v2xw]
  tags: [scms, credentials, backend, revocation, calendar, fast-forward, procedural]
  created: "2026-10-17"
  base: credential-lifecycle.yaml

time:
  # Ten minutes before the Tuesday 09:00 UTC i-period boundary (04:00 EST from the 2015
  # epoch, kept in UTC across daylight saving; 03 §6.1).
  t0: "2026-10-20T08:50:00Z"
  calendar: real
  duration_s: 606000.0
  fast_forward:
    - {from_s: 900.0, to_s: 196200.0}
    - {from_s: 196500.0, to_s: 605700.0}

security:
  # The base's compressed values removed: every lifecycle parameter takes its cited
  # default (`ScmsParams::default`, the MA's manual review, the deployment's CRL rule).
  protocol:
    id: protocol/scms/camp
    params:
      i_period_s: null
      cert_lifetime_s: null
      certs_per_period: null
      pool_periods: null
      topup_below_periods: null
      cert_shuffle_window_s: null
      first_batch_delay_s: null
      download_poll_interval_s: null
      enrolment_lifetime_s: null
      reenrol_lead_s: null
      reenrol_download_delay_s: null
      report_shuffle_window_s: null
      ma_review_s: null
      crl_cadence_s: null
      crl_fetch_interval_s: null

threats:
  attackers:
    - id: threat/attacker/legacy/ConstPos
      fraction: 0.05
      schedule:
        from_s: 60.0
        to_s: 606000.0

# Post-quantum at realistic density: the Midtown quarter-fleet benchmark (2,250 veh/h, 500
# pedestrians, 50 cyclists, 30 RSUs, the US SCMS on the real calendar) for its first 60 s,
# live, with SDU fragmentation on and a software-crypto OBU that has published post-quantum
# costs. This file is the classical ECDSA P-256 base on that OBU; the pq-density-*.yaml
# files change only the signature scheme (and, for the cert-cycle file, the fragmenter).
# Same seed throughout.
schema: v2xw/scenario/1
meta:
  name: pq-density-base
  description: >-
    The Midtown quarter-fleet benchmark for 60 s live with SDU fragmentation and a
    software-crypto OBU: the classical base of the post-quantum density runs.
  authors: [v2xw]
  tags: [post-quantum, fragmentation, benchmark, manhattan]
  base: ../real-world/midtown-scms-benchmark-quarter.yaml
time:
  duration_s: 60.0
  warmup_s: 30.0
  fast_forward: []
net:
  fragmenter:
    id: fragmenter/generic-sdu
nodes:
  default_obu: obu/generic-automotive-soc-no-hsm

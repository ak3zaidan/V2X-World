# Midtown Manhattan, evening rush hour with heavy congestion.
#
# The baseline deployment (base/midtown.yaml) at 17:00 Eastern with:
#
#  * demand at the "Rush hour" preset, 4,500 veh/h: 1.5 × midday, the HCM peak-hour factor
#    (about 9 % of a day's traffic in the peak hour, HCM 6th ed.) over FHWA's Traffic
#    Monitoring Guide midday hour (about 6 %);
#  * the peak building: demand rises a further 30 % from the second minute and the run's
#    busiest stretch is 5,850 veh/h (a `demand.multiplier` window, 60-240 s);
#  * a lane-blocking breakdown at 90 s that stands for three minutes (`safety.breakdown`,
#    hazard lights on), the incident that turns a busy avenue into a queue;
#  * West 45th Street closed for works for the whole run (`closure`), which pushes its
#    cross-town traffic onto the neighbouring streets.
#
# It is still a scaled Midtown — real volumes are about forty times the engine's
# interactive level on this extract (BUILD-STATUS, traffic calibration) — so the congestion
# here comes from the incident and the closure concentrating traffic, as it does in the city.
# Read the channel busy ratio and the delivery ratio against midtown-normal.yaml.
schema: v2xw/scenario/1

meta:
  base: base/midtown.yaml
  name: Midtown Manhattan - evening rush hour
  description: >-
    Midtown Manhattan at 5 pm with rush-hour demand that keeps building, a broken-down car
    blocking a lane and a cross-town street closed for works: queues, a crowded radio
    channel and the credential system under load.
  tags: [manhattan, traffic, rush-hour, congestion, incident, scms, dsrc]

time:
  t0: "2027-03-04T22:00:00Z"

actors:
  vehicles:
    demand:
      rate_veh_per_h: 4500.0

events:
  - {t: 60.0, until: 240.0, type: demand.multiplier, value: 1.3}
  - {t: 90.0, until: 270.0, type: safety.breakdown, target: auto}
  - {t: 0.0, type: closure, target: "street:West 45th Street"}

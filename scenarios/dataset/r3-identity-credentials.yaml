# Mini release run 3 (train): Identity, Credentials, Flooding and the evasion of the MA,
# a constant jammer for 10 s, the roadside unit dropping the reports it relays, and a
# passive eavesdropper (truth-only: it labels tracking, not messages).
schema: v2xw/scenario/1
# Its own seed: no two runs share traffic, so a split by run is a split by traffic.
seed: "0xD5_0003"
meta: {base: base.yaml, name: dataset r3 identity-credentials}
threats:
  attackers:
    - {id: threat/attacker/legacy/Sybil, actor_ids: [24], schedule: {from_s: 40.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/InvalidSignature, actor_ids: [47], schedule: {from_s: 20.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/ExpiredCert, actor_ids: [40], schedule: {from_s: 0.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/NotYetValid, actor_ids: [14], schedule: {from_s: 0.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/Disruptive, actor_ids: [56], schedule: {from_s: 0.0, to_s: 75.0}}
    - id: threat/attacker/evasion/BenignClassMimic
      actor_ids: [38]
      params: {payload: ConstPos, secmark_shift_ms: 25, stated_accuracy_m: 9.0}
      schedule: {from_s: 35.0, to_s: 75.0}
    - id: threat/attacker/evasion/BenignClassMimic
      actor_ids: [21]
      params: {payload: ConstPos, secmark_shift_ms: 25, stated_accuracy_m: 9.0}
      schedule: {from_s: 0.0, to_s: 75.0}
    - {id: threat/attacker/legacy/DelayedMessages, actor_ids: [4], schedule: {from_s: 0.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/DataReplay, actor_ids: [25], schedule: {from_s: 15.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/Teleport, actor_ids: [57], schedule: {from_s: 40.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/RandomPos, actor_ids: [1], schedule: {from_s: 15.0, to_s: 75.0}}
  jammers:
    - id: attacker/jammer/constant
      params: {position_m: [548.0, 280.0], power_dbm: 20, from_s: 40.0, to_s: 50.0}
  compromised_rsus: [0]
  compromised_rsu_attack:
    id: threat/attacker/compromised-rsu
    params: {kind: SuppressForwardedReports, suppress_prob: 0.8, from_s: 15.0, to_s: 75.0}
  eavesdropper: {id: threat/observer/passive-privacy}
exporters:
  - id: dataset
    opts: {run_id: r03, split: train, tier: mini, instrumented_receivers: 10, heldout_attacks: [ReversedHeading, HeadingOffset]}

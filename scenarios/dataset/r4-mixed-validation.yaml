# Mini release run 4 (validation): one attack from most families, a reactive jammer for
# 10 s and the roadside unit adding forged entries to the CRL it repeats.
schema: v2xw/scenario/1
# Its own seed: no two runs share traffic, so a split by run is a split by traffic.
seed: "0xD5_0004"
meta: {base: base.yaml, name: dataset r4 mixed-validation}
threats:
  attackers:
    - {id: threat/attacker/legacy/ConstPos, actor_ids: [7], schedule: {from_s: 15.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/ConstPosOffset, actor_ids: [36], schedule: {from_s: 15.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/PosHeadingInconsistent, actor_ids: [16], schedule: {from_s: 40.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/OutOfOrder, actor_ids: [51], schedule: {from_s: 0.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/Disruptive, actor_ids: [54], schedule: {from_s: 15.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/Sybil, actor_ids: [58], schedule: {from_s: 0.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/InvalidSignature, actor_ids: [25], schedule: {from_s: 40.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/DataReplay, actor_ids: [59], schedule: {from_s: 40.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/RandomSpeed, actor_ids: [44], schedule: {from_s: 25.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/PosSpeedInconsistent, actor_ids: [21], schedule: {from_s: 25.0, to_s: 75.0}}
    - {id: threat/attacker/legacy/EventualStop, actor_ids: [55], schedule: {from_s: 0.0, to_s: 75.0}}
    - id: threat/attacker/evasion/BenignClassMimic
      actor_ids: [28]
      params: {payload: ConstPos, secmark_shift_ms: 25, stated_accuracy_m: 9.0}
      schedule: {from_s: 25.0, to_s: 75.0}
  jammers:
    - id: attacker/jammer/reactive
      params: {position_m: [548.0, 280.0], power_dbm: 20, trigger_dbm: -85, from_s: 40.0, to_s: 50.0}
  compromised_rsus: [0]
  compromised_rsu_attack:
    id: threat/attacker/compromised-rsu
    params: {kind: FalseCrl, fabricated_entries: 3, from_s: 15.0, to_s: 75.0}
exporters:
  - id: dataset
    opts: {run_id: r04, split: validation, tier: mini, instrumented_receivers: 10, heldout_attacks: [ReversedHeading, HeadingOffset]}

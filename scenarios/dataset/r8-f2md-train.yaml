# Mini release run 8 (train): the six F2MD / VeReMi NextGen behaviours of train (one of
# each family the twelve cover: acceleration, position, speed, timing, flooding,
# identity), with run 10, and two credential attacks. Runs 9 and 11 hold the other six
# for test.
schema: v2xw/scenario/1
# Its own seed: no two runs share traffic, so a split by run is a split by traffic.
seed: "0xD5_0008"
meta: {base: base.yaml, name: dataset r8 f2md-train}
time: {duration_s: 60.0}
threats:
  attackers:
    - {id: threat/attacker/f2md/FeignedBraking, actor_ids: [52], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/FeignedBraking, actor_ids: [40], schedule: {from_s: 12.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/PositionMirroring, actor_ids: [9], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/PositionMirroring, actor_ids: [27], schedule: {from_s: 12.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/ConstSpeed, actor_ids: [51], schedule: {from_s: 28.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/NeighbourReplay, actor_ids: [23], schedule: {from_s: 16.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DoSDisruptive, actor_ids: [11], schedule: {from_s: 16.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DataReplaySybil, actor_ids: [38], schedule: {from_s: 28.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DataReplaySybil, actor_ids: [42], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/legacy/Sybil, actor_ids: [24], schedule: {from_s: 20.0, to_s: 60.0}}
    - {id: threat/attacker/legacy/ExpiredCert, actor_ids: [57], schedule: {from_s: 32.0, to_s: 60.0}}
exporters:
  - id: dataset
    opts: {run_id: r08, split: train, tier: mini, instrumented_receivers: 10, heldout_attacks: [ReversedHeading, HeadingOffset]}

# Mini release run 11 (test): the test F2MD / VeReMi NextGen behaviours again (with
# run 9, three vehicles each).
schema: v2xw/scenario/1
# Its own seed: no two runs share traffic, so a split by run is a split by traffic.
seed: "0xD5_0011"
meta: {base: base.yaml, name: dataset r11 f2md-test-b}
time: {duration_s: 60.0}
threats:
  attackers:
    - {id: threat/attacker/f2md/AccelerationMultiplication, actor_ids: [22], schedule: {from_s: 28.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/UniformRandomPos, actor_ids: [59], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/ZeroSpeedReport, actor_ids: [39], schedule: {from_s: 32.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/ZeroSpeedReport, actor_ids: [53], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/RandomSpeedOffset, actor_ids: [30], schedule: {from_s: 0.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/RandomSpeedOffset, actor_ids: [38], schedule: {from_s: 20.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DoSRandomSybil, actor_ids: [52], schedule: {from_s: 12.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DoSRandomSybil, actor_ids: [41], schedule: {from_s: 28.0, to_s: 60.0}}
    - {id: threat/attacker/f2md/DoSDisruptiveSybil, actor_ids: [7], schedule: {from_s: 28.0, to_s: 60.0}}
exporters:
  - id: dataset
    opts: {run_id: r11, split: test, tier: mini, instrumented_receivers: 10, heldout_attacks: [ReversedHeading, HeadingOffset]}

# The packet-level Uu base for the TLS pair: every backend message of a cellular vehicle
# (reports, CRL polls, top-ups) rides TCP CUBIC with TLS 1.3 over cellular/uu/packet-pf,
# where security.scms.tls acts (on the realism base the abstract Uu carries no TLS, so
# tls12.yaml is inert there: row tls12-no-tcp). Shortened to the 0-60 s live window and
# the 43,185-43,290 s rollover window (rerun-2026-10-26 §1.3, §2.2): the reports start at
# 20 s and the top-ups at 43,200 s; a top-up completes ~60.1 s later (M0), so the window must
# run past 43,261 s.
schema: v2xw/scenario/1
meta: {base: ../midtown-scms-realism.yaml, name: Midtown SCMS matrix uu-tls13}
time:
  duration_s: 43290.0
  fast_forward:
    - {from_s: 60.0, to_s: 43185.0}
net:
  uu:
    id: cellular/uu/packet-pf
    params: {rat: lte, isd_m: 500, penetration: 0.8}

  name: On-air security audit, P2PCD
  description: >-
    The on-air audit base with home-provider chain files, so unknown issuers are learned
    by P2PCD on the air.
  tags: [real-world, manhattan, scms, audit, on-air, p2pcd]
time:
  duration_s: 60.0
security:
  scms:
    chain_file: home-provider

# Downtown Portland on its measured ground (WP-26 P26.2): the portland-downtown.yaml run
# with the 1 arc-second DEM worlds/dem/portland-downtown.asc under it (AWS Terrain Tiles
# skadi N45W123, WGS84/EGM96 geoid, metres; provenance, licence and the grade histogram in
# worlds/dem/portland-downtown.md), the lanes, buildings and signals draped on it, and the
# grade and power-limit terms on.
#
# The map climbs from the Willamette (2 m) to I-405 at the foot of the West Hills: 19.6 % of
# its road length is steeper than 4 % on 10 m chords, and the steepest blocks are 6.5-7.2 %
# on SW Columbia, Jefferson and Clay streets. The family `hills` of
# scenarios/sensitivity/catalogue.yaml runs it with the drape moved, its rows are in
# crates/v2xw-engine/tests/expectations/traffic.yaml, and tests/vehicle_dynamics.rs checks
# that the draped lanes sit on the DEM's heights.
schema: v2xw/scenario/1

meta:
  name: portland-hills
  description: >-
    Downtown Portland, Oregon (OSM) on its measured terrain: the portland-downtown run
    with a 1 arc-second DEM draped under the lanes, buildings and signals, and the grade
    and power-limit terms on, so the climb to the West Hills slows traffic and the ground
    shapes the 5.9 GHz links.
  authors: [v2xw]
  tags: [portland, osm, dsrc, signed, terrain, dem, grade]
  created: "2026-10-28"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T08:00:00Z"
  duration_s: 300.0
  mobility_step_ms: 100
  des_resolution: 1us

world:
  source:
    kind: osm-xml
    # Fetched by `worlds/fetch.sh portland` (the Overpass API, 2026-09-30): 6.8 MB.
    path: worlds/cache/portland.osm.xml
    # Downtown between the Willamette and I-405, SW Market Street to NW Everett Street.
    # The box fixes the world frame: its south-west corner is the origin.
    bbox:
      min_lat_deg: 45.5120
      min_lon_deg: -122.6860
      max_lat_deg: 45.5250
      max_lon_deg: -122.6700
  imported_at: "2026-09-30T00:00:00Z"
  # Oregon's statutory limits: 20 mph in a business district, which downtown is (ORS
  # 811.111), and on the residential streets Portland has posted 5 mph below 25 (ORS
  # 810.180). A street with a posted limit carries `maxspeed` in OSM, and the tag wins.
  highway_preset: urban-us-portland
  signals:
    coordinate: true
    # Downtown's signals are timed for a slow wave: "most signals in the central city are
    # timed to reward users with a string of greens if they're going about 11-12 mph"
    # (PBOT's signal engineer, BikePortland 2022-06-29), and PBOT's rest-in-red page
    # cites 13.5 mph. 12 mph = 5.36 m/s.
    progression_speed_mps: 5.36
  buildings:
    enabled: true
    keep_holes: true
  terrain:
    # Measured terrain (1 arc-second, about 22 m x 31 m posts; heights to the metre).
    dem: worlds/dem/portland-downtown.asc
    drape: true

actors:
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      # Downtown has 68 km of drive lanes to the Midtown box's 119 (world_report). Measured
      # with traffic_audit over 300 s: 600 veh/h put a peak of 36 vehicles on the map and
      # 1000 veh/h a peak of 38 — the rate is not what limits the fleet here: Portland's
      # 61 m blocks leave short lanes, and the demand model spawns only on a lane long
      # enough to take a vehicle. The thinned-Poisson acceptance is the mobility model's.
      rate_veh_per_h: 1000.0

traffic:
  # The slope (SUMO KraussPS, a - g sin theta) and the class power limit (WP-22;
  # docs/design/research/grade-dynamics.md) act on the draped lanes.
  vehicle_dynamics:
    grade: true
    power_limit: true
weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    propagation: high
    phy: medium
    mac: medium

net:
  layer: wsmp

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  verification_policy: prioritized
  signer_id_policy:
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    strategy: time
    period_s: 300.0

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

metrics: [all]

exporters: []

# P1-E7 null on a short quarter-fleet run (../variants/q60.yaml: 60 s live after a 30 s
# warm-up) with injected constant-position attackers and every OBU in the locked timing
# class (free share 0), the US profile on secMark, and the report records for
# `v2xw ma-replay`. Every sound rule must revoke zero honest devices.
schema: v2xw/scenario/1
meta:
  base: ../variants/q60.yaml
  name: Paper 1 MA replay locked
  description: >-
    The quarter-fleet minute with 3 % constant-position attackers, every OBU locked, and
    the report records for the offline MA rule family.
  tags: [paper1, validation, ma-replay]
actors:
  vehicles:
    bsm_timing:
      enabled: true
      calibration: data/calibration/bsm-timing-cvpilot.yaml
      locked_share: 1.0
security:
  scms:
    report_records: true
detection:
  local:
    - id: detect/us-sm-mbr
      params:
        time_base: secmark
  ma:
    id: threat/ma/corroborated
threats:
  attackers:
    - id: threat/attacker/legacy/ConstPos
      fraction: 0.03
      schedule:
        from_s: 30.0
        to_s: 172800.0

meta:
  base: p1-e7-f50.yaml
  name: Paper 1 p1-e7c-f50
  description: P1-E7 calibrated receiver, free share 50 %.
  tags: [paper1, experiment]
actors:
  vehicles:
    gnss:
      velocity_noise_mps: 0.0

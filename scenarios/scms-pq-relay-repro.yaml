# ============================================================================
# The matrix's hybrid post-quantum run (Falcon-512 + P-256, `fragmenter/generic-sdu`) cut to
# its first two live minutes, with the backend compressed so a revocation reaches the
# roadside inside them: the RA's report shuffle closes after 5 s, the MA decides
# automatically, and each CRL Generator publishes every 10 s. Relay-only vehicles upload
# their reports through the roadside units and the units broadcast the CRL, both as
# signed SDUs larger than the 1,400-octet WSMP MTU.
# `crates/v2xw-engine/tests/pq_relay.rs` runs it to check R-PQMBR
# (docs/design/scms-real/testing/stress.md §3): such an SDU is fragmented and acted on once
# reassembled, and with `fragmenter/none` it is refused and never counted as sent.
# ============================================================================

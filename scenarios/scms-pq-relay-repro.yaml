# ============================================================================
# The matrix's hybrid post-quantum run (Falcon-512 + P-256, `fragmenter/generic-sdu`) cut to
# its first two live minutes, with the backend compressed so a revocation reaches the
# roadside inside them: the RA's report shuffle closes after 5 s, the MA decides
# automatically, and each CRL Generator publishes every 10 s. Relay-only vehicles upload
# their reports through the roadside units and the units broadcast the CRL, both as
# signed SDUs larger than the 1,400-octet WSMP MTU.
# `crates/v2xw-engine/tests/pq_relay.rs` runs it to check R-PQMBR
# (docs/design/scms-real/testing/stress.md §3): such an SDU is fragmented and acted on once
# reassembled, and with `fragmenter/none` it is refused and never counted as sent.
#
# One attacker is added to the base's 3 % (`threats.attackers`, second entry): actor 112,
# a passenger car that drives past relay-only vehicle node 56 from 36 s, 35 m away, while
# node 56 is 24 m from a roadside unit. Since the GNSS fix (gauss-markov 1.2.0,
# R-FS40) the only relay-only vehicle to report one of the base's three attackers is node 82,
# at 65 s, about an attacker revoked at 35.6 s whose CRL it had not yet heard; its 12
# fragments reach no unit (units 4 and 23, 212 m and 218 m away behind Midtown's
# buildings, receive every one below sensitivity), so no vehicle report reached the
# proxy through a unit. Moving a unit next to node 82 does not help: the unit's CRL
# broadcast then reaches the car first and it no longer reports the revoked attacker.
# The base's selection is unchanged (the first entry draws as before, per node, and wins
# first): the one change is that this car attacks, and what follows from it.
# ============================================================================
schema: v2xw/scenario/1
meta:
  name: scms-pq-relay-repro
  description: >-
    Hybrid Falcon-512 + P-256 Midtown, 120 s live: relayed reports and roadside CRL frames
    above the WSMP MTU, for the R-PQMBR tests.
  authors: [v2xw]
  tags: [scms, post-quantum, fragmentation, reproduction]
  created: "2026-10-22"
  base: real-world/matrix/pq-hybrid.yaml
time:
  duration_s: 120.0
  fast_forward: []
security:
  protocol:
    id: protocol/scms/camp
    params:
      report_shuffle_window_s: 5.0
      ma_review_s: 0.0
      crl_cadence_s: 10.0
threats:
  attackers:
    - id: threat/attacker/legacy/ConstPos
      fraction: 0.03
      schedule:
        from_s: 20.0
        to_s: 172800.0
    - id: threat/attacker/legacy/ConstPos
      actor_ids: [112]
      schedule:
        from_s: 20.0
        to_s: 172800.0

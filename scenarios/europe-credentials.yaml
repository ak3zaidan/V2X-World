# The European credential system (ETSI CCMS) at work.
#
# ccms-lifecycle.yaml as written — CAMs over GeoNetworking, the trust list and CA
# revocation list from the Distribution Centre, butterfly authorization tickets the
# authorization authority cannot link to the enrolment, ticket changes, TS 103 759
# misbehaviour reports and passive revocation at the enrolment authority — by day.
schema: v2xw/scenario/1

meta:
  base: ccms-lifecycle.yaml
  name: European credential system (ETSI CCMS)
  description: >-
    The European counterpart of the US SCMS: vehicles send CAMs over GeoNetworking, fetch
    the trust list and revocation list, change authorization tickets, and misbehaving
    stations are reported and cut off at the enrolment authority.
  tags: [credentials, etsi, ccms, europe, backend]

# Berlin-Mitte by default (the base runs on a procedural grid); any city of the library runs
# the European stack just as well.
city: berlin

time:
  t0: "2027-03-04T12:00:00Z"

actors:
  vehicles:
    demand:
      rate_veh_per_h_per_lane_km: 12.6

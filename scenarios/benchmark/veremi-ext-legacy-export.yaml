# WP-24 P24.3: the legacy-attack export the reference ML baseline trains on
# (docs/guides/veremi-ext-baseline.md). Run with `--veremi veremi-ext` at the default record
# level (full: the exporter needs gt.kinematics for the receivers' own positions).
#
# It is a stand-in for the VeReMi Extension replica (P24.2/P24.4), which needs `f2md-19`:
# the LuST subsection (worlds/sumo/lust-veremi-sub.net.xml, P24.1), 1 Hz beacons as in the
# VeReMi Extension, and 30 % attackers (the published share) split evenly over the seven
# frozen legacy families that carry a VeReMi Extension code (crates/v2xw-record/src/
# dataset/veremi.rs VEREMI_EXT_CODES: 1 ConstPos, 2 ConstPosOffset, 4 RandomPos,
# 6 ConstSpeedOffset, 7 RandomSpeed, 9 EventualStop, 12 DelayedMessages). The legacy
# families are this engine's, not F2MD's (f2md.md §4.1), so the numbers it gives are not
# the VeReMi Extension's and the guide says so. Demand is internal Poisson, not LuST's
# routes (P24.2). 60 s per run keeps the run under runtiny.sh's 450 MB (120 s reached
# 672 MB); -s2 and -s3 are the same run on other seeds, so the baseline trains on two runs
# and tests on a third it never saw.

  name: VeReMi Extension legacy-attack export
  description: >-
    The LuST VeReMi subsection for 60 s at 1 Hz beaconing with 30 % attackers over the
    seven legacy families that have a VeReMi Extension code: the training export of the
    reference ML baseline.
  tags: [benchmark, veremi, misbehaviour, detection, ml]
  created: "2026-10-28"
seed: "0x24_0003"

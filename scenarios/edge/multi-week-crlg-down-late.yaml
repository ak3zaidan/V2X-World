# multi-week.yaml with the home CRL Generator down from 300,000 s to 2,600,000 s, after the root
# changeover. The root rollover decided at 120 s is published as CTL 1 at 259,320 s (Fri 08:52Z,
# 3 business days, scms-audit-gov.yaml), and from then on every home certificate names the new
# CRACA (4a1086). While the Generator is up, the changeover signs a list under that CRACA at once
# (R-ROLLCRL, nextCrl = day 10.0). Receivers hold it from W1, and it is overdue from nextCrl +
# 2 weeks (day 24.0, 2,073,600 s; [CAMP122] Table 67 overdue_CRL_tolerance). So W4 refuses the
# home CRACA's messages, W3 refuses none, and W5 recovers after the return.
# Moved 2026-10-28 from 200,000 s (trace track, scms-variants RR.MWC2.overdue). That outage
# began before the changeover, so no list under the new CRACA existed until the restart, and the
# overdue list (old CRACA b710ad) governed no sender: 0 refusals, against 110,048 now (9d0fbc2c).
# multi-week-crlg-down.yaml (down from 700 s) shows the other case: senders whose CRACA has no
# list a receiver holds are never refused, and no published clause says they should be. stress.md §2.

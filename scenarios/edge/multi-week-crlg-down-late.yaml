# multi-week.yaml with the home CRL Generator down from 200,000 s (after its first CRL was
# published at about 190,769 s) to 2,600,000 s. Devices then hold that CRL (nextCrl =
# issue + 7 d = about 795,569 s), and from nextCrl + 2 weeks (about 2,005,169 s) every
# receiver refuses every message under the home CRACA ([CAMP122] Table 67
# overdue_CRL_tolerance): W4 refuses them all, W3 none, and W5 recovers after the return.
# multi-week-crlg-down.yaml (down from 700 s) shows the other case: a CRACA that has never
# published a CRL cannot become overdue. stress.md §2.

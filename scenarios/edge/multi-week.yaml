# Five weeks of the SCMS conformance run on the real calendar (stress package,
# docs/design/scms-real/testing/stress.md §2).
#
# The conformance run (two vehicle providers, real cryptography, 10 % ConstPos attackers,
# manual MA, business-day CRL) from Tuesday 2026-10-20 08:50 UTC for 33 days, mostly in
# fast-forward. Five i-period rollovers fall inside it (614 -> 615 at 600 s, then every
# 604,800 s at Tuesday 09:00 UTC), and a live window straddles each one so the switch to
# the new period's pseudonyms is seen on the air:
#
#   W0          0 -     660 s   enrolment, provisioning, the 614 -> 615 rollover, attackers
#   W1    604,740 -  604,860    615 -> 616
#   W2  1,209,540 - 1,209,660   616 -> 617
#   W3  1,814,340 - 1,814,460   617 -> 618: three weeks after the first CRL's issue date
#   W4  2,419,500 - 2,419,920   618 -> 619 (variants: the parked car is switched back on)
#   W5  2,851,200 - 2,851,320   day 33 (variants: after the CRL Generator's return)
#
# The variants (multi-week-*.yaml) each add one fault on the same seed:
#   multi-week-parked.yaml     one cellular car breaks down at 640 s and its OBU is off
#                              from 645 s to 2,419,510 s (four weeks): it comes back with a
#                              CRL far past nextCrl + 2 weeks and an exhausted pool
#   multi-week-crlg-down.yaml  the home provider's CRL Generator is down from 700 s to
#                              2,600,000 s: no CRL is reissued, so every device's copy of
#                              that provider's CRL passes nextCrl + 2 weeks inside the run

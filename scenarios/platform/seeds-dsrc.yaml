    seed: 1
  metric: range90_m
  expect: same
  min_change: 0.0
  source: 'seed spread, not a theory row: the change is the seed alone (docs/validation/platform-2026-10-24.md section 3)'
- name: seed 1 aoi_ms
  set:
    seed: 1
  metric: aoi_ms
  expect: same
  min_change: 0.0
  source: 'seed spread, not a theory row: the change is the seed alone (docs/validation/platform-2026-10-24.md section 3)'
- name: seed 1 e2e_ms_mean

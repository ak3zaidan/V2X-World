# Seed spread for the platform validation (docs/validation/platform-2026-10-24.md section 3):
# the base (seed 0xC0FFEE_5EED) and four other seeds, nothing else changed. Not a theory
# table: a row 'fails' whenever the seed moves its metric; the values are read with --json
# and their 95 % t-interval computed.
base: ../sensitivity/dsrc-grid.yaml
set:
  time.duration_s: 3.0
  metrics:
  - all
rows:
- name: seed 1 prr
  set:
    seed: 1
  metric: prr
  expect: same
  min_change: 0.0
  source: 'seed spread, not a theory row: the change is the seed alone (docs/validation/platform-2026-10-24.md section 3)'
- name: seed 1 cbr_mean
  set:
    seed: 1
  metric: cbr_mean
  expect: same
  min_change: 0.0
  source: 'seed spread, not a theory row: the change is the seed alone (docs/validation/platform-2026-10-24.md section 3)'
- name: seed 1 range90_m

# Base for the radio-technology comparison: not in the picker itself. radio-dsrc.yaml,
# radio-lte.yaml and radio-nr.yaml each name it and change only `radio.rat`, so the three
# runs have the same streets, the same seed and therefore the same vehicles in the same
# places at the same instants — the only difference is the radio.
#
# Midtown at the "Rush hour" arrival rate (4,500 veh/h, see options.rs PRESETS) because a
# radio comparison is decided under load: at light load all three deliver almost everything.
# No credential backend and no detectors, so the comparison measures the air interface and
# not the security stack's cost.
schema: v2xw/scenario/1

meta:
  name: radio-faceoff-base
  description: >-
    A downtown at rush-hour density with signed BSMs and no backend, for comparing radio
    technologies on identical traffic.
  authors: [v2xw]
  tags: [city, radio, comparison, base]
  created: "2026-10-06"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T22:00:00Z"
  duration_s: 180.0
  mobility_step_ms: 100
  des_resolution: 1us

# Midtown by default; the picker or --city puts the comparison on any city.
city: manhattan

actors:
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      # Rush-hour density: 4,500 veh/h on Midtown's 119 km of driving lane.
      rate_veh_per_h_per_lane_km: 37.8

weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    propagation: high
    phy: medium
    mac: medium

net:
  layer: wsmp

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  verification_policy: prioritized
  signer_id_policy:
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    strategy: time
    period_s: 300.0

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

metrics: [all]

exporters: []

# Base for the ready-made scenarios: a deployment written for no city in particular. Every
# scenario in the picker that is about the traffic, the radio or the security stack names it as
# `meta.base` and changes only what makes it different; the city is chosen separately (the
# Studio's city picker, `v2xw run --city <id>`, run.start's `city`), and this file's `city` is
# only the one it runs on when none is chosen.
#
# What it is: a weekday midday downtown with a connected fleet, the US credential system (SCMS)
# running in the loop, eight roadside units and misbehaviour detection on every vehicle.
# It is base/midtown.yaml with every Midtown-specific line restated so it fits any city:
#
#  * no `world` block: `city: manhattan` supplies the extract, its box and its jurisdiction's
#    speed limits and rules (worlds/cities.yaml);
#  * the arrival rate is 25 vehicles per hour per kilometre of driving lane, which is Midtown's
#    "Normal (midday)" 3,000 veh/h over its 119 km; on Houston's 90-odd km it is about 2,300
#    veh/h, on Boise's smaller grid fewer — the same density, not the same count;
#  * the eight roadside units stand at the city's eight busiest signalised intersections (most
#    approach lanes first, at least 150 m apart) instead of at Fifth and Sixth Avenue
#    coordinates, so a deployment lands where a city would mount one;
#  * `time.t0` is 12:00 in the default city; on another city the engine keeps the local time
#    of day (noon in Manhattan is noon in Seattle).
schema: v2xw/scenario/1

meta:
  name: city-base
  description: >-
    A downtown at midday with a connected fleet, the US SCMS in the loop, eight roadside
    units at the busiest signalised intersections and misbehaviour detection on every
    vehicle — on whichever city is chosen.
  authors: [v2xw]
  tags: [city, osm, dsrc, signed, scms, base]
  created: "2026-10-07"

seed: "0xC0FFEE_5EED"

time:
  t0: "2027-03-04T17:00:00Z"
  duration_s: 300.0
  # The car-following models' calibration step, and the BSM period: one step, one message.
  mobility_step_ms: 100
  des_resolution: 1us

# The city it runs on when none is chosen; any id in worlds/cities.yaml.
city: manhattan

actors:
  # Eight units at the city's busiest signalised intersections (crates/v2xw-engine/src/city.rs).
  rsu_placement:
    count: 8
    roles: [report-forward, crl, provisioning-proxy]
  backend:
    protocol: protocol/scms/camp
  vehicles:
    equipped_fraction: 1.0
    demand:
      kind: mobility/demand/poisson
      rate_veh_per_h_per_lane_km: 25.0

weather:
  initial: clear
  intensity: 0.0

radio:
  rat: dsrc-80211p
  tiers:
    # High propagation: links priced from the city's own geometry (TR 37.885 LOS and blockage,
    # Mangel 2011 round the street corner), the law best supported on a street grid.
    propagation: high
    phy: medium
    mac: medium

net:
  layer: wsmp
  # Every vehicle's telematics modem (TR 37.885 urban macro, 500 m inter-site distance).
  uu:
    id: cellular/uu/cell-capacity-mm1
    params:
      isd_m: 500
      penetration: 1.0
  backhaul:
    id: backhaul/fixed
    params:
      latency_ms: 10
      capacity_mbps: 1000

messages:
  sets: [bsm]
  codec_tier: uper

security:
  envelope: ieee1609.2
  signature: ecdsa-p256
  crypto_mode: modeled
  verification_policy: prioritized
  signer_id_policy:
    # A full certificate once a second, a digest otherwise: SAE J2945/1.
    full_cert_every_ms: 1000
    digest_otherwise: true
  pseudonym_change:
    # SAE J2945/1's five-minute certificate change.
    strategy: time
    period_s: 300.0
  # The calendar compressed so the backend has something to do in minutes: a two-minute
  # i-period (a week in a deployment, CAMP-EE §2.1.5.3.2), the report shuffle and the CRL
  # at a minute (a day each, CAMP-EE SCMS-765, Brecht 2018 §VI-G).
  protocol:
    id: protocol/scms/camp
    params:
      i_period_s: 120
      cert_lifetime_s: 121
      certs_per_period: 20
      pool_periods: 2
      topup_below_periods: 1
      report_shuffle_window_s: 60
      # The MA operator's review before a revocation (CV-pilot manual MA, 8 h, an
      # assumption) -> 0, the automatic MA, as this run compresses the report path.
      ma_review_s: 0
      crl_cadence_s: 60
      crl_fetch_interval_s: 60

nodes:
  default_obu: obu/unex-obu-301-craton2
  compute_tier: medium
  backend_tier: medium

detection:
  local:
    - id: detect/legacy-12
  ma:
    id: threat/ma/corroborated

metrics: [all]

exporters: []

# Replay attack: vehicles that re-send their own old messages, and stale timestamps.
#
# midtown-normal.yaml plus two populations from the 30th second:
#
#  * 3 % of vehicles replay their own earlier messages with the old generation time
#    (VeReMi "DataReplay", Kamel et al. 2020) — correctly signed, so only a plausibility
#    check can catch them;
#  * 2 % stamp messages with a stale generation time ("DelayedMessages").
#
# A Sybil attack (one vehicle posing as several) is what the owner's brief named first; this
# engine does not run it yet — an attacker is never handed several concurrent pseudonyms —
# and the settings window lists it as unavailable rather than pretending. Replay is the
# attack on the same weakness: a valid signature on a message that is not true now.
schema: v2xw/scenario/1

meta:
  base: midtown-normal.yaml
  name: Attack - replayed and delayed messages
  description: >-
    Midday Midtown where some cars re-send their old, validly signed messages and others
    send stale timestamps. Signatures check out, so only the plausibility detectors can
    tell; see whether they do, and whether the authority revokes.
  tags: [attack, misbehaviour, replay, detection, revocation, scms]

threats:
  attackers:
    - id: threat/attacker/legacy/DataReplay
      fraction: 0.03
      schedule:
        from_s: 30.0
        to_s: 300.0
    - id: threat/attacker/legacy/DelayedMessages
      fraction: 0.02
      schedule:
        from_s: 30.0
        to_s: 300.0

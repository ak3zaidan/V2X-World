# CI (see docs/architecture.md for the determinism contract).
#
# The jobs:
#   * `rust`        — fmt, clippy and tests on all three platforms.
#   * `python`      — the `v2xw` package built with maturin, its tests and examples.
#   * `dataset`     — the dataset exporter's tests and the release tools' tests.
#   * `ui`          — the Studio workspace: install, typecheck, tests, build.
#   * `determinism` — running the same tests on three platforms does NOT prove
#                     they agree: each job only checks its own assertions. So
#                     each platform imports the committed map fixture, publishes
#                     the engine's own canonical digests, and
#                     `determinism-compare` fails unless all three are identical.
#                     This catches platform-dependent floating point (for
#                     example a transcendental that rounds differently).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately no `RUSTFLAGS: -D warnings`: RUSTFLAGS applies to dependencies
  # too, so one upstream crate warning under a new compiler would break the
  # build. Warnings are denied for our own code on the clippy line instead.

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel and its
      # components. The version is asserted against the file so CI and the pin
      # can never drift apart (`rasn` needs 1.88+).
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          pinned=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          actual=$(rustc --version | awk '{print $2}')
          echo "pinned=$pinned actual=$actual"
          test "$pinned" = "$actual" || { echo "::error::rustc $actual does not match the pin $pinned"; exit 1; }
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  python:
    name: python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # maturin reads python/pyproject.toml from the directory it runs in (`-m` names a
      # Cargo.toml, not a pyproject). The venv is not activated, so VIRTUAL_ENV names it,
      # and a uv venv has no pip, so maturin installs with uv.
      - name: Build the package
        run: |
          uv venv .venv-py
          uv pip install --python .venv-py maturin "pyarrow>=14" pytest
          export VIRTUAL_ENV="$PWD/.venv-py"
          cd python && ../.venv-py/bin/maturin develop --release --uv

      - name: Tests
        run: .venv-py/bin/python -m pytest python/tests -q

      - name: Examples
        run: |
          .venv-py/bin/python python/examples/run_and_read_metric.py
          .venv-py/bin/python python/examples/simple_ma_policy.py

      - name: The MA-policy hook from Rust
        run: cargo test -p v2xw-py --test ma_policy_hook

  dataset:
    name: dataset exporter and release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Exporter tests
        run: |
          cargo test -p v2xw-record --lib dataset::
          cargo test -p v2xw-engine --test dataset_records --test dataset_release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      # No network and no upload: tools/dataset/hf_upload.py is never run here with a flag
      # (`--yes` publishes to the public dataset repository).
      - name: Release-tool tests
        run: |
          uv venv .venv-py
          uv pip install --python .venv-py pyarrow pandas scikit-learn pyyaml pytest
          .venv-py/bin/python -I -m pytest tools/dataset/tests -q

  ui:
    name: ui (Studio workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version is the workspace's `packageManager` pin.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir ui install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir ui typecheck

      # The Studio's end-to-end suite drives headless chromium.
      - name: Install chromium for the end-to-end tests
        run: pnpm --dir ui/apps/studio exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --dir ui test

      - name: Build
        run: pnpm --dir ui build

  determinism:
    name: determinism digest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The importer runs the projection (transcendentals), lane inference,
      # geometry and the writer-side quantisation, then prints digests the
      # engine computed itself.
      - name: Import the committed fixture and capture the digests
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release --quiet -p v2xw-world --example import_osm -- \
            tests/fixtures/midtown-6block.osm.xml target/determinism 2000-01-01T00:00:00Z \
            | tee import.log
          world=$(sed -n 's/^world hash \([0-9a-f]*\).*/\1/p' import.log | head -1)
          payload=$(sed -n 's|.*/world/\([0-9a-f]*\)\.vwb.*|\1|p' import.log | head -1)
          warn=$(sed -n 's/.*, \([0-9]*\) precision warning.*/\1/p' import.log | head -1)
          test -n "$world"   || { echo "::error::no world hash in the import output"; exit 1; }
          test -n "$payload" || { echo "::error::no payload hash in the import output"; exit 1; }
          test "${warn:-0}" = "0" || { echo "::error::$warn value(s) off their quantisation grid"; exit 1; }
          printf 'world=%s\npayload=%s\n' "$world" "$payload" > digests.txt
          cat digests.txt

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: digests.txt
          if-no-files-found: error

  determinism-compare:
    name: determinism digests agree across platforms
    runs-on: ubuntu-latest
    needs: determinism
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests

      - name: Compare
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for f in digests/*/digests.txt; do
            echo "$f: $(tr '\n' ' ' < "$f")"
            found=$((found + 1))
          done
          test "$found" -eq 3 || { echo "::error::expected 3 platform digests, got $found"; exit 1; }
          distinct=$(sort -u digests/*/digests.txt | grep -c '^world=')
          if [ "$distinct" -ne 1 ]; then
            echo "::error::the platforms disagree on the world digest; this is a bug, not a tolerance"
            exit 1
          fi
          distinct=$(sort -u digests/*/digests.txt | grep -c '^payload=')
          test "$distinct" -eq 1 || { echo "::error::the platforms disagree on the VWP payload digest"; exit 1; }
          echo "all three platforms agree"

# Radio channel access, fix round 4 (radio-fix3 open items: DSRC carrier sense of a
# leaked adjacent-channel frame, R3.2.DCC2, and the fault proofs fix-3's wpradio, detect and
# p1gaps tracks owed). Every `expect` was written with `measured: pending` and committed
# before the run or test that judges it, except rows marked `disclosure:`.
# `measured` is base -> variant, or the run's value. Judged by
#   python3 -I tools/realworld/radiofix3.py <run dir>       (PDR, CBR, frames per run)
#   python3 -I tools/realworld/radiofix4.py shares|digest <run dir>
# against `band`.
#
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
schema: v2xw/scms-run-expectations/1
runs:
  G20:
    scenario: scenarios/real-world/radio-fix3/dense-grid-20.yaml
    binary: this branch's debug build (opt-level 2); G20-OLD is the 3cbc95a4 release copy
    note: procedural grid, 12,000 veh/h, 20 s, one channel, --record-level receptions
  G20-MAP:
    scenario: scenarios/real-world/radio-fix3/dense-grid-20-map.yaml
    base: G20
    binary: this branch's debug build (opt-level 2); G20-MAP-OLD is the 3cbc95a4 release copy
    note: SPaT and MAP on 174, energy detect at its default (-65 dBm)
  G20-MAP-ED85:
    scenario: scenarios/real-world/radio-fix4/dense-grid-20-map-ed85.yaml
    base: G20-MAP
    binary: this branch's debug build (opt-level 2)
    note: G20-MAP with radio.phy.energy_detect_dbm -85 (the pre-fix carrier sense)
  HD-MAP:
    scenario: scenarios/real-world/radio-fix3/dense-hwy-map.yaml
    binary: this branch's debug build and the 3cbc95a4 release copy
    note: built-in highway, J2945/1, channel map on, 24 s
rows:
# ---- Item 1: carrier sense of another channel's frame (IEEE 802.11-2020 §17.3.10.6) ----
- id: R4.1.PHY
  test: v2xw-radio src/phy.rs a_leak_from_the_next_channel_is_sensed_only_above_energy_detect
  expect: >-
    A 172 receiver's CCA reads a 174 frame's leak (power less the 174->172 ACIR) as busy only
    from the 10 MHz energy-detect level, -65 dBm, while a 172 frame is busy from -85 dBm
    (preamble detection); two -68 dBm leaks are busy together (energy adds), one is not;
    energy_detect_dbm -85 restores the single threshold
  source: >-
    IEEE 802.11-2020 §17.3.10.6 (CCA requirements): a valid OFDM transmission at or above the
    minimum-rate sensitivity (-85 dBm, 10 MHz) reads busy; "if the preamble portion was
    missed", any signal 20 dB above it (-65 dBm for 10 MHz) holds CCA busy
  fault: CcaConfig::energy_detect_threshold_dbm returning busy_dbm (the leak held to -85 dBm)
  measured: pending
  verdict: pending
- id: R4.1.NS3
  test: v2xw-radio src/phy.rs cca_is_busy_above_the_threshold_and_while_transmitting
  expect: >-
    The ns-3 preset senses an 802.11 frame from CcaSensitivity (-82 dBm) and other energy
    from CcaEdThreshold (-62 dBm); before the fix cca_threshold_dbm() returned -62 for both,
    and the test asserted that (an expectation that encoded the conflation)
  source: ns-3 WifiPhy attributes CcaSensitivity (-82 dBm, Wi-Fi signals) and CcaEdThreshold (-62 dBm, non-Wi-Fi energy)
  fault: cca_threshold_dbm() returning energy_detect_dbm.unwrap_or(busy_dbm) (the old body)
  measured: pending
  verdict: pending
- id: R4.1.NOOP-G20
  run: G20
  metric: record digest, this branch vs 3cbc95a4
  band: identical
  expect: >-
    One channel, no adjacent emitter, J2945/1 (no gatekeeper, so R4.2's roadside feed does
    not run): the leak and emitter terms are zero and the two-level test reduces to the old
    one bit for bit, so the run is byte-identical; so are the published-curve rows on
    single-channel runs (R3.1 DSRC PDR edge, R3.2.DENSE-HWY48's J2945/1 band)
  source: the change's own algebra (energy detect >= preamble detect; own-channel sum equal to the total without leaks)
  measured: pending
  verdict: pending
- id: R4.1.NOOP-HWY
  run: HD-MAP
  metric: record digest, this branch vs 3cbc95a4
  band: identical
  expect: >-
    The built-in highway has no roadside unit, so its channel map puts nothing on 174 and
    nothing leaks: the J2945/1 dense-highway CBR (R3.2.DENSE-HWY, 0.271) is unchanged, byte
    for byte
  source: as R4.1.NOOP-G20
  measured: pending
  verdict: pending
- id: R4.1.FLAG
  run: G20-MAP-ED85
  metric: radiofix4.py digest (node_tx, node_rx, mac_cbr), vs G20-MAP on 3cbc95a4
  band: identical
  expect: energy_detect_dbm -85 is the pre-fix carrier sense, so the knob reproduces the old engine's records exactly (the scenario hash differs, hence the jsonl digest)
  source: the change's own algebra
  measured: pending
  verdict: pending
- id: R4.1.CBR-ED85
  run: G20-MAP-ED85
  metric: CBR172(G20-MAP-ED85) / CBR172(G20)
  band: "[p85-0.01, p85+0.01], p85 = 1 - (B_moved - B_leak85) / B_all from G20's node_rx (radiofix4.py shares)"
  expect: the pre-fix carrier sense reproduces radio-fix3 R3.2.DENSE-SENSED (0.9233 against p 0.9215)
  source: radio-fix3 R3.2.DENSE-SENSED; ETSI TS 102 687 V1.2.1 §4.2 (CBR at -85 dBm)
  measured: pending
  verdict: pending
- id: R4.1.CBR
  run: G20-MAP
  metric: CBR172(G20-MAP) / CBR172(G20)
  band: "[p65-0.01, p65+0.01], p65 = 1 - (B_moved - B_leak65) / B_all from G20's node_rx"
  expect: >-
    Under SAE J2945/1 the CBP is the share of the 100 ms interval the radio's 802.11 CCA
    reports busy, so a SPaT or MAP on 174 counts on 172 only where its leak reaches -65 dBm
    (an arrival of -52 dBm on 174, ACIR 12.98 dB), not -85 dBm (-72 dBm on 174): B_leak
    shrinks to the strong arrivals near the masts and the CBR on 172 falls further than
    radio-fix3 measured, by (B_leak85 - B_leak65) / B_all, to p65 within overlap (1 %)
  source: IEEE 802.11-2020 §17.3.10.6; SAE J2945/1 §6.3.8 (CBP over vCBPMeasInt 100 ms, from the radio's channel-busy indication; clause text not re-read here, as radio-fix3 R3.2.DENSE-SENSED's note)
  measured: pending
  verdict: pending
- id: R4.1.PDR
  run: G20-MAP
  metric: BSM pdr300 and the 50 % crossing (cross50_m), G20-MAP vs G20-MAP-ED85
  band: "|pdr300 change| <= 0.005; cross50_m within one 50 m bin, inside [100, 200] m"
  expect: >-
    The leak-busy time that disappears is about B_leak85 x CBR (0.19 x 0.02 = 0.4 % of a
    listener's time), and a deferred BSM waited at most one SPaT/MAP air time (under 1 ms)
    with no queue overflow at this load, so neither delivery nor the reception-range curve
    moves measurably; the leak still raises the noise at a 172 receiver whether or not
    carrier sense defers, so SINR is the same. The curve stays in the NLOS-edge band
    radio-fix3 R3.1.DSRC-NLOS-EDGE judged against
  source: 3GPP TR 37.885 V15.3.0 Table 6.2.1-1 and SAE J2945/1 §6.3.8 (via R3.1.DSRC-NLOS-EDGE); airtime arithmetic
  measured: pending
  verdict: pending
- id: R4.1.FRAMES
  run: G20-MAP
  metric: frames_transmitted, G20-MAP / G20-MAP-ED85
  band: [0.995, 1.005]
  expect: generation does not read carrier sense, and J2945/1 neither cuts the rate (density under 25 in 100 m) nor the power (CBP under 0.5) at CBR 0.02, so the same frames go on air
  source: SAE J2945/1 §6.3.8 (vMinChanUtil 0.5; MaxITT density rule), via 04-models.md §6
  measured: pending
  verdict: pending
- id: R4.1.WALL
  run: G20-MAP
  metric: wall time and peak RSS, G20-MAP / G20-MAP-ED85 (same binary, one at a time)
  band: "wall [0.8, 1.25]; peak [0.9, 1.1]"
  expect: one extra own-channel energy sum per carrier-sense query, only in runs with leakage or an emitter; the same frames and receptions, so run cost does not move beyond machine noise
  source: cost model
  measured: pending
  verdict: pending
- id: R4.1.DET
  run: G20-MAP
  metric: radiofix4.py digest, G20-MAP run twice on the same binary and seed
  band: identical
  expect: same seed, byte-identical records
  source: 02-architecture.md determinism (ADR 0004)
  measured: pending
  verdict: pending
- id: R4.1.EMITTER
  expect: >-
    An adjacent-channel emitter (radio.adjacent_channel: ITS-G5 beside LTE-V2X) is
    another channel's leak too: its energy is held to energy detect in carrier sense and,
    outside Europe, in the CBR (Engine::jam_sense_level, leak_busy_dbm); in Europe the CBR
    stays at -85 dBm (EN 302 571 §4.2.10.1 measures received signal strength, whatever it is)
  source: IEEE 802.11-2020 §17.3.10.6; ETSI EN 302 571 V2.1.1 §4.2.10.1
  measured: not measured in this round (no shipped scenario declares an emitter on a DSRC run)
  verdict: open
- id: R4.1.JAM-ED
  expect: >-
    A jammer's noise has no 802.11 preamble either, so by the same clause it should hold
    carrier sense busy only from -65 dBm, and count in a J2945/1 CBP only from there; the
    engine still holds it to -85 dBm. Left as is in this round: it changes every jammer run
    (radio_access, radio_channel, radio_access_layers, multichannel R3.2.JAM) and needs its
    own expectation rows (a 23 dBm rider jammer is far above -65 dBm and is not moved; a
    distant or pulsed one is)
  source: IEEE 802.11-2020 §17.3.10.6
  measured: not changed
  verdict: open
# ---- Item 2: the per-channel DCC gate (radio-fix3 R3.2.DCC2) ----
- id: R4.2.FEED
  test: v2xw-engine tests/multichannel.rs the_etsi_gate_spaces_each_channel_on_its_own (rewritten)
  disclosure: >-
    the cause was found by reading run.rs before this row was written: update_dcc runs only
    for the actors' nodes, so a roadside unit's ETSI gates never receive a CBR (delta stays
    at delta_max, the EN 302 571 floor at CBR 0), which is why radio-fix3's test could not
    fail. Fixed in Engine::update_roadside_dcc (gates only; J2945/1 is the BSM's)
  expect: >-
    With ETSI adaptive DCC, a pulsed jammer (23 dBm, 90 ms of every 100 ms, from 2 s) riding
    one unit on 172 holds that radio's CBR near 0.9; delta falls by at most 0.00025 per
    200 ms to delta_min 0.0006 in about 13 s, so from 20 s the unit's SPaT on 172 is spaced
    by at least min(1 s, T_on / 0.0006): at most 10 s / that + 1 frames in the last 10 s
    (the jammer's 10 ms gaps alone pass about one per period). Its MAP on 174 every 100 ms
    passes a gate fed with 174's CBR: at most 2 fewer than with no jammer
  source: ETSI TS 102 687 V1.2.1 §5.4 and Annex A (alpha 0.016, beta 0.0012, CBR_target 0.68, delta 0.0006-0.03, G-max- -0.00025, 200 ms update, T_off = T_on/delta in [25 ms, 1 s]); EN 302 571 V2.1.1 §4.2.10 (every ITS-S, roadside included)
  fault: "a: update_roadside_dcc not called (the unit's gates never fed a CBR); b: dcc_service never built (one gate for both radios)"
  measured: pending
  verdict: pending
- id: R4.2.J2945
  expect: >-
    SAE J2945/1 §6.3 rate and power control is the BSM's and reads the CBP of the BSM
    channel only; a roadside unit sends no BSM, so it gets no J2945/1 state (the US runs
    are untouched: R4.1.NOOP-G20). TS 102 687's per-channel gate is the clause that applies
    to a two-radio unit, and R4.2.FEED pins it
  source: SAE J2945/1 §6.3.8 (via 04-models.md §6, R1 §E); ETSI TS 102 687 V1.2.1 §5.4
  measured: by R4.1.NOOP-G20
  verdict: pending

# ---- The same, generated strictly periodically (written before the SLT2J runs) ----
# The SLT2 runs carry the default hand-off jitter, U[0, 10 ms] drawn afresh for every
# message (ns-3's WAVE value). A reservation made for one message then sits at a fixed
# slot while the next message's hand-off moves by up to 10 ms: when it lands after the
# reserved slot, the grant is still inside the 100 ms budget (TS 36.321 5.14.1.1 sees no
# trigger), so the message waits almost a whole period. The smaller T2, the likelier the
# miss: P(j1 > j0 + U[T1, T2]) with j0, j1 ~ U[0, 10] ms is 0.40 at T2 = 1 ms and 0 past
# T2 = 10 ms. Theory for strictly periodic traffic (TR 37.885 A.1.1, 100 ms period) is the
# rows below.
- id: RV-SL-T2J-ACCESS
  kind: chain
  runs: [SLT2J_1, SLT2J_5, SLT2J_10, SLT2J_U, SLT2J_50, SLT2J_100]
  metric: access_ms
  expect: up
  min_change: 0.05
  expect_text: with strictly periodic generation the reserved offset persists from one message to the next, so the mean access wait is (T1 + T2) / 2 and rises with T2
  source: 3GPP TS 38.214 8.1.4; TR 37.885 A.1.1 (periodic traffic, 100 ms)
  fault: order reversed
  measured: 1.198 -> 3.179 -> 5.641 -> 8.82 -> 25.32 -> 49.73 (2026-10-25, NR unranked; before 1.198 -> 3.373 -> 6.102 -> 9.555 -> 26.27 -> 47.29)
  verdict: pass

- id: LR.G.c1.stops
  base: Gc0
  variant: G0
  area: glosa
  measure: g.stops_per_km
  expect: down
  min_change: 0.03
  source: GLOSA followed cuts stops (Treiber and Kesting 2014, arXiv:1408.5498, about 15 % fewer stops
    for advised vehicles at 50 km/h; Katsaros et al. 2011 IWCMC, growing with penetration); the class
    mixes advised and unadvised vehicles, so at least 3 %
  measured: 1.15827 -> 1.10019
  verdict: pass
- id: LR.G.c1.fuel
  base: Gc0
  variant: G0
  area: glosa
  measure: g.fuel_per_100km
  expect: down
  min_change: 0.005
  source: fewer stop-and-go cycles burn less (Treiber and Kesting 2014, about 4 % fuel; Tielert et al.
    2012 ITST)
  measured: 11.1701 -> 11.1177
  verdict: open
  note: down 0.47 % on one seed, under the 0.5 % floor; the seed-2/3 pairs were not run in the window
- id: LR.G.c1.co2
  base: Gc0
  variant: G0
  area: glosa
  measure: g.co2_per_km
  expect: down
  min_change: 0.005
  source: CO2 is proportional to fuel under HBEFA (as LR.G.c1.fuel)
  measured: 191.439 -> 194.177
  verdict: open
  note: 'CO2 per km rose 1.4 % while fuel per km fell 0.5 % in the same passenger class: CO2 is fuel x
    a per-fuel factor under HBEFA, so this needs the diesel/petrol/EV split of the two runs (possible
    energy-layer accounting issue); owed'
- id: LR.G.c1.speed
  base: Gc0
  variant: G0
  area: glosa
  measure: g.mean_speed_mps
  expect: same
  tol: 0.08
  source: GLOSA trades cruising speed for standing time; the travel time is about unchanged (Treiber and
    Kesting 2014 §5), so the mean speed moves by under 8 %
  measured: 8.6245 -> 8.34544
  fault: scale:g.mean_speed_mps:0.85
  verdict: pass
- id: LR.G.c05.stops
  base: Gc0
  variant: Gc05
  area: glosa

    ~2 km and at 0 dBm ~510 m, both beyond the 300 m blocks; the PRR fall at 200-400 m is the NLOS share
    (urban NLOS, 30 log10 d: 77 m at 10 dBm), which power moves. Predicted from a pure log-distance ratio,
    which assumed the 50 % edge was a link-budget edge. Corrected rows: LR.G.p10.heard and the p30/p0
    rows, rewritten before their runs'

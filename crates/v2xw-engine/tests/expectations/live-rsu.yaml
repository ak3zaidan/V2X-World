  expect: ratio
  band:
  - 0.95
  - 1.15
  source: 'rewritten before the run (Gp10 evidence): TR 37.885 Table 6.2.1-1 urban LOS, PL = 38.77 + 16.7
    log10 d + 18.2 log10 5.9 GHz: with 3 dBi each end and about -92 dBm sensitivity the LOS budget at
    10 dBm reaches ~2 km and at 0 dBm ~510 m, both beyond the 300 m blocks; the PRR fall at 200-400 m
    is the NLOS share (urban NLOS, 30 log10 d: 77 m at 10 dBm), which power moves; so the 50 % edge stays
    at the block geometry within [0.95, 1.15]'
  measured: pending
- id: LR.G.p10.range50
  base: G0
  variant: Gp10
  area: radio
  measure: g.spat_range50_m

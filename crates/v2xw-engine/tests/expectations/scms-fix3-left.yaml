# SCMS live-run leftovers, fix round 3 (06-validation-summary.md §9 items 11 and 12; traces
# in docs/validation/live-scms-2026-10-25.md, live-atk-*, live-rsu-*, live-chains-*).
#
# Schema v2xw/scms-run-expectations/1 (matrix.py). Every row was written with
# `measured: pending` and committed before the runs it judges. Base and variant of a row
# always ran on the same binary:
#   - folder r1: the f4982788 release copy (before the fixes of this round);
#   - folder f1: the optimised debug build of this branch with the fixes below.
# Measures: tools/realworld/matrix.py extract plus tools/realworld/live_scms.py extend.
#   python3 -I tools/realworld/matrix.py check <this file> <runs-dir> [--fill]
#   python3 -I tools/realworld/live_scms.py faults <this file> <runs-dir>
# verdict: pass | fixed | wrong-expectation (corrected with the evidence in `note`) | open.
schema: v2xw/scms-run-expectations/1
runs:
  L:
    scenario: scenarios/live-scms/base.yaml
    note: the live SCMS base (credential-lifecycle cut to 180 s)
  L2:
    scenario: scenarios/live-scms/base.yaml
    note: L again, same seed and build stamp (determinism)
  CHP:
    scenario: scenarios/live-scms/chp.yaml
    note: chain_file home-provider (P2PCD on the air)
  KEM:
    scenario: scenarios/live-scms/kem.yaml
    note: kem ml-kem-768 (the 1609.2.1 PDU layer off)
rows:
- id: F3.CHP.b-from-a
  base: L
  variant: CHP
  area: scms
  measure: x.verified.provider-b<-provider-a
  expect: ratio
  band:
  - 0.95
  - 1.0
  source: 'IEEE 1609.2 clause 8 P2PCD is symmetric: a provider-b receiver learns provider-a''s ACA and
    ICA within a few BSMs, as provider-a receivers already do for provider-b (release: a<-b 82,474 ->
    82,016, ratio 0.994). Release b<-a: 82,047 -> 33'
  measured: 82047 -> 82006 (ratio 0.9995)
  verdict: pass
- id: F3.CHP.a-from-b
  base: L
  variant: CHP
  area: scms
  measure: x.verified.provider-a<-provider-b
  expect: ratio
  band:
  - 0.98
  - 1.0
  source: the direction that worked is unchanged by the fix (release ratio 0.994)
  measured: 82474 -> 82761 (ratio 1.003)
  verdict: wrong-expectation
  note: 'the 1.0 ceiling assumed CHP only loses frames. On the fixed build every pair verifies slightly
    more under CHP (a<-a +0.30 %, b<-b +0.69 %, a<-b +0.35 %): the second attacker''s decision came at
    151.7 s against 141.0 s and missed the 150 s CRL, so revoked-sender refusals fell 3,242 -> 3,074
    (loss 0.00345 -> 0.00179) and that attacker''s later frames verify. Within 0.5 % of L either way.
    Why reports received rise 327 -> 429 under CHP is not traced (open)'
- id: F3.CHP.unknown
  base: L
  variant: CHP
  area: scms
  measure: x.unknown_signer_loss
  expect: band
  band:
  - 0.0075
  - 0.02
  source: 'L''s newcomer loss (0.0075) plus about 0.5 % of each direction''s frames until the P2PCD answer
    is learned (release: 0.046, all of provider-a''s frames lost at provider-b)'
  measured: '0.00765507'
  verdict: pass
- id: F3.CHP.delivery
  base: L
  variant: CHP
  area: on-air
  measure: m.delivery_ratio
  expect: ratio
  band:
  - 0.95
  - 1.0
  source: 'verified delivery only loses the learning window (release: 0.160 -> 0.122, ratio 0.76)'
  measured: 0.160084 -> 0.160655 (ratio 1.004)
  verdict: wrong-expectation
  note: 'as F3.CHP.a-from-b: +0.4 % is the CRL-boundary effect (revoked-sender loss 0.0034 -> 0.0018);
    the P2PCD learning window costs under 0.1 % (unknown-signer loss 0.00752 -> 0.00766). The release
    CHP (the fault) gives 0.76'
- id: F3.CHP.responses
  base: L
  variant: CHP
  area: on-air
  measure: r.p2pcd_responses_on_air
  expect: band
  band:
  - 110
  - 200
  source: both providers now ask, so about twice the release's 77 answers (one direction); an answer heard
    by many receivers is learned by all, so less than 2x per receiver
  measured: '161'
  verdict: pass
- id: F3.CHP.cpu
  base: L
  variant: CHP
  area: cost
  measure: cost.cpu_s
  expect: ratio
  band:
  - 0.85
  - 1.5
  source: 'provider-b now verifies provider-a''s 82 k messages again and P2PCD adds ~150 frames: run cost
    close to L (release 45.4 -> 43.5 s with b dropping a''s frames before verifying)'
  measured: 69.98 -> 68.72 (ratio 0.982)
  verdict: pass
- id: F3.L.share-b
  base: L
  variant: L2
  area: scms
  measure: x.verified_share_b
  expect: same
  tol: 0.0
  source: determinism of the fixed build on the per-provider measure
  measured: 0.437596 -> 0.437596
  verdict: pass
- id: F3.L.det
  base: L
  variant: L2
  area: determinism
  measure: digest.records
  expect: identical
  source: 'same seed, same build stamp: the record stream byte for byte'
  measured: e9d40d62d6219933 -> e9d40d62d6219933
  verdict: pass
- id: F3.KEM.dl-delta
  base: L
  variant: KEM
  area: load
  measure: access.uu_dl_bytes
  expect: delta
  band:
  - 160000
  - 215000
  source: 'ML-KEM-768 ciphertext 1,088 B against ECIES-P256 65 + 16 B (FIPS 203 Table 3; IEEE 1609.2 EciesP256EncryptedKey)
    on each of 295 certificates: batch +191 kB, info-response +9.7 kB, successor enrolment -14.8 kB, CRL
    fetches unchanged = +186 kB (release: +26.6 kB)'
  measured: 381511 -> 560195 (delta 1.787e+05)
  verdict: pass
- id: F3.KEM.crl-fetch-share
  base: L
  variant: KEM
  area: load
  measure: access.exchange.crl-fetch.n
  expect: same
  tol: 0.0
  source: the KEM changes neither the poll schedule nor what changed (53 fetches in both)
  measured: 53 -> 53
  verdict: pass
- id: F3.KEM.cpu
  base: L
  variant: KEM
  area: cost
  measure: cost.cpu_s
  expect: ratio
  band:
  - 0.7
  - 1.3
  source: a byte count changes; no new work (release 45.4 -> 41 s)
  measured: 69.98 -> 49.72 (ratio 0.7105)
  verdict: pass

- {id: LV.vprio.rate, case: s2-scms, side: vprio, check: predict, metric: verify_rate, expect: down, min_change: 0.05, fault: swap,
   source: "verify-on-demand / prioritized (1609.2 verification policy, CAMP VSC3): a receiver verifies only the messages its applications act on, not every one",

- {id: R.LTE-vs-DSRC.pdr, runs: [radio-lte], check: ratio_between, expect: pass, fault: "scale:10",
   params: {metric: pdr, other: radio-dsrc, lo: 1.0, hi: 2.0},
   source: "LTE-V2X PC5's turbo coding, SC-FDMA and blind retransmission give a 3-6 dB link-budget gain over 802.11p (5GAA 2017, Qualcomm/Ford field tests: ~2x range), so its PDR is at least DSRC's",
   verdict: wrong-expectation, measured: "ratio 2.26 (0.445/0.197). The pooled PDR weights far bins where DSRC is ~0; the distance where PDR = 0.5 is 340 m against 140 m (2.4x), inside the 1.8-2.6x that a 8-11 dB link-budget gain gives at urban exponents 2.7-3.5. The band [1, 2] was too narrow for a pooled ratio"}

# ---------------------------------------------------------------- (4) 2026-10-26: the 117 unrun scenarios and the fixes
# Runs: release v2xw built from 938fb16a (copied), same flags; multi-day files as 40 s
# overlays without fast-forward as on 10-25; `-fix` runs use the optimised debug v2xw built
# from this branch (the two fixes below). Rows written before the runs they judge, except
# the two correction rows, which say so.
#
# Correction rows (written after their runs were read; the original rows are unchanged):
- {id: SC.records-b, runs: all, check: records, expect: pass, fault: drop-samples,
   params: {period_aware: true},
   source: "correction of SC.records (2026-10-26): a metric window closes only on the time.metric_period_s grid and one closing inside the warm-up is not recorded (run.rs on_metric_flush), so a run whose window holds no period boundary after warmup_s records no sample by design; written after stress/fs-det (period 10 s, warmup 2 s, 5 s window) wrote 1.12 M records and an empty metrics.json",
   verdict: open, measured: "2026-10-26: holds on every run that started (stress/fs-det now passes); red only on the loader refusals and timeouts of SC.boots"}
- {id: SC.peds-b, runs: all, check: ped_output, expect: pass, fault: drop-ped-metrics, fault_run: midtown-pedestrians,
   params: {period_aware: true},
   source: "correction of SC.peds (2026-10-26), for the reason of SC.records-b: no metric period closes after the warm-up in stress/fs-det's 5 s window, so no ped_* sample can exist",
   verdict: pass, measured: "2026-10-26: holds on all 210 runs, fs-det included"}
- {id: SC.radio-b, runs: all, check: radio_output, expect: pass, fault: no-rx,
   params: {range_aware: true},
   exempt: {scale__cost__pq-mldsa87: "every ML-DSA-87 BSM (4,627 B signature) is above the WSMP MTU and fragmenter/none refuses it before the MAC (2,850 net_mtu_refusals, IEEE 1609.3 has no fragmentation): 0 frames is the configured stack, a scenario finding"},
   source: "correction of SC.radio (2026-10-26): 0 receptions is the physics when every reception attempt was below sensitivity or met a half-duplex transmitter (attempts = below-sensitivity + half-duplex); written after scale/2 (5 vehicles on Midtown with buildings: 295 attempts, 291 below sensitivity, 4 half-duplex)",
   verdict: pass, measured: "2026-10-26: holds on 209 runs (scale/2 and scale/base pass on the range rule; pq-mldsa87 exempt)"}
# Finding 1 fixed (fragment_cert_share): each generic-sdu piece of a certificate-bearing SPDU
# repeated the whole certificate. Predicted before the -fix run: the PSMs' certificate share
# falls from 1.37 by about the mean piece count (2 for a ~2.6 kB hybrid SPDU at a ~1.4 kB
# MTU): 1.37 / 2 = 0.69, band [0.55, 0.80]; the envelope octets do not move (security_overhead

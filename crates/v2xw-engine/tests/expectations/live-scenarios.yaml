# Finding 3 behind a flag (traffic.depart_speed_max, SUMO departSpeed="max"). Predictions
# written before the runs, on p1-e4 (3,000 veh/h, 60 s): flag off on the fixed binary is
# byte-identical to the release binary; flag on, the first 10 s mean speed rises from 9.0 to
# at least 15 m/s (a car inserted at ~v0 = 29 m/s needs no 0 -> 29 m/s run-up of ~20 s at
# a = 1.4 m/s^2); the 60 s mean from 15.5 to [16.5, 23] m/s, not to free flow, because the
# synthetic highway is a grid ring whose 15 m corners cap speed at sqrt(5.5 x 15) = 9 m/s

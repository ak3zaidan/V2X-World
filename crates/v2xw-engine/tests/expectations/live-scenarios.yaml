# highway-congestion's shortest window is 80 s (its first breakdown at 75 s) and at ~164
# all-in-range vehicles that run passed the 10-minute budget, so the highway base run is
# p1-e4 (highway-congestion's world at 3,000 veh/h, no events, 60 s). Rows written before it ran.
- {id: W.HWY2.speed, runs: [p1-e4-hwy60], check: band, expect: pass, fault: "scale:10",
   params: {metric: mean_speed, lo: 20.0, hi: 33.0},
   source: "uncongested US freeway (3,000 veh/h offered on 6 lanes, ~500 veh/h/ln, LOS A): space-mean speed near free-flow 60-75 mph (27-33 m/s; HCM 7th ed. Exh. 12-7), lowered by entry acceleration in the first minute",
   verdict: open, measured: "mean_speed 15.5 m/s over 60 s; per-window mean 9.0 (10 s), 12.5 (30 s), 18.0-18.4 (40-60 s), p50 20, p95 29-30. Cause: every vehicle is spawned at 0 m/s (mobility engine.rs spawn_with_route, speed_mps 0.0) mid-lane on a 29 m/s road, and the synthetic highway is a 2 x 2 grid ring with at-grade corners (15 m radius). A real freeway entry merges at speed. Defect candidate; a depart-speed fix moves every traffic golden, so it belongs behind a flag"}
- {id: W.HWY2.vmax, runs: [p1-e4-hwy60], check: kinematics_bounds, expect: pass, fault: speed-80,

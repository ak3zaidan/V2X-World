- {id: W.HWY2.pdr-distance, runs: [p1-e4-hwy60], check: pdr_distance, expect: pass, fault: pdr-rise,
   params: {metric: pdr, dim: dist_bin, near_min: 0.95, far_max: 0.95, tol: 0.05, min_trials: 30},
   source: "as W.HWY.pdr-distance",
   verdict: pass, measured: "LOS: 1.00 to 160 m, 0.92 at 600 m"}
- {id: W.GRID.vmax, runs: [phase1-grid, vru-grid], check: kinematics_bounds, expect: pass, fault: speed-80,
   params: {vmax: 20.0, amin: -10.0, amax: 5.0},
   source: "procedural urban grid, 50 km/h-class streets",
   verdict: pass, measured: "phase1-grid 11.2, vru-grid 11.6 m/s"}
- {id: W.GRID.pdr-distance, runs: [phase1-grid], check: pdr_distance, expect: pass, fault: pdr-rise,
   params: {metric: pdr, dim: dist_bin, near_min: 0.9, far_max: 0.95, tol: 0.05, min_trials: 30},
   source: "as W.MID.pdr-distance",
   verdict: open, measured: "phase1-grid has 2 vehicles and no received pair; vru-grid (187 actors) gives 1.00, 0.94 at 40 m, 0.48 at 120 m, monotone within 0.05"}
- {id: W.PDR.distance, runs: [pdr-vs-distance], check: pdr_distance, expect: pass, fault: pdr-rise,
   params: {metric: pdr, dim: dist_bin, near_min: 0.95, far_max: 0.7, tol: 0.05, min_trials: 30},
   source: "the PDR-vs-distance study: monotone fall with distance, near bins ~1 (Bai et al. 2010; Kenney 2011)",
   verdict: pass, measured: "1.00 at 0-20 m, 0.5 at ~120 m, 0.04 at 600 m"}


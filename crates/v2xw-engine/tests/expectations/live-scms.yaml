  expect: up
  min_change: 0.3
  source: a P-384 verification costs more than a P-256 one on any accelerator
  measured: 0.422132 -> 0.422136
  verdict: open
  note: 'engine modelling choice, not yet fixed: v2xw-node profile::signature_ops keeps the P-256 sign
    and verify ops for every classical curve ("one P-384 figure is not a table"), so P-384 costs exactly
    P-256 (sign 9.012 ms, verify 0.422 ms, the rate still keyed ecdsa-p256-verify) although obu-generic-automotive-soc-no-hsm
    publishes P-384 (8,104 us sign, 5,721 us verify, R5 B.5). Sizes are right (+37 B). Proposed fix: use
    the scheme''s own op where the profile prices it, P-256 otherwise, flagged on the card'

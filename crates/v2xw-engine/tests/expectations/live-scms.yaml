# Live SCMS knob tests (docs/validation/live-scms-2026-10-25.md): one-change variants of
# scenarios/live-scms/base.yaml (credential-lifecycle cut to 180 s: compressed calendar,
# 60 s i-periods, 5 certificates a period, 2 preloaded, 30 s report shuffle, automatic MA,
# CRL every 30 s, 1,500 veh/h, 5 % ConstPos from 60 s), run on the integrator's release
# build of 486c8cba, one run per run-lock call.
#
# Not a sweep table (schema v2xw/scms-run-expectations/1, like scms-matrix.yaml). Every row
# was written with `measured: pending` and committed before the runs it judges.
# Measures: tools/realworld/matrix.py extract plus tools/realworld/live_scms.py extend.
#   python3 -I tools/realworld/matrix.py check <this file> <runs-dir> [--fill]
#   python3 -I tools/realworld/live_scms.py faults <this file> <runs-dir>   (every row red under its fault)
# verdict: pass | fixed | wrong-expectation (corrected with the evidence in `note`) | open.
schema: v2xw/scms-run-expectations/1
runs:
  L:
    scenario: scenarios/live-scms/base.yaml
    note: 'the live SCMS base: credential-lifecycle cut to 180 s'

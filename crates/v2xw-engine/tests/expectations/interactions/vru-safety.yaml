# Interaction checks, vulnerable road users and safety applications
# (docs/validation/test-vru-safety.md). Format: interactions.yaml.

# V2V application warnings need both vehicles equipped: a pair is equipped with
# probability p^2, so at p = 0.5 a quarter of the pairs remain (measured: FCW 20 -> 5,
# all warnings 149 -> 19 at 1.0 -> 0.5).
- name: FCW threshold x equipped fraction (FCW warnings)
  family: intersections
  factor: {apps.fcw_ttc_s: 3.0}
  condition: {actors.vehicles.equipped_fraction: 0.5}
  metric: "metric.app_warnings[app=fcw]"
  expect: dampens
  direction: up
  source: "FCW reads the lead's BSM, so an encounter warns only when both vehicles are equipped (p^2 of pairs; USDOT CV Pilot penetration analyses; SAE J2945/1)"
# A PCW x VRU-device check (device_fraction 0) is not here: with no devices PCW issues no
# warning, and the apps provider then emits no app_warnings sample at all, so the 2 x 2
# reads "not measured" (docs/validation/test-vru-safety.md, open item 7).

    Before (81a12183): passed, but the run no longer tests its premise: MWC2 and MWC refuse exactly the same 152,505
    messages. Both revocations in the multi-week runs are now provider-b''s (the attackers'' providers
    moved with the traffic changes), so the home provider publishes no CRL before its Generator goes down
    at 200,000 s, and MWC2 is MWC. The scenario''s outage needs to start after a home revocation (rerun-2026-10-24-b.md
    §2.5)'

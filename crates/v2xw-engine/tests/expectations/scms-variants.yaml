# LTE-V2X
- id: VB.LTE.latency
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.e2e_latency.bsm.mean
  expect: ratio
  band: [2.5, 8.0]
  source: "PC5 mode 4 SPS waits for its reserved subframe, on average half the 100 ms RRI, where DSRC contends in under a ms (3GPP TS 36.213 §14; Molina-Masegosa & Gozalvez 2017; matrix lte-latency 12.4 -> 69.4 ms)"
  measured: pending
  verdict: pending
- id: VB.LTE.latency-budget
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.e2e_latency.bsm.p95
  expect: le
  value: 100.0
  source: "SAE J3161/1 keeps the 100 ms BSM latency budget; the engine does not align the BSM with its reservation (06 §6 item 16), so this is expected to stay open"
  measured: pending
  verdict: pending
- id: VB.LTE.half-duplex
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.loss_rate.half-duplex
  expect: up
  source: "a PC5 UE cannot receive in a 1 ms subframe it transmits in, and SPS keeps that clash for the reservation's life (Bazzi et al. 2017); DSRC frames are ~0.3 ms"
  measured: pending
  verdict: pending
- id: VB.LTE.bsm-count
  base: Q60
  variant: Q60L
  area: metrics
  measure: air.bsm.frames
  expect: ratio
  band: [0.95, 1.05]
  source: "J3161/1 keeps 10 Hz; its CBR rate rule does not act at a quarter fleet's load"
  measured: pending
  verdict: pending
- id: VB.LTE.devices
  base: Q60
  variant: Q60L
  area: architecture
  measure: p2.devices
  expect: same
  source: "the radio does not change who enters the map, so the same devices are enrolled and provisioned"
  measured: pending
  verdict: pending
- id: VB.LTE.ra-load
  base: Q60

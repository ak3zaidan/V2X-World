- id: RR.MW.topups
  base: MW
  variant: MW
  area: architecture
  measure: p2.certs_topped_up
  expect: band
  band:
  - 1200
  - 1360
  source: one 20-certificate top-up a week per device over the run's live windows (stress MW.rollovers
    1,280 = 64 x 20)
  measured: '1620'
  verdict: wrong-expectation
  note: 'Wrong expectation, corrected with evidence (rerun-2026-10-24-b.md §2.5): the band was the old
    run''s count (64 devices x 20), not a rule. The rule is one 20-certificate top-up per device present
    at a weekly boundary ([CAMP122] Table 67). A receptions-level re-run (MWk, pki.flow) gives 85 top-up
    instances for 49 devices, by simulated week 12/19/21/20/13, no device topped up twice within 3 days,
    2 refused (blocklisted, the revoked attackers): the rule holds. More devices are on the map at each
    boundary than on 77cffb5b (lane-change and traffic changes since), so 81 x 20 = 1,620 certificates.
    Corrected expectation: certs_topped_up = 20 x top-ups completed (81 x 20 = 1,620, as measured) and
    at most one top-up per device per week'
- id: RR.MW.no-overdue
  base: MW
  variant: MW
  area: architecture
  measure: rv.refused_total
  expect: eq
  value: 0
  source: each CRL Generator reissues by nextCrl, so no list goes overdue (stress MW.crl-reissue)
  measured: '0'
  verdict: fixed
  test: phase2::join_crl_tests::a_device_joining_after_a_publication_holds_the_newest_list
  note: 'Fixed by 2a14d6c4 (R-JOINCRL); on the f4982788 release (2026-10-27, 06 §9) MW refuses 0
    messages (was 16,618). Before: R-JOINCRL (06 §6 item 7), now shown in the base run itself: all 16,618 crl-overdue refusals (labelled
    signature-invalid on node.rx, 06 §6 item 13) are at 33 receivers that join mid-run, every one after
    t0 + 21 d = 1,814,400 s, each refusing from its first reception (median 0.1 s, max 92 s) until its
    first CRL download. No device present before 700 s refuses anything. A joiner holds only the t0 lists;
    it should hold the newest list each CRACA published before it joined'
- id: RR.MWC.overdue
  base: MW
  variant: MWC
  area: metrics
  measure: rv.refused.crl-overdue
  expect: ge
  value: 1
  source: '1609.2 CRL overdue rule: with the home Generator down from 700 s the t0 list goes overdue at
    t0 + 21 d and the home CRACA''s messages are refused (rerun §7, R-NOCRL fixed)'
  measured: '0'
  verdict: open
  note: 'Open, 2026-10-27 on the f4982788 release (06 §9): 0 refusals of any kind (rv.refused_total 0;
    was 152,505 on 81a12183). The rule itself acts: the same run with security.scms.crl_overdue_tolerance_s
    0 refuses 33,572 as crl-overdue, and v2xw-node rxval.rs (overdue, lines 985-991) is unchanged since
    81a12183. The home Generator is down as written (8 versions published against MW''s 11). So no receiver
    in W4 (1,814,340-1,814,460 s) or W5 (2,419,500-2,419,920 s) holds a home list past nextCrl + 14 d.
    The likeliest cause is what a mid-run joiner is handed at power-on since R-JOINCRL (2a14d6c4, phase2.rs
    prerun_crl lines 7375-7383: published_crl_for in place of the t0 snapshot), not yet confirmed on
    the records. Before: 152,505, of which 16,618 were the base''s joiners'
- id: RR.MWC2.overdue

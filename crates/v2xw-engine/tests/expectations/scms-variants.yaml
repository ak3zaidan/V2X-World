- id: VB.LTE.latency
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.e2e_latency.bsm.mean
  expect: ratio
  band:
  - 2.5
  - 8.0
  source: PC5 mode 4 SPS waits for its reserved subframe, on average half the 100 ms RRI, where DSRC contends
    in under a ms (3GPP TS 36.213 §14; Molina-Masegosa & Gozalvez 2017; matrix lte-latency 12.4 -> 69.4
    ms)
  measured: 12.3628 -> 67.771 (ratio 5.482)
  verdict: pass
- id: VB.LTE.latency-budget
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.e2e_latency.bsm.p95
  expect: le
  value: 100.0
  source: SAE J3161/1 keeps the 100 ms BSM latency budget; the engine does not align the BSM with its
    reservation (06 §6 item 16), so this is expected to stay open
  measured: '110.438'
  verdict: open
  note: 'Known (06 §6 item 16, matrix lte-latency-budget 112 ms): the BSM is generated without regard
    to its SPS reservation, which J3161/1 has the application align with'
- id: VB.LTE.half-duplex
  base: Q60
  variant: Q60L
  area: metrics
  measure: m.loss_rate.half-duplex
  expect: up
  source: a PC5 UE cannot receive in a 1 ms subframe it transmits in, and SPS keeps that clash for the
    reservation's life (Bazzi et al. 2017); DSRC frames are ~0.3 ms
  measured: 0.00283612 -> 0.00372878
  verdict: pass
- id: VB.LTE.bsm-count
  base: Q60
  variant: Q60L
  area: metrics
  measure: air.bsm.frames
  expect: ratio
  band:
  - 0.95
  - 1.05
  source: J3161/1 keeps 10 Hz; its CBR rate rule does not act at a quarter fleet's load
  measured: 41702 -> 82711 (ratio 1.983)
  verdict: wrong-expectation
  note: 'Wrong expectation, corrected with evidence: SAE J3161/1 sends each packet twice (one blind HARQ
    retransmission, ''Blind HARQ: Yes'' in the deployed-profile tests, 5GAA P-190033 Table 32; SpsParams::sae_j3161
    max_transmissions 2), so frames are 2x the BSMs. MAC grants 49,644 against DSRC''s 49,983 frames,
    phy.prr 49,643: the BSM rate itself is unchanged. Corrected expectation: frames x1.9-2.05; measured
    x1.983'

- id: VB.LTE.honest
  base: Q60
  variant: Q60L
  area: architecture
  measure: p2.revoked_honest
  expect: eq
  value: 0
  source: "as VB.Q60.honest"
  measured: pending
  verdict: pending
- id: VB.LTE.cost
  base: Q60
  variant: Q60L

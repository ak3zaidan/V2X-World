  expect: eq
  value: 1
  source: 'CAMP 1.2.2: one certificate request per device at provisioning (ra-maxReqs 1, 2 weeks x 20
    certificates; 04 §4.1)'
  measured: '2'
  verdict: wrong-expectation
  note: 'Wrong expectation, corrected with evidence (rerun-2026-10-24-b.md §3.2): the devices with two

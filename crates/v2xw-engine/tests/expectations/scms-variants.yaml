  source: "honest traffic only and an 8 h manual MA review (D3): no decision inside 40 s"
  measured: pending
  verdict: pending
- id: RR.FS40.cost
  base: FS40
  variant: FS40
  area: performance
  measure: cost.peak_mb
  expect: le
  value: 1500
  source: "final-bench R-FS40 910 MB at metrics level; events level adds the streamed records only"
  measured: pending
  verdict: pending

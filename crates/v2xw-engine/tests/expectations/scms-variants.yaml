# SCMS re-runs on 81a12183 and the benchmark variants owed in scms-real-benchmark.md §10
# (docs/design/scms-real/testing/rerun-2026-10-24-b.md). Every `expect` was written and
# committed with `measured: pending` before the run it judges. Checker:
#   python3 tools/realworld/matrix.py extract <runs>/<id>      (one per run)
#   python3 tools/realworld/matrix.py check  <this file> <runs> [--fill]
# `measured` is base -> variant, or the variant's value. Not a sweep table: `v2xw
# sensitivity` passes over it by its `schema`.
#
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
#
# Binary: the release build of 81a12183 (the integrator's), copied to the scratchpad; seed
# 0xBE7C_0001 (the benchmark's) or the scenario's own; --no-verify; one run per run-lock
# call (2,500 MB cap); 2 rayon threads unless a run says otherwise.
schema: v2xw/scms-run-expectations/1

runs:
  PQ0:
    scenario: scenarios/real-world/stress/pq-base.yaml
    note: "quarter fleet, 60 s live, generic-sdu fragmenter, software-crypto OBU, ECDSA P-256 (--record-level metrics)"
  PQ0-1:
    scenario: scenarios/real-world/stress/pq-base.yaml
    note: "PQ0 at 1 rayon thread (determinism)"
  PQHFC: {scenario: scenarios/real-world/stress/pq-hybrid-falcon512-certcycle.yaml, base: PQ0}
  PQHMC: {scenario: scenarios/real-world/stress/pq-hybrid-mldsa44-certcycle.yaml, base: PQ0}
  PQHM: {scenario: scenarios/real-world/stress/pq-hybrid-mldsa44.yaml, base: PQ0}
  FS40:
    scenario: scenarios/real-world/stress/fs-40.yaml
    note: "the R-FS40 window: full fleet, 0-40 s live, 10 s warm-up (--record-level events)"
  M0:
    scenario: scenarios/real-world/midtown-scms-realism.yaml
    note: "the realism base of the matrix (--record-level events)"
  GRAW: {scenario: scenarios/real-world/matrix/gnss-raw.yaml, base: M0}
  MW:
    scenario: scenarios/edge/multi-week.yaml
    note: "the 33-day conformance run on the real calendar (--record-level metrics)"
  MWC: {scenario: scenarios/edge/multi-week-crlg-down.yaml, base: MW}
  MWC2: {scenario: scenarios/edge/multi-week-crlg-down-late.yaml, base: MW}
  Q60:
    scenario: scenarios/real-world/variants/q60.yaml
    note: "the quarter-fleet benchmark, 0-60 s live, 30 s warm-up, no fast-forward (--record-level events)"
  Q60L: {scenario: scenarios/real-world/variants/q60-lte.yaml, base: Q60}
  Q60X2: {scenario: scenarios/real-world/variants/q60-2x.yaml, base: Q60}
  Q60P: {scenario: scenarios/real-world/variants/q60-portland.yaml, base: Q60}

rows:
# ------------------------------------------------ (1) post-quantum re-runs (final-run §2, final-bench §3)
- id: RR.PQHFC.bsm-bytes
  base: PQ0
  variant: PQHFC
  area: metrics
  measure: air.bsm.psdu_mean
  expect: delta
  band: [160, 185]
  source: "NDSS 2024 (Twardokus et al.) Partially-Hybrid: the 858 B Falcon-512 hybrid certificate once in each 5-SPDU cycle, +858/5 = 172 B per BSM; final-run PQHFC.sizes measured +173 B"
  measured: pending
  verdict: pending
- id: RR.PQHFC.one-frame
  base: PQ0
  variant: PQHFC
  area: metrics
  measure: air.bsm.frames
  expect: ratio
  band: [0.995, 1.005]
  source: "the cycle keeps every BSM inside one frame (380 B < the 1,400 B WSMP MTU); final-run PQHFC.sizes 41,903 -> 41,903"
  measured: pending
  verdict: pending
- id: RR.PQHFC.verify-cost
  base: PQ0
  variant: PQHFC
  area: performance
  measure: m.verify_cost.mean
  expect: ratio
  band: [0.95, 1.05]
  source: "ECDSA verifies every SPDU; the PQ certificate check is under 1 % of checks (final-run PQHFC.verify 0.6278 -> 0.6288 ms)"
  measured: pending
  verdict: pending
- id: RR.PQHMC.bsm-bytes
  base: PQ0
  variant: PQHMC
  area: metrics
  measure: air.bsm.psdu_mean
  expect: delta
  band: [590, 625]
  source: "the 3,035 B ML-DSA-44 hybrid certificate once in each 5 SPDUs: +607 B per BSM (final-run PQHMC.sizes 814 B, +607)"
  measured: pending
  verdict: pending
- id: RR.PQHMC.cbr
  base: PQ0
  variant: PQHMC
  area: metrics
  measure: m.cbr.172.mean
  expect: ratio
  band: [2.5, 4.5]
  source: "airtime scales with the PSDU (+607 B on 207 B, ~3.5x the BSM airtime; final-run PQHMC.airtime CBR 0.0100 -> 0.0366)"
  measured: pending
  verdict: pending
- id: RR.PQHM.fragments
  base: PQ0
  variant: PQHM
  area: metrics
  measure: air.bsm.frames
  expect: ratio
  band: [2.1, 2.5]
  source: "hybrid ML-DSA-44 on every SPDU: a 2.4 kB signature plus a 3 kB certificate once a second spreads a BSM over 2.30 frames on average (final-bench PQHM.sizes, stress PQ.sizes)"
  measured: pending
  verdict: pending
- id: RR.PQHM.delivery
  base: PQ0
  variant: PQHM
  area: metrics
  measure: rv.checked
  expect: ratio
  band: [0.55, 0.80]
  source: "a message reaches the node only whole, so its PDR is about PDR_frag^k (k ~2.3): final-bench verified -33.8 %"
  measured: pending
  verdict: pending
- id: RR.PQ.determinism
  base: PQ0
  variant: PQ0-1
  area: performance
  measure: digest.record
  expect: identical
  source: "the engine is deterministic across thread counts (02-architecture §determinism; stress PQ.determinism)"
  measured: pending
  verdict: pending

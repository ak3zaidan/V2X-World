# Expectation rows, traffic and pedestrians (second wave). Format: see catalogue.yaml.
# actors.* and traffic.* run on the signalised Midtown-shaped grid (4 x 6 blocks, two
# lanes each way, 60 s cycle, 1500 veh/h Poisson demand, 90 s); world.signals.* and
# world.highway_preset on downtown Portland (OSM); actors.vru.* on the pedestrian grid.

# ---- Demand and penetration ----
- {setting: actors.vehicles.demand.rate_veh_per_h, change: high, metric: cbr_mean, expect: up,
   source: "more vehicles, more BSMs per second on the channel (SAE J2945/1; ETSI TS 102 687)"}
- {setting: actors.vehicles.demand.rate_veh_per_h, change: high, metric: traffic.speed_mean_mps, expect: down, min_change: 0.002,
   source: "speed falls as flow approaches capacity at signals (Webster 1958 delay; HCM 7th ed. 19 uniform + incremental delay)"}
- {setting: actors.vehicles.demand.rate_veh_per_h, change: low, metric: cbr_mean, expect: down,
   source: "fewer transmitters (ETSI TS 102 687)"}
- {setting: actors.vehicles.demand.rate_veh_per_h, change: low, metric: frames_tx, expect: down,
   source: "frames scale with equipped vehicles (SAE J2945/1)"}
- {setting: actors.vehicles.demand.fleet_size, change: high, metric: traffic.actors, expect: up,
   source: "a larger fleet is more vehicles on the network (SUMO --scale / fleet size)"}
- {setting: actors.vehicles.demand.fleet_size, change: high, metric: cbr_mean, expect: up,
   source: "more transmitters in range, more busy time (ETSI TS 102 687)"}
- {setting: actors.vehicles.demand.rate_veh_per_h_per_lane_km, change: high, metric: traffic.actors, expect: up,
   source: "an arrival rate per lane-km times the world's lane-km is the Poisson rate (city.rs adapt_to_world; SUMO randomTrips --period scaled by network length)"}
- {setting: actors.vehicles.demand.rate_veh_per_h_per_lane_km, change: low, metric: traffic.actors, expect: down,
   source: "Poisson arrivals: rate x time (SUMO randomTrips)"}
- {setting: actors.vehicles.equipped_fraction, change: 0.5, metric: cbr_mean, expect: down, band: [0.2, 0.8],
   source: "only equipped vehicles transmit: half the transmitters, roughly half the busy time at low load (USDOT CV pilot market-penetration evaluations; ETSI TS 102 687). The low end is 0, where no CBR is measured at all"}

# ---- Car following (IDM / Krauss; Treiber and Kesting, Traffic Flow Dynamics 2013) ----
- {setting: actors.vehicles.drivers.time_headway_s, change: high, metric: metric.headway_time, expect: up, min_change: 0.05,
   source: "IDM desired gap s* = s0 + vT: the following time headway grows with T (Treiber, Hennecke, Helbing 2000, eq. 2). No steady-state band: on a signalised grid following pairs are mostly launching or closing on a queue, and headways over 6 s are not following (Vogel 2003), so the mean moves less than T (+15 % measured for T doubled)"}
- {setting: actors.vehicles.drivers.min_gap_m, change: high, metric: metric.headway_distance, expect: up, min_change: 0.003,
   source: "IDM jam distance s0 is the standstill gap (Treiber 2000); SUMO vType minGap. Small: s0 is a few metres of a ~60 m mean moving gap, and only queued vehicles sit at s0 (+0.9 % measured)"}
# The first wave took reaction time from Krauss (headway grows with tau). The engine's
# drivers are IDM plus the Human Driver Model, where the reaction time T' delays the
# response but does not set the desired gap; anticipation compensates it up to about T
# (Treiber, Kesting, Helbing, Physica A 360, 2006). Measured: headway up 4 % at the low
# end, so no headway direction is claimed; what T' must do is change the dynamics.
- {setting: actors.vehicles.drivers.reaction_time_s, change: high, metric: traffic.stopped_share, expect: changes, min_change: 0.005,
   source: "HDM: a delayed response changes queue formation and discharge (Treiber, Kesting, Helbing 2006, Physica A 360, 71-88)"}
- {setting: actors.vehicles.drivers.speed_factor, change: low, metric: metric.flow, expect: down,
   source: "slower desired speeds lower flow on an undersaturated network (q = k v; SUMO speedFactor)"}
- {setting: actors.vehicles.drivers.start_reaction_s, change: high, metric: traffic.stopped_share, expect: up, min_change: 0.003,
   source: "a longer start-up reaction is more start-up lost time per green (HCM 7th ed. 19.2: 2 s lost time; Bonneson 1992)"}
- {setting: actors.vehicles.drivers.start_reaction_s, change: low, metric: traffic.stopped_share, expect: down,
   source: "less start-up lost time, queues discharge sooner (HCM 7th ed. 19.2)"}
- {setting: actors.vehicles.drivers.max_accel_mps2, change: low, metric: metric.flow, expect: down, min_change: 0.002,
   source: "slower launches lengthen queue discharge (IDM a; Treiber 2000)"}

# ---- Per-class drivers (a 20 % truck / bus / motorcycle fleet, catalogue.yaml context) ----
- {setting: actors.vehicles.drivers.truck.max_accel_mps2, change: low, metric: traffic.speed_mean_mps, expect: down, min_change: 0.0005,
   source: "a heavy vehicle's launch sets the queue discharge behind it: lower truck acceleration, more delay (HCM 7th ed. heavy-vehicle factor f_HV; SUMO truck vType accel 1.3 m/s2). At 1500 veh/h the grid runs far below capacity (X << 1), where heavy vehicles cost only their own launches: small (-0.1 % measured)."}
- {setting: actors.vehicles.drivers.truck.time_headway_s, change: high, metric: metric.headway_time, expect: up,
   source: "IDM desired gap s0 + vT applies per class: trucks keeping longer gaps raise the fleet's mean headway (Treiber 2000; Yang et al. TRR 2014 truck headways)"}
- {setting: actors.vehicles.drivers.bus.max_accel_mps2, change: low, metric: traffic.speed_mean_mps, expect: down, min_change: 0.0005,
   source: "slower bus launches lengthen queue discharge (HCM 7th ed. f_HV; SUMO bus vType accel 1.2 m/s2). At 1500 veh/h the grid runs far below capacity (X << 1), where heavy vehicles cost only their own launches: small (-0.1 % measured)."}
- {setting: actors.vehicles.drivers.motorcycle.max_accel_mps2, change: low, metric: metric.acceleration, expect: changes, min_change: 0.0005,
   source: "a fifth of the fleet with a different launch must move the fleet's acceleration statistics (Vlahogianni, Transportation Research Part C 2014: powered two-wheeler acceleration)"}

# ---- Signals and junctions ----
- {setting: traffic.signals.control, change: actuated, metric: traffic.stopped_share, expect: down,
   source: "actuated control ends green when the queue clears and serves demand as it arrives: less delay at moderate volume (HCM 7th ed. 19.4; FHWA Signal Timing Manual 2e, 5.3)"}
- {setting: traffic.signals.control, change: actuated, metric: traffic.speed_mean_mps, expect: up,
   source: "less signal delay, higher average travel speed (FHWA Signal Timing Manual 2e)"}
- {setting: traffic.signals.control, change: nema, metric: traffic.stopped_share, expect: down,
   source: "the dual ring times both directions' throughs and lefts concurrently within a barrier group instead of in sequence, and each ring gaps out on its own (FHWA Signal Timing Manual 2e, NCHRP Report 812, 5.1.2 Exhibit 5-3 and 5.3)"}
# traffic.signals.nema.max_recall -> report.signal_gap_outs down (WP-17's second row) is a
# list-valued setting, which `sensitivity --expect` cannot sweep ("not a published
# setting"); it is measured by hand in traffic-r5.yaml R5.nema.max-recall (79 -> 0).
- {setting: traffic.signals.passage_s, change: high, metric: traffic.stopped_share, expect: up,
   source: "a long passage (gap) time extends green after the queue clears while the other approaches wait (FHWA Signal Timing Manual 2e, 5.3.2; Bonneson and McCoy, NCHRP 3-66)"}
- {setting: traffic.signals.min_green_s, change: low, metric: traffic.stopped_share, expect: down,
   source: "a shorter minimum green wastes less green on a light approach (FHWA Signal Timing Manual 2e, 5.3.1)"}
- {setting: world.signals.cycle_s, change: high, metric: traffic.speed_mean_mps, expect: down,
   source: "below saturation, uniform delay grows with the cycle length: d1 = 0.5 C (1 - g/C)^2 / (1 - X g/C) (Webster 1958; HCM 7th ed. eq. 19-19)"}
- {setting: world.signals.cycle_s, change: low, metric: traffic.speed_mean_mps, expect: up,
   source: "Webster 1958: shorter cycles, less uniform delay while capacity holds"}
- {setting: world.signals.progression_speed_mps, change: high, metric: traffic.speed_mean_mps, expect: down,
   source: "offsets timed for a speed faster than traffic drives break the green band (Morgan and Little 1964; FHWA Signal Timing Manual 2e, 6.4)"}
- {setting: world.signals.progression_speed_mps, change: low, metric: traffic.speed_mean_mps, expect: down,
   source: "offsets timed for a slower speed than traffic drives make platoons arrive early on red (FHWA Signal Timing Manual 2e, 6.4)"}
- {setting: traffic.right_turn_on_red, change: false, metric: traffic.speed_mean_mps, expect: down,
   source: "right-turners wait the red out: more delay (HCM 7th ed. 19.4 RTOR)"}
- {setting: traffic.kerbside.taxi_share, change: high, metric: traffic.speed_mean_mps, expect: down,
   source: "kerbside pick-ups block the kerb lane (HCM 7th ed. 19 f_bb bus/parking blockage factor; SUMO stops)"}
- {setting: traffic.kerbside.taxi_share, change: high, metric: traffic.stopped_share, expect: up,
   source: "a stopped taxi and the vehicles queued behind it are stopped (HCM 7th ed. f_bb)"}
- {setting: traffic.turn_lateral_accel_mps2, change: low, metric: traffic.speed_mean_mps, expect: down, min_change: 0.003,
   source: "the turn speed is sqrt(a_lat R): a lower comfortable lateral acceleration means slower turns (AASHTO Green Book 2018, 3.3.5). Small: turning is a short share of a trip on a grid (-0.9 % measured)"}

- {setting: traffic.kerbside.enabled, change: false, metric: traffic.stopped_share, expect: down,
   source: "no kerbside stops, no lane blockage behind stopped taxis and deliveries (HCM 7th ed. 19 f_bb)"}
- {setting: traffic.lane_changes, change: false, metric: traffic.speed_mean_mps, expect: changes, min_change: 0.002,
   source: "MOBIL lane changes let vehicles pass slower or turning leaders; without them each lane runs at its slowest leader (Kesting, Treiber, Helbing, TRR 1999, 2007), so speed must move"}

# ---- Weather (FHWA-HOP-07-073; HCM 7th ed. Exhibit 11-20) ----
- {setting: weather.initial, change: rain, metric: traffic.speed_mean_mps, expect: down,
   source: "rain lowers free-flow speed 2-14 % on arterials (Rakha et al., FHWA-HOP-07-073, 2007; HCM 7th ed. Exhibit 11-20)"}
- {setting: weather.initial, change: snow, metric: traffic.speed_mean_mps, expect: down, band: [0.5, 0.95],
   source: "snow lowers free-flow speed 5-40 % (FHWA-HOP-07-073; HCM 7th ed. Exhibit 11-20)"}
- {setting: weather.initial, change: snow, metric: metric.headway_time, expect: up,
   source: "drivers keep longer headways in snow: saturation headway +12-20 % (Perrin, Martin, Hansen, TRR 1776, 2001)"}
- {setting: weather.surface, change: ice, metric: metric.ttc_conflicts, expect: up,
   source: "on ice the braking cap (mu g) binds: more low-TTC conflicts (AASHTO Green Book 2018 3.2.2 friction; SSAM TTC < 1.5 s)"}

# ---- Radio in the built environment ----
- {setting: world.buildings.enabled, change: false, metric: prr, expect: up,
   source: "no buildings, no NLOS loss between streets (3GPP TR 37.885 6.2.1 LOS / NLOS; Mangel, Klemp, Hartenstein 2011)"}
- {setting: world.buildings.enabled, change: false, metric: cbr_mean, expect: up,
   source: "without building loss each frame is sensed over a larger area (ETSI TS 102 687)"}
- {setting: radio.channel_model.building_loss_db_per_m, change: low, metric: prr, expect: up,
   source: "less loss per metre of building crossed (Sommer et al., Veins obstacle model, IEEE WONS 2011: beta per metre)"}
- {setting: radio.channel_model.building_wall_loss_db, change: low, metric: prr, expect: up,
   source: "less loss per wall crossed (Sommer et al. WONS 2011: beta per wall)"}

# ---- Pedestrians and cyclists (Midtown grid with crossings) ----
- {setting: actors.vru.pedestrians, change: high, metric: frames_tx, expect: up,
   source: "every equipped pedestrian sends PSMs (SAE J2945/9 2017)"}
- {setting: actors.vru.device_fraction, change: high, metric: frames_tx, expect: up,
   source: "only pedestrians carrying a device transmit (SAE J2945/9)"}
- {setting: actors.vru.cyclists, change: high, metric: vru.actors, expect: up,
   source: "the cyclist count is the population spawned"}
- {setting: actors.vru.red_crossing_share, change: high, metric: traffic.stopped_share, expect: up,
   source: "drivers yield to pedestrians crossing against the signal (Uniform Vehicle Code 11-502; Brosseau et al. 2013 measured 10-30 % red crossings)"}

# ---- Vehicle dynamics (WP-22; docs/design/research/grade-dynamics.md): the grade on the freight family (flat freeway, 30 % trailers), the power limit on grade-truck (the same on a draped 5 % ramp) ----
- {setting: traffic.vehicle_dynamics.power_limit, change: true, metric: traffic.speed_mean_mps, expect: down, min_change: 0.001,
   source: "power = force x speed: the 120 kg/kW design truck (AASHTO Green Book 2001 via NCHRP 505 App. D) gives less than the IDM asks above about 15 m/s, so tractor-trailers take longer to reach speed (the flat-road part is pinned by tests/vehicle_dynamics.rs). Judged on the grade-truck family, the same road draped on a 5 % ramp (P22.4), as the plan's upgrade row: a power-limited heavy vehicle loses speed on the climb towards its crawl speed (AASHTO Green Book truck speed-distance curves [verify figure])"}
- {setting: traffic.vehicle_dynamics.grade, change: true, metric: traffic.speed_mean_mps, expect: same, min_change: 0.0,
   source: "g sin(theta) is zero on a level road (SUMO KraussPS aMax - g sin(slope)); the freight road is flat, so the grade alone moves nothing"}

# ---- Traffic yields to emergency vehicles (WP-20; emergency family = connected-intersections.yaml, 120 s) ----
- {setting: traffic.emergency_yield.enabled, change: true, metric: report.emergency_distance_m, expect: up, min_change: 0.02,
   source: "drivers pull to the right-hand edge and stop for an approaching emergency vehicle, and every other driver yields it the right of way (NY VTL 1144(a), re-read 2026-10-28; UVC 11-405); it passes a red after stopping (UVC 11-106(b)2): in a fixed window it drives further. The plan's report.emergency_travel_time_s was replaced: a completed-trip time over a 120 s window is biased (faster vehicles complete longer trips). SUMO bluelight device behaviour"}

# ---- A measured hill (WP-26 P26.2): world.terrain.drape on the hills family (downtown Portland on its 1 arc-second DEM, grade and power limit on in both runs) ----
- {setting: world.terrain.drape, change: true, metric: traffic.speed_mean_mps, expect: down, min_change: 0.001,
   source: "a vehicle's acceleration less g sin(theta) on the draped slopes (SUMO KraussPS) and the class power limit on the climbs (WP-22): uphill a car loses acceleration, while downhill the speed limit and the signals cap what it gains, so the network mean falls; 19.6 % of this map's road is steeper than 4 % (worlds/dem/portland-downtown.md)"}
- {setting: world.terrain.drape, change: true, metric: prr, expect: changes, min_change: 0.001,
   source: "undraped, the vehicles' antennas stand at z = 0 under a ground the terrain knife-edge term reads up to 115 m high (ITU-R P.526 diffraction over the DEM profile); draped they stand on it, so the terrain loss on each link changes. The direction is not predicted (wp25-plus-build-plans.md WP-26)"}


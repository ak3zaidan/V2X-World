  note: "0.19 -> 10.8 ms; the source's 4-core and 2-core utilisations are wrong for the medium compute tier (one CPU server each, LC.OB.wait-c2sw-nodcc): rho 0.40 vs 0.79 on one server, which still predicts the rise"

# ---------------------------------------------------------------- chain 4: backend outage -> CRL late -> revoked attacker accepted longer
- id: LC.CRL.enforcement-lost
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.revoked_receptions
  expect: down
  min_change: 0.3
  source: 'a receiver refuses a revoked certificate only once it holds a CRL listing it (IEEE 1609.2 5.1.3; CAMP 1.2.2 CRL); the CRLG down 60-200 s issues no CRL then, so each revocation decided in it (S revokes 4 attackers ~30-60 s after 60 s) is enforced from ~200 s, not ~decision + 8 s publish + <= 30 s fetch: about 40 s of enforcement left of ~140'
  verdict: open
  note: "premise not met: the deployment has two providers (provider-a 52 devices, provider-b 46) and actors.backend.failures resolves 'crlg' on the HOME provider's run only (crypto_config::failure_node on runs[0]); both in-window decisions (140.9 s, attackers 39 and 48) were provider-b's, provider-a's one came at 233.4 s, after the outage; 0 deliveries held or dropped, every SCMS output identical to S to the nanosecond. Owed: a provider-qualified failure node (e.g. 'provider-b/crlg') so a scenario can take down the CRLG that holds the revocation, then this re-run"
- id: LC.CRL.latency-up
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.revocation_latency_ns
  expect: up
  min_change: 0.5
  source: 'the decision -> enforced latency carries the rest of the outage (up to 140 s) on top of S''s ~16 s'
  verdict: open
  note: "as LC.CRL.enforcement-lost: the outage never met a revocation"
- id: LC.CRL.delayed-not-lost
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.revoked_attackers
  expect: same
  tol: 0.0
  source: 'the MA''s revocation requests reach the CRLG over a reliable backend transport (TLS over TCP, retried by the sender; CAMP 1.2.2 backend interfaces): an outage delays the CRL entries, it does not erase decisions; the same seed revokes the same attackers once the CRLG is back'
- id: LC.CRL.decisions-unchanged
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.ma_revoke_decisions
  expect: same
  tol: 0.0
  source: 'the MA is upstream of the CRLG: detection, reports and the MA''s decisions do not depend on CRL issuance'
- id: LC.CRL.attackers-reported-longer
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.reports_about_attackers
  expect: up
  min_change: 0.05
  source: 'a revoked attacker whose certificates are still accepted keeps being verified, judged and reported by its neighbours (detectors read only what the receiver accepted)'
  verdict: open
  note: "as LC.CRL.enforcement-lost"
- id: LC.CRL.dose
  base: scms-crlg
  variant: scms-crlg-short
  area: crl-chain
  measure: p2.revoked_receptions
  expect: up
  min_change: 0.2
  source: 'an outage ending at 130 s instead of 200 s leaves 70 s more enforcement: dose-response'
  verdict: open
  note: "2026-10-26: run on the 938fb16a release (scms-crlg-short; scms-crlg-rel as its same-binary base): identical to scms-crlg, 22,318 -> 22,318: the home CRLG holds no in-window revocation, so the premise still fails. Superseded by LC.CRL.b-dose on provider-b's CRLG | 2026-10-25: not run: its premise (LC.CRL.enforcement-lost) did not hold"
- id: LC.CRL.store-fetches
  base: S
  variant: scms-crlstore
  area: crl-chain
  measure: p2.crl_downloads
  expect: down
  min_change: 0.2
  source: 'the CRL store is the distribution point vehicles fetch from every 30 s over Uu: with it down 60-200 s, 140 s of 240 s of fetches find nothing'
  verdict: open
  note: "53 -> 53 downloads, 0 deliveries dropped: in this model a device's CRL fetch is answered by its RA ('the composite list its RA serves', phase2 R-JOINCRL, [PRIMER] pp. 5, 8), so a CRL-store outage does not reach fetches; and the store named is provider-a's only. Whether the deployed US fetch path is the RA or a CRL store is not settled here"
- id: LC.CRL.store-issuance-unchanged
  base: S
  variant: scms-crlstore
  area: crl-chain
  measure: p2.crls_issued
  expect: same
  tol: 0.0
  source: 'the CRLG still issues on its cadence; only distribution is down'
- id: LC.CRL.broadcast-softens
  base: X-crl-paths
  variant: X-crl-paths
  area: crl-chain
  measure: x.value
  expect: band
  band: [-1.0e+09, -1.0e-06]
  source: 'with only the store down, the RSU still repeats the CRLs it was given on the air (role crl, CAMP RSU CRL broadcast), so less enforcement is lost than with issuance down'
  verdict: open
  note: "contrast 0: neither outage moved anything (above)"
- id: LC.CRL.fleet-unchanged
  base: S
  variant: scms-crlg
  area: crl-chain
  measure: p2.devices
  expect: same
  tol: 0.0
  source: 'a backend outage does not change the fleet: the same seed enrols the same devices'
# ---------------------------------------------------------------- chain 5: GNSS degradation -> honest triggers -> reports -> MA load
- id: LC.GN.jumps-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: p2.verdicts.positionJump
  expect: ratio
  band: [3.0, 15.0]
  source: 'a 12 m outlier inside 100 ms implies 120 m/s and trips the position-jump check at every receiver that verifies the BSM (VeReMi/F2MD legacy-12): verdicts scale with outlier events, x10 (minus those hidden behind report rate limits)'
  verdict: wrong-expectation
  note: "2026-10-26: legacy-12's position-jump score is disp / (avg_v dt + 3 tol + 5 m) with tol >= 2.5 m (v2xw-threat detect.rs `motion`), so a 12 m jump scores at most (v dt + 12) / (v dt + 12.5) < 1 at any speed, and a detector fires only after min_consecutive = 2 flagged messages; a single-fix outlier gives neither. Confirmed by a dose in magnitude: 30 m outliers at the same rate take position jumps 7 -> 49 and honest reports 34 -> 145 (LC.GN.m30-*). Correction: LC.GN.jumps-g10-bounded | 2026-10-25: 7 -> 7 position-jump verdicts with ~1,760 single-fix 12 m outliers (0.1/s x 98 vehicles x 180 s) instead of ~176; at 0.5/s (~8,800) 7 -> 10. Yet removing outliers AND bursts (g0) removes every position jump and 27 of 34 honest reports: the degraded bursts, not the outliers, drive honest reports. Either legacy-12 tolerates a one-fix 12 m jump (its checks gate on stated confidence and consecutive pairs) or outliers do not reach the judged BSMs; telling them apart needs node.tx positions against gt (owed, a recorded run)"
- id: LC.GN.jumps-g0
  base: S
  variant: scms-g0
  area: gnss-chain
  measure: p2.verdicts.positionJump
  expect: down
  min_change: 0.3
  source: 'no outliers, no outlier jumps: what is left is attackers and turning geometry'
  verdict: pass
  note: "7 -> 0: the g0 run has no positionJump verdict at all, so the key is absent (matrix.py reads ABSENT); judged by hand from verdicts_by_detector"
- id: LC.GN.honest-reports-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: p2.reports_about_honest
  expect: up
  min_change: 1.0
  source: 'every honest verdict is a misbehaviour report; x10 outliers -> several times the honest reports'
  verdict: wrong-expectation
  note: "2026-10-26: a 12 m single-fix outlier is below legacy-12's position-jump floor and never two in a row (LC.GN.jumps-g10); at 30 m honest reports rise 34 -> 145 (LC.GN.m30-honest-reports) | 2026-10-25: 34 -> 34; see LC.GN.jumps-g10"
- id: LC.GN.honest-reports-g0
  base: S
  variant: scms-g0
  area: gnss-chain
  measure: p2.reports_about_honest
  expect: down
  source: fewer honest glitches -> fewer honest reports
- id: LC.GN.honest-devices-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: p2.honest_reported
  expect: up
  source: more honest vehicles glitch at least once while heard
  verdict: wrong-expectation
  note: "2026-10-26: as LC.GN.honest-reports-g10; 30 m outliers take honest reported devices 17 -> 46 | 2026-10-25: 17 -> 17; see LC.GN.jumps-g10"
- id: LC.GN.ma-load-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: p2.reports_at_ma
  expect: up
  min_change: 0.1
  source: 'the honest reports join the attackers'' at the MA after the RA shuffle: MA load rises'
  verdict: wrong-expectation
  note: "2026-10-26: as LC.GN.honest-reports-g10; 30 m outliers take reports at the MA 393 -> 432 | 2026-10-25: 393 -> 393; see LC.GN.jumps-g10"
- id: LC.GN.fpr-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: m.det_fpr.report
  expect: up
  source: the detector cannot tell a GNSS outlier from a lie; its false-positive rate rises
  verdict: wrong-expectation
  note: "2026-10-26: as LC.GN.honest-reports-g10: no added honest report, so no added false positive | 2026-10-25: identical to 6 digits; see LC.GN.jumps-g10"
- id: LC.GN.precision-g10
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: m.det_precision.report
  expect: down
  source: more honest reports among the same attacker reports
  verdict: wrong-expectation
  note: "2026-10-26: as LC.GN.fpr-g10 | 2026-10-25: identical; see LC.GN.jumps-g10"
- id: LC.GN.dose-g50
  base: scms-g10
  variant: scms-g50
  area: gnss-chain
  measure: p2.reports_about_honest
  expect: up
  min_change: 0.3
  source: 'x5 outlier rate again -> more honest reports, sublinear as per-sender report limits bind'
  verdict: wrong-expectation
  note: "2026-10-26: at 0.5/s two outliers on consecutive messages of one sender (or noise tails over the 12.5 m floor) are rare but not zero: +6 honest reports; the dose that moves reports is the magnitude, not the rate (LC.GN.m30-*) | 2026-10-25: 34 -> 40 (+18 %, under the 30 % predicted): the direction holds, the size does not; see LC.GN.jumps-g10"
- id: LC.GN.g50-honest-revoked
  base: S
  variant: scms-g50
  area: gnss-chain
  measure: p2.revoked_honest
  expect: ge
  value: 1
  source: 'corroborated MA: an event counts with 2 independent reporters, revocation at 3 events inside a minute from >= 3 reporters; 0.5 outliers/s is 30 glitches a minute per vehicle, each heard by tens of verifiers: an honest vehicle crosses that rule (the reason deployed OBUs smooth GNSS before the BSM)'
  verdict: wrong-expectation
  note: "2026-10-26: as LC.GN.dose-g50; even the 30 m run revokes no honest vehicle (corroborated MA) | 2026-10-25: 0 honest revoked at 0.5 outliers/s: outliers barely produce reports (40 honest reports in 180 s), so the corroborated MA's 3-events-a-minute rule is never met; the prediction assumed every outlier is reported"
- id: LC.GN.attackers-unaffected-g0
  base: S
  variant: scms-g0
  area: gnss-chain
  measure: p2.revoked_attackers
  expect: same
  tol: 0.0
  source: 'ConstPos attackers send a frozen position whatever their receiver reads; the MA''s evidence about them does not depend on honest GNSS noise'
- id: LC.GN.cost-g50
  base: S
  variant: scms-g50
  area: gnss-chain
  measure: cost.events
  expect: up
  source: every extra report is an upload, a shuffle entry and an MA event
  verdict: wrong-expectation
  note: "2026-10-26: the outliers add no reports to carry, so the event count does not grow (2,230,023 -> 2,229,836: the draws only) | 2026-10-25: 2,230,023 -> 2,229,836 events (-0.01 %): six more reports cost nothing measurable"
# ---------------------------------------------------------------- chain 6: signal timing -> queues -> density -> J2945/1 -> channel load
- id: LC.SG.speed-c120
  base: sig-base
  variant: sig-c120
  area: signal-chain
  measure: m.mean_speed
  expect: down
  source: 'Webster''s uniform delay d1 = C (1 - g/C)^2 / (2 (1 - x g/C)) is proportional to C at a fixed green share: a 120 s cycle doubles the per-junction delay (Webster 1958; HCM 7th ed. Eq. 19-19)'
- id: LC.SG.speed-c40
  base: sig-base
  variant: sig-c40
  area: signal-chain
  measure: m.mean_speed
  expect: up
  source: shorter cycle -> shorter reds -> less uniform delay (same equation), lost time per cycle aside at this low v/c
- id: LC.SG.speed-c180
  base: sig-c120
  variant: sig-c180
  area: signal-chain
  measure: m.mean_speed
  expect: down
  source: 'the same equation at the edge: 180 s > 120 s'
- id: LC.SG.density-c120
  base: sig-base
  variant: sig-c120
  area: signal-chain
  measure: m.density
  expect: up
  source: 'Little''s law N = lambda T: the same arrivals with a longer travel time keep more vehicles in the network'
- id: LC.SG.rate-c120
  base: sig-base
  variant: sig-c120
  area: signal-chain
  measure: lc.bsms_per_veh_s
  expect: down
  source: 'longer reds pack more vehicles into stop-line queues (Q = lambda r): the count within 100 m crosses J2945/1 B = 25 more often, so its density rule lengthens the ITT'
  verdict: wrong-expectation
  note: "2026-10-26 (938fb16a release): 5.06 -> 5.29 BSM per created node per second. The measure divides frames by nodes created x duration, and the 120 s cycle keeps vehicles on the map longer: 6 of 75 trips complete in 180 s against 12 at 60 s (21 at 40 s), so more vehicle-seconds send. The predicted mechanism cannot act here: CBR is 0.03 (p95 0.10), far under J2945/1's density knee (N < B = 25), as LC.DD.rate-low-density showed. Correction: LC.SG.rate-c120-below-knee"
- id: LC.SG.cbr-peak-c120
  base: sig-base
  variant: sig-c120
  area: signal-chain
  measure: m.cbr.172.p95
  expect: up
  source: 'the node beside a long queue senses more transmitters: the high-percentile CBR rises with the queue (Bazzi 2017; ETSI TS 102 687 CBR per node)'
- id: LC.SG.demand-amplifies
  base: X-sig-demand
  variant: X-sig-demand
  area: signal-chain
  measure: x.value
  expect: band
  band: [1.0e-06, 1.0e+03]
  source: 'Webster: the delay a longer cycle adds grows with the degree of saturation x (the 1/(1 - x g/C) factor and the overflow term), so the speed lost to 120 s is larger at 3,000 veh/h'
  measured: "-0.267942"
  verdict: open
  judged: "2026-10-27, f4982788 release (all four sig runs)"
  note: 'Mean speed: base 6.39, c120 3.95, r3000 5.89, c120-r3000 3.71 m/s (base and c120 equal the 938fb16a runs). The 120 s cycle costs 2.44 m/s at 1,500 veh/h and 2.18 at 3,000; as a share, 38.2 % and 36.9 %. Not traced to a defect: the network-mean density is 1.4 to 2.7 veh/km, so the approaches are likely far from saturation, where Webster''s 1/(1 - x g/C) factor changes the uniform delay by under ~10 % for x 0.15 -> 0.3, and the 180 s window holds 1.5 cycles of 120 s. Owed: per-approach volume against saturation flow (x) from a recorded run, then either a saturated-demand variant or a corrected row.'
- id: LC.SG.cost-r3000
  base: sig-base
  variant: sig-r3000
  area: signal-chain
  measure: cost.events
  expect: up
  min_change: 0.5
  source: 'twice the vehicles, receptions ~ N^2 within range: events more than 1.5x'

  verdict: wrong-expectation
  note: "74.8 -> 78.4 ms (+5 %). The prediction counted the profile's 2 cores; at nodes.compute_tier medium (the default) the CPU is ONE server (v2xw-node server.rs ServerBank, 06-node-models 2.1: medium = one CPU and one HSM server, high = c cores). With one 1.34 ms server rho = 720/s x 1.34 ms = 0.96 with J2945/1 and 897/s x 1.34 ms = 1.2 without: both at or over capacity, so the verify throughput pins at ~636/s per node in both runs and the queue grows the same over 6 s. Congestion control cannot rescue an OBU already saturated by its neighbours"

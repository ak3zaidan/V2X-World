# chain 5 corrected (the evidence for LC.GN.jumps-g10's note): legacy-12's position-jump
# score is disp / (avg_v dt + z tol + c) with z = 3, tol >= max(conf, 0.5 c) = 2.5 m and
# c = 5 m (v2xw-threat detect.rs `motion`), so a 12 m jump scores at most
# (v dt + 12) / (v dt + 12.5) < 1 whatever the speed; and a detector fires only after
# min_consecutive = 2 flagged messages from one signer, which a single-fix outlier
# (the next message is clean) does not give. A 30 m outlier scores > 1 on slow vehicles
# (and position-speed inconsistency (|disp - v dt| - jerk) / (3 tol) > 1 up to ~10 m/s),
# and a pair forms when the outlier stays the 1.5 s lagged reference for two messages:
# a lost next message at the receiver, or interval jitter.
- id: LC.GN.jumps-g10-bounded
  base: S
  variant: scms-g10
  area: gnss-chain
  measure: p2.verdicts.positionJump
  expect: same
  tol: 0.15
  source: 'correction of LC.GN.jumps-g10 (judged on its runs): a 12 m single-fix outlier cannot score 1 on legacy-12''s position-jump check (bound above) and is never two in a row'
- id: LC.GN.m30-jumps
  base: scms-g10-rel
  variant: scms-g10-m30
  area: gnss-chain
  measure: p2.verdicts.positionJump
  expect: up
  min_change: 0.5
  source: 'a 30 m outlier scores > 1 for v < ~6 m/s (30 / (1.5 v + 21) with conf ~5.4 m), and every receiver that misses the message after it (or whose next message lands < 1.5 s after the post-outlier one) sees it twice as the lagged reference: ~1,760 outliers x ~20 receivers x a few % gives hundreds of flagged pairs'
- id: LC.GN.m30-honest-reports

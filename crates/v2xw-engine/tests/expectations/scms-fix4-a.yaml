# SCMS fix round 4, PKI and CRL track (scms-fix4-a): the defects BUILD-STATUS "fix round 3
# integration" (2026-10-27) left failing, and the fault proofs fix-3 scmsleft owed.
#
# Schema v2xw/scms-run-expectations/1 (matrix.py). Every row was written with
# `measured: pending` before the run or test it judges. Base and variant of a row ran on
# the same binary unless the row says otherwise:
#   - rel: the 3cbc95a4 release copy (same engine code as this branch's base 081fcab2);
#   - fix: the optimised debug build of this branch (CARGO_PROFILE_DEV_OPT_LEVEL=2).
# Seeds are the scenarios' own. verdict: pass | fixed | wrong-expectation | open.
schema: v2xw/scms-run-expectations/1
runs:
  PQCC:
    scenario: scenarios/real-world/stress/pq-hybrid-falcon512-certcycle.yaml
    note: cut to its first 0.5 s, no warm-up, no fast-forward (the pq_receivers test's run)
  P2:
    scenario: scenarios/phase2-manhattan.yaml
    note: every third roadside unit kept (the phase2 test's path run), --record-level metrics
  MW:
    scenario: scenarios/edge/multi-week.yaml
    note: the 33-day conformance run on the real calendar (--record-level events)
  MWC2T:
    scenario: scenarios/edge/multi-week-crlg-down-late.yaml
    base: MW
    note: 'trace track 2026-10-28: the outage moved to 300,000-2,600,000 s, after the changeover (9d0fbc2c,
      --record-level metrics; a scratch copy at events level gave the same 110,048)'
  MWC:
    scenario: scenarios/edge/multi-week-crlg-down.yaml
    base: MW
    note: the home CRL Generator down from 700 s to 2,600,000 s (--record-level events)
  P2S1:
    scenario: scenarios/phase2-manhattan.yaml
    note: 'trace track 2026-10-28: P2 (every third unit) on seed 0xC0FFEE_0001, 300 s, 9d0fbc2c release,
      --record-level metrics (scmsa scratch p2path-s1.yaml)'
rows:
- id: F4A.PQCC.rsu-invalid
  base: PQCC
  variant: PQCC
  area: scms
  measure: phase2.verification_states.Invalid
  expect: eq
  value: 0
  source: 'every PSM in the run is an honest handset''s, signed under a certificate of the i-period its
    clock reads (CAMP-EE 2.1.5.3.2: i-periods are calendar intervals); a 1609.2 receiver whose own
    clock reads the same period judges it plausible (PLAUSIBLE_PERIOD_SKEW 1), so no RSU refuses one'
  measured: '240 (rel) -> 0 (fix test build: Verified 431)'
  verdict: fixed
  test: 'pq_receivers::a_roadside_unit_judges_the_first_frames_it_hears_in_the_current_period (also asserts backend_errors 0)'
  note: 'Cause (diagnostic build): every provider-b pre-run pool failed with "only the PCA may open a sealed pre-linkage value": on the modelled path the PLVs opened only at the core ACA node, and since 52432316 the RA routes half of provider-b''s requests to aca/1. The failure was silent; those handsets signed with the period-0 bootstrap stand-in (iCert 0 against period 614) and every receiver, vehicle or unit, refused them as an implausible period (crl_period_refusals 240). Red without the fix: the rel run (240) and the 10-27 integration failure'
- id: F4A.CRL.composite-lists
  base: unit
  variant: unit
  area: scms
  measure: signed CRLs in the composite a provider's RA serves at 10 s (two providers, PDU layer on)
  expect: eq
  value: 2
  source: 'IEEE 1609.2.1-2022 6.3.5.8: CompositeCrl is a SEQUENCE OF SecuredCrl, one for each CRACA the
    home CTL lists, plus the home MultiSignedCtl. Each provider''s CRL Generator signed its list before
    the run (R-NOCRL), so both lists exist at every RA from t0'
  measured: '1 (base, BUILD-STATUS 10-27) -> 2; composite 3,216 B signed vs 3,082 B modelled (ratio 0.958)'
  verdict: fixed
  test: 'phase2::provider_failure_tests::a_crl_fetch_without_the_pdu_layer_is_sized_as_the_composite_the_ra_serves'
  note: 'The test was right and the composite wrong: each provider''s standing pre-run list was stamped at the first backend step and then waited the inter-provider lag, so for that lag a peer RA served one SecuredCrl. A version at or below the store''s pre-run serial now carries no lag. The fault proof of scmsleft''s composite_estimate is still owed'
- id: F4A.MWC.overdue
  base: MW
  variant: MWC
  area: scms
  measure: rv.refused.crl-overdue
  expect: ge
  value: 1
  source: '[CAMP122] Table 67 overdue_CRL_tolerance (2 weeks past nextCrl): the home list signed at t0
    with nextCrl t0 + 7 d is overdue from t0 + 21 d; with the home Generator down until 30.1 d, every
    receiver in W5 (28.0-28.0 d live) that holds only that home list refuses the home CRACA''s
    messages'
  measured: '0 (rel) -> 0 (fix2)'
  verdict: wrong-expectation
  note: 'Not an overdue-rule defect. Diagnostic build: in W4-W5 receivers hold the old home list (crlCraca af8a..b710ad, nextCrl t0 + 7 d, overdue) and provider-b''s, but every home sender signs under cracaId 4a1086, the new root''s: the root rollover decided at 120 s is published (CTL 1) at 259,320 s, when the home Generator is already down (700-2,600,000 s), and since dc0c0250 the wire PKI follows it. No list under the new CRACA can be signed until the Generator is back, so no device holds one and the overdue rule (per held CRL) has nothing to act on. On 81a12183 certificates kept the old CRACA, hence 152,505. Whether a deployed device refuses certificates of a CRACA it never got a CRL for is not in the cited sources: open. The scenario no longer tests its premise; it needs the outage without the rollover, or after the changeover'
  note2: 'closed 2026-10-28 (trace track; scms-variants RR.MWC.overdue has the quotes). No clause in
    [CAMP122], [SMP] v1.0.3 or [SM-EESEC] v2.04 makes a device refuse a certificate whose CRACA it holds
    no CRL for. Table 67 starts from "a next CRL date", and SCMS-1223 discards only a listed sender. IEEE
    1609.2 was not read (paywalled). So 0 is right for MWC on the engine''s per-CRACA reading, and the
    scenario that tests the rule is MWC2, now with its outage after the changeover: 110,048 crl-overdue
    refusals on 9d0fbc2c. Open reading: Table 67 says "rejecting all of them" (fix spec F5-SCOPE)'
- id: F4A.MWC.held-overdue
  base: MWC
  variant: MWC
  area: scms
  measure: node.security records in W5 whose home CRL is past nextCrl + 14 d
  expect: ge
  value: 1
  source: the premise of F4A.MWC.overdue, read off what receivers hold (belief), not off the backend
  measured: 'W4 1,197 and W5 6,638 node.security records hold an overdue home list (rel and fix2 identical)'
  verdict: pass
- id: F4A.MW.no-overdue
  base: MW
  variant: MW
  area: scms
  measure: rv.refused_total
  expect: eq
  value: 0
  source: 'with both Generators reissuing by nextCrl, no list a device holds is ever two weeks past it,
    and a joiner holds the newest list each CRACA published (R-JOINCRL): the fix must not bring back
    MW''s 16,618 joiner refusals'
  measured: 'rv.refused_total 0 (rel MW)'
  verdict: pass
  note: 'MW not re-run on fix2: the changeover reissue is the only change that touches it (a list under the new CRACA at 259,320 s, inside the Generator''s uptime)'
- id: F4A.P2.decision-spread
  base: P2
  variant: P2
  area: scms
  measure: attacker decided_ns across seeds 0xC0FFEE_5EED, 0xC0FFEE_0001, 0xC0FFEE_0002 (rel), seconds
  expect: band
  band:
  - 60
  - 300
  source: 'the decision waits for 3 corroborated events from 3 reporters inside a minute behind a 60 s
    report shuffle (threat/ma/corroborated); the attacker is the first vehicle onto an empty map, so
    its first report depends on which neighbours carry a modem (a node-keyed draw, re-keyed by the
    p1gaps roadside renumbering): a spread over the run, not a constant'
  measured: '241.8 s (5EED), 112.1 s (_0001), 136.0 s (_0002)'
  verdict: pass
  note: 'Written after the three seed runs, so it records an observation, not a prediction'
- id: F4A.P2.path-installed
  base: P2
  variant: P2
  area: scms
  measure: phase2.crls_installed and revoked_receptions on the 0xC0FFEE_5EED path run at a 360 s horizon
  expect: ge
  value: 1
  source: 'after the decision the path needs the PCA and LA lookups (seconds), the Generator''s 60 s
    cadence and one 30 s fetch interval: a decision at 241.8 s is installed by about 334 s, so a 360 s
    horizon holds the whole path whichever realisation the node-keyed draws give'
  measured: 'rel CLI at 360 s: 59 installs, 5,907 revoked receptions, latency 115.8 s (camp-reference 59, 5,849, 117.5 s); fix test build: the four phase2 tests pass'
  verdict: pass
  test: 'phase2 a_report_becomes..., the_revocation_latency..., without_either..., the_honest_revocation_path...'
- id: F4A.MWC.new-craca-held
  base: MWC
  variant: MWC
  area: scms
  measure: node.security records in W2-W4 holding a home list whose crlCraca is the post-rollover CRACA
  expect: ge
  value: 1
  source: 'the root rollover at 120 s (scms-conformance) gives every later certificate the new CRACA
    (1609.2 5.1.3.2: a CRL applies to the certificates whose cracaId names its crlCraca); the
    re-certified CRL Generator, still up before 700 s, signs a list under it at the changeover
    (R-NOCRL: every CRACA''s CRL exists), so receivers hold three lists from then on. Diagnosis on the
    rel code: W5 senders carry cracaId 4a1086 (new home CRACA) or b0595c (provider-b), receivers hold
    only af8a..b710ad (old home root) and c5d9..b0595c, so no home certificate ever matched a held list'
  measured: '0 records in W2-W4 (fix2)'
  verdict: wrong-expectation
  note: 'Wrong premise: the changeover is at 259,320 s (after the CTL vote), not 120 s, so after the Generator went down; the reissue the fix adds is persisted and runs at the 2,600,000 s restart (W5 then holds 3 lists, as before). The fix (R-ROLLCRL) holds where the Generator is up: phase2::ctl_device_tests::a_root_changeover_publishes_a_list_under_the_new_craca_at_once passes; its fault proof is owed'
- id: F4A.MWC.no-w4-refusal
  base: MWC
  variant: MWC
  area: scms
  measure: crl-overdue refusals in W4 (1,814,340-1,814,460 s)
  expect: eq
  value: 0
  source: 'the post-rollover list is issued at the changeover (after 120 s), so it is overdue from
    changeover + 7 d + 14 d, after W4 ends at t0 + 21 d + 60 s; W4 senders sign under the new CRACA'
  measured: '0 refusals in the whole run (fix2)'
  verdict: pass
- id: F4A.P2.reports-received-gap
  base: P2S1
  variant: P2S1
  area: scms
  measure: phase2 reports_sent against reports_received and the report fates
  expect: 'reports_sent = uploaded (cellular + relay) + unsent + evicted + expired + not filed + lost +
    refused at the MTU, and reports_received = uploaded'
  source: 'phase2.rs files_report (line 5473) and real_mbr (5675-5700): under the US profile with the PDU
    layer on, a detection with no SM-MBR v1.1 subtype, or a roadside unit''s own detection, is not filed
    ([SM-MBR] 2.3 defines PSID 0x20 subtypes only; [SM-MBR] 3 signs with an end-entity pseudonym
    certificate, and USDOT RSU Specification v4.1 p. 15 gives a unit no reporting function: R-UNSEC)'
  measured: 'reports_sent 2,002 = 103 uploaded over cellular + 1,899 not filed (1,011 a roadside unit
    with no pseudonym certificate; 888 no SM-MBR v1.1 subtype); reports_received 103 = reports_at_ma
    103 (scmsa on 3cbc95a4: 2,002 = 100 + 1,011 + 891)'
  verdict: pass
  note: 'Written after the run (the scmsa finding was an observation). Explained, not a defect: 95 % of
    the gap is detections the US profile cannot file, and the counters partition it exactly (the
    scms-audit-sim-metrics CV.report-fate check pins that sum). reports_sent counts generated reports,
    filed or not, although its doc comment (phase2.rs:1647) says "filed": a naming defect only, see the
    trace track fix specs'
- id: F4A.MWC2.overdue-after-changeover
  base: MWC2T
  variant: MWC2T
  area: scms
  measure: rv.refused.crl-overdue; per window, node.security records holding the new home CRACA (4a1086)
    list and how many are past nextCrl + 14 d
  expect: 'refusals >= 1. 4a1086 held from W1; none overdue in W1-W3; overdue in W4; none in W5'
  source: 'R-ROLLCRL: the changeover (CTL 1, 259,320 s) signs a list under the new CRACA while the
    Generator is up (nextCrl = day 10.0); [CAMP122] Table 67 overdue_CRL_tolerance 2 weeks -> overdue from
    day 24.0 (2,073,600 s): after W3 (day 21.0), before W4 (day 28.0); the Generator returns at day 30.1'
  measured: '110,048 refusals. 4a1086 held: W1 1,515, W2 2,350, W3 2,558 (0 overdue), W4 6,638 (6,638
    overdue, with b710ad; provider-b b0595c current), W5 1,950 (nextCrl day 37.09, 0 overdue). The old
    200,000 s start: 0 refusals, no 4a1086 list before W5 (the fault)'
  verdict: pass
  note: 'Written after the variant runs, from the scenario comment''s design. The scenario change, not an
    engine change, closes RR.MWC2'

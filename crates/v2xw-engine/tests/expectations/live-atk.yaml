# Live attack-and-detection tests (docs/validation/live-atk-2026-10-25.md): every attack
# family at two to three attacker shares and strengths, under each selectable detector suite
# and MA rule, on the real engine (the integrator's release build of 486c8cba, copied to the
# scratchpad). Every row was written and committed with `measured: pending` before the run
# it judges. Each row names the raw-input `fault` (a mutation of the run report or records,
# applied before the measures are derived) that the checker's `selftest` injects to show the
# row can go red.
#
#   python3 -I tools/realworld/live_atk.py extract <run-dir> <cost-file>
#   python3 -I tools/realworld/live_atk.py check <this file> <runs-dir> [--fill]
#   python3 -I tools/realworld/live_atk.py selftest <this file> <runs-dir>
#
# expect: eq | le | ge | band (the variant's value); up | down | same | ratio | delta |
# identical (variant against base). verdict: pass | fixed (engine defect fixed at its cause;
# `test` pins it) | wrong-expectation (corrected with the evidence in `note`) | open.
#
# Runs: scenarios/live-atk/*.yaml, the SCMS lifecycle family (credential-lifecycle.yaml:
# compressed calendar, CRL every 30 s, MA review 0 s) held at 40 vehicles for 150 s, seed
# 0xC0FFEE_5EED, --record-level events, --build-utc 2026-10-25T00:00:00Z, one run per
# run-lock call (1,200 MB cap). Suites: L = detect/legacy-12 filing what SM-MBR v1.1 can
# encode (the default), M = the same with `modelled_reports: 1`, U = detect/us-sm-mbr.
# MA: threat/ma/corroborated (default) or threat/ma/legacy-window.
schema: v2xw/scms-run-expectations/1
runs:
  B0L: {scenario: scenarios/live-atk/base.yaml, note: attack-free, L suite}

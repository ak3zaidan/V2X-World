# ---- 9. 2026-10-26: F4, F5 fixes and the F6 model (written before their runs) -----------
# F4 fix: an ExpiredCert / NotYetValid attacker signs under a genuine certificate used out
# of its validity, so its signature verifies; the receiver refuses the BSM by the IEEE
# 1609.2 §5.2 generation-time-in-validity rule and the research suite reads that as
# certValidity (the legacy model: signature valid, certificate out of window).
- id: F4.B0L.untouched
  base: B0L
  variant: B0Lf

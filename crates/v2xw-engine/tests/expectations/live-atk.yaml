  verdict: pending
  source: 'the corroborated MA needs 3 events, each from 2 trusted reporters, inside 60 s (ma_corroborate defaults; F2MD DELTA_REPORT_TIME); honest GNSS noise does not sustain that (QD and FB3: 0 honest revoked, 06 §6 item 1)'

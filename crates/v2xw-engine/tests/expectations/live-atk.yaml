  note: '2026-10-27: the digests differ, but 938fb16a..f4982788 holds more engine changes than F4 (adoption WP-04 to WP-09 and the four-round integration), so the difference cannot be put on F4. Owed: B0L on a build of 3ae7d414^ against B0Lf on 3ae7d414 (one-commit pair).'
  source: 'the fix changes only frames under an out-of-window certificate and RandomSpeed/StopAndGo at k != 1; an attack-free run is byte-identical'

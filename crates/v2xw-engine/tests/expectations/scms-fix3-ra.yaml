  area: metrics
  measure: topup mean, ms; cert_unavailable_ns
  expect: 'GSB < FSB on both: provider-b sends half its requests to the healthy aca/1, so its jobs under the slow core ACA finish sooner (the slow server carries half the work); provider-a untouched'
  source: queueing (work at the slow server halved); audit-prov §4.1. (An unqualified `pca` fault is provider-a's ACA, crypto_config::failure_target, so slow-aca.yaml cannot show it.)
  measured: 'FSB 337.1 ms (59 top-ups) = F 337.1 ms, cert_unavailable 0 in both; measured before the third build'
  verdict: wrong-expectation
  note: 'on the 3-year horizon every top-off in the run is of a held week (.info + download, RA only): no device request reaches an ACA, so a slow ACA moves no device metric with one ACA or two. Corrected by D1.slow-aca-h2, where the weeks are in-run jobs'
- id: D1.slow-aca-h2
  base: FSBH
  variant: GSBH
  area: metrics
  measure: topup mean, ms; cert_unavailable_ns
  expect: 'GSBH < FSBH on both: provider-b (32 of 72 devices) sends half of each in-run job to the healthy aca/1, so its weeks are ready sooner; provider-a untouched. Upper bound on the drop: provider-b''s share of the slow-ACA excess (FH - F on one ACA, 14,886 - 337 ms, times 32/72, halved): about 3.2 s. Confounded: GSBH also starts each week at its boundary unasked (RA.boundary-job), which can only make it earlier'
  source: queueing (the slow server carries half the work); audit-prov §4.1; written before FSBH and GSBH ran
  measured: 'topup FSBH 18,544.7 ms (58 of 121 completed) against GSBH 5,244.7 ms (42 of 105); cert_unavailable 0 in both. Control on the same two binaries with provider-a''s ACA slow (h2.yaml): FH 14,886 ms (34 of 103) against GH 14,338 ms (34 of 103), so the boundary job alone moves the mean by -548 ms and no completions'
  verdict: open
  note: 'the direction holds (-13.3 s) and the boundary job is not the cause (GH = FH in completions, -0.5 s). The size bound was wrong: FSBH''s excess is all provider-b''s, not 32/72 of FH''s. Open: GSBH starts 16 fewer top-ups and completes 16 fewer (58 -> 42) with no device starved, which halving the slow server''s work does not explain; per-provider top-up counts are not in the report, so it needs a recorded run'
  note2: 'judged 2026-10-27, open; the direction claimed in the note above is withdrawn. Merged tree (3cbc95a4 release, GSBH again): topup 3,658.0 ms (42 completed, max 56,352), cert_unavailable 0, starved 0; GSB (3-year horizon) equals F to the digit (337.3 ms, 59 of 121). A recorded GSBH (events level, pki.flow, scratch topups.py/acaq.py) gives the cause. Provider-a: 36 of 36 top-ups installed, mean 0.32 s. Provider-b: 23 asked (4 at 60 s, 19 at 120 s) and 6 installed (mean 23.6 s, max 56.3 s); 17 were still waiting when the run ended. At the 120 s boundary the weekly job (provision.rs:164 arm_boundary_jobs) sends every provider-b account''s week to the ACAs in turn (run/mod.rs:523 round-robin): 88 requests to the 4 s slow aca/0 and 87 to aca/1. That queue lasts past the 180 s horizon, and the top-ups asked at 120 s wait for it. So the lower mean is censoring, the same as RA.download-wait-boundary, and not the halving the row expects. Not judgeable as written: it needs a measure that counts unfinished top-ups, and the one-ACA base cannot be re-made on one binary (failure_target, crypto_config.rs:181-198, names no ACA instance). Whether a real RA puts a requested week ahead of its weekly job is not published'

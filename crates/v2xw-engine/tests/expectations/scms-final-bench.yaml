# SCMS final runs, part 1: the full-scale benchmark and the hybrid post-quantum runs
# (docs/design/scms-real/testing/final-bench.md). Every `expect` was written down and
# committed with `measured: pending` before its run. `measured` is base -> variant, or the
# one run's value for an invariant row. Not a sweep table: `v2xw sensitivity` passes over it
# by its `schema` (sweep::SCMS_RUN_EXPECTATIONS_SCHEMA).
#
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
schema: v2xw/scms-run-expectations/1

runs:
  QD:
    scenario: docs/benchmark/scms-real-benchmark.md
    note: >-
      The quarter-fleet benchmark numbers already published (R-Q, release binary of 3a30f2c,
      before the PSM/MBR, R-USFP, R-NOCRL and R-TRUSTLEAK fixes). Used only where nothing
      in between changes the quantity (traffic, provisioning, CAMP per-device counts).
  FB:
    scenario: scenarios/real-world/midtown-scms-benchmark.yaml
    note: >-
      The full-fleet benchmark end to end (172,800 s: 240 s live, fast-forward, 60 s live
      across the 614 -> 615 rollover, fast-forward), opt-level-2 debug build of main
      88e24b09, --record-level metrics, seed 0xBE7C_0001, run lock, 2 rayon threads.
  PQ0:
    scenario: scenarios/real-world/stress/pq-base.yaml
    note: "quarter fleet, 60 s live, generic-sdu fragmenter, software-crypto OBU, ECDSA P-256; on 88e24b09 it is also the current-code quarter-density comparison point for FB"
  PQHM: {scenario: scenarios/real-world/stress/pq-hybrid-mldsa44.yaml, base: PQ0, note: "4 rayon threads"}
  PQHM1: {base: PQHM, set: {}, note: "PQHM at 1 rayon thread (determinism)"}
  PQHMC: {scenario: scenarios/real-world/stress/pq-hybrid-mldsa44-certcycle.yaml, base: PQHM}

rows:
# ---------------------------------------------------------------- (1) full-scale benchmark
- id: FB.devices
  base: QD
  variant: FB
  area: architecture
  measure: devices_by_provider (sum and split), handsets
  expect: >-
    about 550 handsets (2,200 VRUs x 0.25) and 1,250-1,450 vehicles (900 in the 4x fill,
    2.5/s for the other 150 live s, plus the rollover window's arrivals): 1,800-2,100
    devices, 4x-6x the quarter's 349 (the quarter publication had 60 s live); provider
    split within 45/55
  source: scenario file; D1 fleet split ASSUMPTION
  measured: pending
- id: FB.provisioning
  base: FB
  variant: FB
  area: architecture
  measure: provisioning requests per device; certificates at entry
  expect: 1 request per device; 40 certificates each (2 weeks x 20); total about 40 x devices
  source: "[CAMP122] Table 67 certs_per_i_period 20; ra-maxReqs 1 (04 §4.1)"
  measured: pending
- id: FB.provisioning-burst
  base: FB
  variant: FB
  area: architecture
  measure: provisioning requests per second at the RAs in the first 90 s
  expect: >-
    10-25 requests/s (devices entering during the 4x fill), 20-50x CAMP's 0.5 requests/s
    design rate for 17 M vehicles a year: a scenario start is a burst no real RA sees
  source: "04 §4.1 (CAMP122 §6.3.3.4)"
  measured: pending
- id: FB.topups-at-rollover
  base: FB
  variant: FB
  area: architecture
  measure: topups started/completed, certificates topped up, refusals, starved
  expect: >-
    one top-up per powered, reachable device at the 614 -> 615 boundary (43,200 s), 20
    certificates each, completed inside the 1 h overlap; 0 refused (no honest revocation);
    0 starved
  source: "CAMP-EE R1.1 §2.1.5.3.2 (1 h overlap); NYC weekly top-off; 04 §4.1"
  measured: pending
- id: FB.receptions-scale
  base: PQ0
  variant: FB
  area: performance
  measure: reception attempts per live second
  expect: 8x-16x the quarter-density figure (pairs grow with the square of the fleet; the 500 m cap holds it under 16x)
  source: F3 15x for 4x vehicles (05 §5)
  measured: pending
- id: FB.cbr
  base: PQ0
  variant: FB
  area: metrics
  measure: CBR mean / p95, ch 172
  expect: >-
    3x-5x the quarter density's (BSM+PSM load scales with the fleet), mean 0.05-0.12,
    still under J2945/1 vMinCU 0.5, so no power adaptation
  source: SAE J2945/1 (CAMP, IEEE TVT 68(3) 2019, Table I)
  measured: pending
- id: FB.pdr-100m
  base: PQ0
  variant: FB
  area: metrics
  measure: PDR within 100 m (or the 80-100 m bin)
  expect: at or below the quarter density's (more collisions and hidden terminals); within 100 m above 0.6
  source: radio-fidelity B1 NLOS 0.67 at 0-100 m; benchmark §3
  measured: pending
- id: FB.latency
  base: QD
  variant: FB
  area: metrics
  measure: BSM end-to-end latency mean / p95
  expect: "mean 12-15 ms: the fixed 9 ms CRATON2 sign plus ~3 ms; MAC access rises a little with load; p95 far under the 100 ms budget"
  source: J2945/1 / FMVSS 150 NPRM 100 ms budget; benchmark §3 (12.2 ms)
  measured: pending
- id: FB.verify-load
  base: QD
  variant: FB
  area: performance
  measure: verifications per node per second; verify queue p99; first-sight share
  expect: 3x-5x the quarter's ~30 per node per second (100-150), well under CRATON2's >2,500/s; queue p99 under 1 ms; first-sight share near 1 %
  source: Unex OBU-301E sheet
  measured: pending
- id: FB.mbr-airtime
  base: QD
  variant: FB
  area: metrics
  measure: MBR share of airtime
  expect: under 1 % (honest traffic; R-USFP fixed; reports go over Uu or to an RSU)
  source: testing/usfp.md; validation/vehicle-and-roadside.md §4
  measured: pending
- id: FB.honest-revoked
  base: FB
  variant: FB
  area: architecture
  measure: reports sent, MA cases, revoke decisions, honest devices revoked
  expect: >-
    honest traffic only: a few reports at most (residual GNSS outliers), 0 revoke
    decisions, 0 devices revoked; the false-positive rate per device-hour is the benchmark
    headline an attack study compares against
  source: testing/usfp.md (realism base 26 -> 0 honest revoked)
  measured: pending
- id: FB.crl
  base: FB
  variant: FB
  area: architecture
  measure: CRLs published, entries, downloads, overdue refusals
  expect: >-
    each provider's CRACA publishes at t0 (R-NOCRL fix) with 0 entries; devices join
    holding it; at least one weekly reissue in the 2 days only if a reissue falls inside;
    downloads on 1-business-day polls; 0 crl-overdue refusals
  source: testing/stress.md R-NOCRL; 03 §9 (SCMS Manager CRL SLA)
  measured: pending
- id: FB.trust
  base: FB
  variant: FB
  area: architecture
  measure: receiver refusals by cause
  expect: 0 psid-not-permitted, 0 off-ctl, 0 crl-overdue; refusals only for real reasons (none expected on honest traffic)
  source: testing/stress.md; BUILD-STATUS 2026-10-22 TRUST
  measured: pending
- id: FB.privacy
  base: QD
  variant: FB
  area: metrics
  measure: observer link claims / correct; linkability
  expect: >-
    4x the frames read; pseudonym changes concentrated at the rollover; linkability at or
    below the quarter's (a larger anonymity set at a simultaneous change); correct links
    near 0
  source: Wiedersheim et al. 2010; benchmark §6
  measured: pending
- id: FB.traffic-speed
  base: QD
  variant: FB
  area: metrics
  measure: mean vehicle speed, live window
  expect: below the quarter's 4.12 m/s and nearer Midtown's ~5 mph (2.2 m/s); 2-4 m/s
  source: NYC DOT Mobility Report 2018/2019
  measured: pending
- id: FB.ff-ticks
  base: FB
  variant: FB
  area: performance
  measure: backend ticks over the fast-forward windows
  expect: "D2: at most one stop a minute when nothing is due: about 2 x 1,440 idle stops plus due events; under 5 x 10^4 (the 1.1 M ticks of benchmark §9.2 are gone: MW measured 54,511 for 33 days)"
  source: D2 design; testing/stress.md MW.cost
  measured: pending
- id: FB.cost
  base: FB
  variant: FB
  area: performance
  measure: wall time, CPU time, peak footprint, events
  expect: >-
    1.5-4 CPU-hours (stress §1 model: 24-39 CPU-s per live second for 300 live s, plus
    ~0.4 CPU-s per device for real-P-256 provisioning; the later cache fix may cut it);
    peak footprint 0.8-2.0 GB, under the 2.5 GB cap; the fast-forward part a small share
  source: testing/stress.md §1; benchmark §7
  measured: pending
# ---------------------------------------------------------------- (2) post-quantum, quarter density
- id: PQHM.sizes
  base: PQ0
  variant: PQHM
  area: metrics
  measure: frames per BSM; PSDU mean
  expect: >-
    hybrid ML-DSA-44 + ECDSA: a digest-signed BSM is ~2.7 kB (2,420 B ML-DSA sig + 64 B
    ECDSA + payload), a full-certificate one ~4.1 kB (+1,312 B key): 2.3-2.7 frames per
    BSM, at or slightly above pure ML-DSA-44's 2.30
  source: FIPS 204 Table 2 (pk 1,312 B, sig 2,420 B); stress.md PQ.sizes
  measured: pending
- id: PQHM.airtime
  base: PQ0
  variant: PQHM
  area: metrics
  measure: BSM airtime; CBR mean / p95
  expect: BSM airtime x12-15; CBR mean 0.13-0.17 (pure ML-DSA-44 gave x12.6 and 0.142)
  source: stress.md PQ.airtime
  measured: pending
- id: PQHM.loss
  base: PQ0
  variant: PQHM
  area: metrics
  measure: verified BSMs; reassembly completed vs lost
  expect: verified BSMs down 30-40 % (message PDR is about the per-fragment PDR to the power k)
  source: stress.md PQ.loss (-33 % for pure ML-DSA-44)
  measured: pending
- id: PQHM.verify-load
  base: PQ0
  variant: PQHM
  area: performance
  measure: verify cost mean per message
  expect: "both signatures verified: about ECDSA + ML-DSA-44 (0.63 + 0.43 ms), 0.9-1.2 ms, above ECDSA and above hybrid Falcon's 0.751"
  source: stress.md PQ.verify-load, PQ.hybrid
  measured: pending
- id: PQHM.reports
  base: PQ0
  variant: PQHM
  area: architecture
  measure: over-the-air reports refused at the MTU vs counted uploaded
  expect: >-
    under generic-sdu the over-MTU report SPDUs are fragmented, so 0 net_mtu_refusals for
    reports; no refused report counted as uploaded (R-PQMBR fix)
  source: BUILD-STATUS 2026-10-22 REPORTS; stress.md PQ.mbr-mtu
  measured: pending
- id: PQHM.determinism
  base: PQHM
  variant: PQHM1
  area: performance
  measure: recording content digest at 4 vs 1 rayon threads
  expect: identical
  source: engine determinism contract; stress.md MW.determinism
  measured: pending
- id: PQHMC.sizes
  base: PQHM
  variant: PQHMC
  area: metrics
  measure: frames per BSM; PSDU; BSM airtime; CBR
  expect: >-
    BSMs keep ECDSA: the hybrid certificate 30 + 162 + 2,420 = 2,612 B does not fit the
    2,304 B DSRC cap beside a 204 B frame, so alpha = 2 of each 5-SPDU cycle carry ~1.3 kB
    extra; mean PSDU ~0.7 kB; about 1 frame per BSM (fragments ride in the SPDU); BSM
    airtime x3-5 the classical base, far below PQHM; CBR 0.04-0.08
  source: NDSS 2024 (Twardokus et al.) §IV, §V-D; cert_cycle.rs alpha rule
  measured: pending
- id: PQHMC.verify-load
  base: PQHM
  variant: PQHMC
  area: performance
  measure: verify cost mean; verified BSMs
  expect: "ECDSA verification per BSM (~0.63 ms) plus one ML-DSA-44 verify per new certificate; verified BSMs near the classical base (within 10 %)"
  source: NDSS 2024 §III
  measured: pending

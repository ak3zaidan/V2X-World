  source: 'a pair judged under a smaller gap limit is judged under every larger one (the same receptions),
    so the count cannot fall as the limit grows; Tampa free 17.9 / 19.7 / 20.4 per ID-minute at 0.1 /
    0.2 / 0.5 s (T3): the single-interval pairs carry most triggers'
  measured: 4722 -> 2164 (ratio 0.4583)
  verdict: wrong-expectation
  note: 'counts, not rates: tools/realdata''s T3 is triggers per judged ID-minute from OBU/RSU logs that
    lose almost nothing, while an engine receiver loses BSMs and so forms many dt ~ 0.2 s pairs; the v1.1
    cells, which judge only pairs 0.1 s apart, are flat (2,181 at 0.1 s, 2,188 at 0.2 s), so the single-interval
    triggers are unchanged and the rest are the loss pairs. Also: the engine judges dt <= max_gap_s exactly,
    while realdata''s ''<= 0.1 s'' cell is dt < 0.15 s (judged(), GAP_TOL 0.05); under generationTime
    jitter half the single-interval pairs exceed 0.100 s. The engine reproduces a realdata cell L at max_gap_s
    = L + 0.05. Corrected expectation: the subset property only, ratio <= 1'

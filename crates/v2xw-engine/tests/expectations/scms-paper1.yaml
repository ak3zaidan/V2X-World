rows:
- id: P1.TS.rp-share0
  base: B
  variant: S0
  area: metrics
  measure: p2.verdicts.positionJump
  expect: ratio
  band:
  - 1.1
  - 1.8
  source: 'free-class triggers scale with the free share: (1-0)/(1-0.25) = 1.33; free 24.1 vs locked 0.17
    per ID-minute (us_mbr_timing), research/synthesis/p1-realdata-baseline.md T2/T3 (Tampa free 20.4,
    locked 0.2 per ID-minute; Wyoming locked 0.0)'
  measured: 5097 -> 7233 (ratio 1.419)
  verdict: pass
- id: P1.TS.rp-share50
  base: B
  variant: S50
  area: metrics
  measure: p2.verdicts.positionJump
  expect: ratio
  band:
  - 0.45
  - 0.9
  source: (1-0.5)/(1-0.25) = 0.67, research/synthesis/p1-realdata-baseline.md T2/T3 (Tampa free 20.4,
    locked 0.2 per ID-minute; Wyoming locked 0.0)
  measured: 5097 -> 4452 (ratio 0.8735)
  verdict: pass
- id: P1.TS.rp-share100
  base: B
  variant: S100
  area: metrics
  measure: p2.verdicts.positionJump
  expect: ratio
  band:
  - 0.0
  - 0.1
  source: 'an all-locked fleet trips RandomPosition at about 0 (Tampa locked 0.2 vs free 20.4; Wyoming
    0.0): under 10 % of the 25 %-locked count'
  measured: 5097 -> 199 (ratio 0.03904)
  verdict: pass
- id: P1.TS.cp-share0
  base: B
  variant: S0
  area: metrics
  measure: p2.verdicts.constantPositionFrozen
  expect: up
  min_change: 0.1
  source: 'the free class repeats a frozen position while moving (frozen_repeat_prob 0.156 in the fit,
    Orem''s frozen repeats): ConstantPosition rises with the free share'
  measured: 6512 -> 8956
  verdict: pass
- id: P1.TS.cp-share100
  base: 'OFF'
  variant: S100
  area: metrics
  measure: p2.verdicts.constantPositionFrozen
  expect: ratio
  band:
  - 0.8
  - 1.25
  source: 'the locked class has frozen_repeat_prob 0: its ConstantPosition verdicts are the no-timing
    run''s (OFF)'
  measured: 0 -> 76 (ratio inf)
  verdict: fixed
  note: 'the 76 ConstantPosition verdicts of an all-locked fleet came from the calibration''s locked epoch_slip_prob
    0.0067 (a slip of -1 repeats the previous fix exactly). That value was a tools/realdata estimator
    artefact (grid hops read as slips), fixed in a77aab7c, refitted in df6d7a86 (locked 0); P1.TS.cp-share100-refit
    measures 0 -> 0. Tests: test_realdata test_a_grid_hop_is_not_an_epoch_slip, test_slip_onsets_are_counted_at_speed_only'
- id: P1.TS.reports-share0
  base: B
  variant: S0
  area: architecture
  measure: p2.reports_sent
  expect: up
  min_change: 0.05
  source: 'more honest triggers file more reports (SM-MBR §2.2: every trigger is a report candidate)'
  measured: 3794 -> 5186
  verdict: pass
- id: P1.TS.reports-share100
  base: B
  variant: S100
  area: architecture
  measure: p2.reports_sent
  expect: down
  min_change: 0.05
  source: fewer triggers, fewer reports
  measured: 3794 -> 161
  verdict: pass
- id: P1.TS.no-attack-reports
  base: S0
  variant: S0
  area: architecture
  measure: p2.reports_about_attackers
  expect: eq
  value: 0
  source: an attack-free run accuses no attacker
  measured: '0'
  verdict: pass
- id: P1.TS.no-revocation
  base: S0
  variant: S0
  area: architecture
  measure: p2.revoked_honest
  expect: eq
  value: 0
  source: 'the US presets'' MA review is 8 h on the real calendar (the pilots'' human review, FHWA-JPO-19-775
    p.8): no revocation can complete inside 120 s, whatever the trigger rate'
  measured: '0'
  verdict: pass
- id: P1.TS.crl-same
  base: B
  variant: S0
  area: architecture
  measure: p2.crls_issued
  expect: same
  source: 'no decision in the window, so no new CRL: the CRL count is the preload''s'
  measured: 0 -> 0
  verdict: pass
- id: P1.TS.separation
  base: S0
  variant: S0
  area: architecture
  measure: separation.violations
  expect: empty
  source: the timing model changes BSM contents only; no entity learns more (PKI view separation)
  measured: '[]'
  verdict: wrong-expectation
  note: 'separation.violations is a list of violations, not a count: [] is none. Corrected to expect:
    empty'
- id: P1.TS.frames
  base: B

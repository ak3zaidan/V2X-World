- id: P1.RP.gt-vs-sm.v10.gap01
  base: RP-v10-sm-01
  variant: RP-v10-gt-01
  area: metrics
  measure: p2.verdicts.positionJump
  expect: up
  min_change: 0.1
  source: 'generationTime jitters against secMark (header_jitter_ms sd 28.3, the Wyoming fit): Δt error
    ~40 ms adds v·|e| to every pair, firing locked devices too; Wyoming 0.0 on secMark vs 214 per ID-minute
    on the header time, Tampa 2-3x on rx (T3)'
  measured: 2164 -> 1731
  verdict: open
  note: 'OPEN TM-1 (engine, bsm_timing.rs): a slip k > 0 moves the secMark k epochs back and keeps the
    position, so two consecutive BSMs carry the same secMark (E4F free class: secMark dt 0 ms in 17 %
    of consecutive pairs, 200 ms in 17 %) and the generationTime clock, which follows the device''s own
    time, sees no slip at all. Real free devices advance secMark ~100-136 ms per BSM (p50 +6 ms) and the
    position jumps two fix epochs (Tampa T6: 46 % of triggers ''2 v dt''); the rx/header bases trip more
    than secMark (Tampa free 45 vs 20, Wyoming 214 vs 0). The fix is a drifting per-device BSM clock (the
    calibration''s own comment), not a patch'

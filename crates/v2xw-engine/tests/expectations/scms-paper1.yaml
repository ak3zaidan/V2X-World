# Paper 1 features validated with real runs, and experiment P1-E4
# (docs/design/scms-real/testing/paper1-validation.md). Every `expect` was written and
# committed with `measured: pending` before the run it judges. Checker:
#   python3 tools/realworld/matrix.py check <this file> <runs>
# after scratch summariser p1val/scripts/summ.py has written each run's realism.json (the
# x.* measures: report fates, ma-replay, VeReMi round trip and leakage, BeaconFrequency
# replay, E4 residual KS). `measured` is base -> variant, or the variant's value.
#
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
#
# Binary: the release build of e15bfec1 (the integrator's), copied to the scratchpad; the
# scenario's seed; --no-verify; one run per run-lock call (2,500 MB cap); 2 rayon threads.
schema: v2xw/scms-run-expectations/1
runs:
  B:
    scenario: scenarios/real-world/paper1/p1-base.yaml
    note: honest Midtown 120 s, cvpilot timing at locked 0.25, US profile on secMark (--record-level events)

  measured: '0.144099 -> 0.164634'
  verdict: open
  note: 'with Tampa''s own free clock the one-interval peak becomes too tight on air instants (engine CDF 0.001 vs Tampa 0.063 at 90 ms; p50 105.3 vs 105): KS 0.165. The remaining difference is the RSU log''s own stamp jitter (Tampa one-interval rx-gap IQR 11 ms vs secMark-gap IQR 4 ms). With that observation model (sd 5.4 ms, e5gaps ks_tampa_logjit) KS is 0.071 on this run (post hoc), 0.076 out of sample (s2).'

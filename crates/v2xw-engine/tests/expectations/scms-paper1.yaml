  source: 'free-class triggers scale with the free share: (1-0)/(1-0.25) = 1.33; free 24.1 vs locked 0.17 per ID-minute
    (us_mbr_timing), research/synthesis/p1-realdata-baseline.md T2/T3 (Tampa free 20.4, locked 0.2 per ID-minute;
    Wyoming locked 0.0)'
  measured: pending

- id: F4.kerb.standstill
  change: none yet (diagnosis; realism.rs gained an env-gated junction trace, V2XW_TRACE_ACTORS/T0/T1)
  base: buses_taxis_and_deliveries_stop_at_the_kerb_and_the_traffic_goes_round, kerbside on
  measure: standstill (180 s) count
  expect: 0, as with kerbside off (a bus at a permissive left gives way to opposing traffic only while it comes, UVC 11-402)
  source: UVC 11-402; HCM permitted-left gap acceptance
  fault: n/a
  measured: 'standstill 1: bus 79 stands at its line (lane 39, s 136.85 of 137, next connector 307) from about 111 s to the end. At 130 s no vehicle stands at any other line of junction 11 (one delivery double-parked on lane 126 at 19.9 m); by 200 s every approach of junction 11 stands (lane 32 queue 137/160/81 at its line, lane 127 queue with 18 at its line)'
  verdict: open
  note: 'not the mutual yield tests2 named, at least at its start: at 130 s the bus has no standing foe to yield to, so what holds it then is still to be read from its decision (signal state, exit-lane room on 307''s exit, junction_blocked). Next step: print the bus''s EntryDecision and conflicts at 120-130 s'

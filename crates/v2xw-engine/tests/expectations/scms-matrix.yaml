    does not jump 1 m between consecutive BSMs
  measured: '0'
  verdict: fixed
  note: 'R-USFP fixed at its cause (docs/design/scms-real/testing/usfp.md): the receivers output a smoothed
    solution, not raw 10 Hz fixes. Before: 26 (7,200 of 7,488 reports RandomPosition); gnss-raw still
    gives 26'

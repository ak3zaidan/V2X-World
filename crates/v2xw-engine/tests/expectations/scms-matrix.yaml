  recheck_9d0fbc2c: '3 on 9d0fbc2c. The premise (a PSM handset cannot be reported) still holds; since f4a0f5cc
    renumbered the vehicles, 3 of the 4 attackers are reportable vehicles (nodes 46, 58, 62), see M0-enforced'

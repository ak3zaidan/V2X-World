    no honest report reaches the MA'
  measured: '0'
  verdict: fixed
  note: 'R-USFP fixed at its cause (docs/design/scms-real/testing/usfp.md): the receivers output a smoothed
    solution, not raw 10 Hz fixes. Before: 26, because RTK still drew about 0.5 m of white noise per axis
    at every fix'
- id: rtk-honest-reports
  base: M0
  variant: gnss-rtk
  area: metrics

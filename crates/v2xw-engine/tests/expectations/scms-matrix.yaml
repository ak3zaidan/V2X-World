  expect: down
  min_change: 0.5
  source: as rtk-honest
  measured: 4 -> 4
  verdict: wrong-expectation
  note: written for raw fixes (7375 -> 6248 then). With the smoothed receiver the base has 5 honest reports,
    from one vehicle below 1 m/s (usfp.md §6), none from GNSS error, so RTK has nothing to remove
- id: rtk-attackers
  base: M0
  variant: gnss-rtk
  area: metrics
  measure: p2.revoked_attackers
  expect: eq
  value: 2
  source: ConstantPosition does not depend on the honest GNSS error; 2 as M0-attackers-revoked
  measured: '2'
  verdict: wrong-expectation
  note: as M0-attackers-revoked
- id: raw-honest
  base: M0
  variant: gnss-raw
  area: metrics
  measure: p2.revoked_honest
  expect: up
  source: 'R-USFP (usfp.md): raw 10 Hz fixes carry fresh 1.6 m white noise, so consecutive honest BSMs

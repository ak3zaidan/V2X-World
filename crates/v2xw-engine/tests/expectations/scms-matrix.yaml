rows:
- id: M0-pdr
  base: M0
  variant: M0
  area: metrics
  measure: m.pdr
  expect: band
  band:
  - 0.2
  - 0.9
  source: 'urban DSRC to 500 m among Midtown buildings: most pairs past ~150 m are NLOS and below sensitivity
    (Mangel et al. 2011 NLOS; 04-models PHY); never 1, never near 0'
  measured: '0.431244'
  verdict: pass
- id: M0-bsm-latency
  base: M0
  variant: M0
  area: metrics
  measure: m.e2e_latency.bsm.p95
  expect: le
  value: 100.0
  source: 'SAE J2945/1 §6.3: BSM latency budget 100 ms; DSRC channel access is sub-ms at low CBR'
  measured: '14.631'
  verdict: pass
- id: M0-cbr
  base: M0
  variant: M0
  area: metrics
  measure: m.cbr.172.p95
  expect: le
  value: 0.6
  source: a fifteenth of rush hour stays far below the J2945/1 congestion-control range (CBR 50-80 %)
  measured: '0.0518'
  verdict: pass
- id: M0-aoi-peak
  base: M0
  variant: M0
  area: metrics
  measure: m.aoi_peak.mean
  expect: band
  band:
  - 100.0
  - 1000.0
  source: '10 Hz BSMs: a neighbour''s peak age is at least one interval (100 ms), a few intervals with
    loss'
  measured: '114.578'
  verdict: pass
- id: M0-aoi-mean
  base: M0
  variant: M0
  area: metrics
  measure: m.aoi
  expect: band
  band:
  - 50.0
  - 5000.0
  source: time-average age of a 10 Hz stream with ~36 % PDR is a few hundred ms (Kaul et al. 2011); the
    fast-forward days carry no radio and must not count
  measured: '69.8712'
  verdict: fixed
  note: 'pre-fix M0-b1: 1,693,079 ms, the fast-forward silence charged as age; after: 81.6 ms'
  test: v2xw-metrics awareness::tests::neighbourhood_aoi_restarts_after_a_silence_rather_than_charging_it
- id: M0-unverified
  base: M0
  variant: M0
  area: metrics
  measure: m.unverified_ratio
  expect: le
  value: 0.1
  source: prioritised verification sheds only when the verifier falls behind; at CBR < 5 % the OBU's verifier
    keeps up (verify_wait ~0)
  measured: '0.0141231'
  verdict: pass
- id: M0-sec-overhead
  base: M0
  variant: M0
  area: metrics
  measure: m.security_overhead.bsm
  expect: band
  band:
  - 0.3
  - 0.7
  source: '1609.2 BSM: ~40 B payload against ~100 B security (digest) and ~170 B (certificate once a second):
    security is about half the frame'
  measured: '0.440901'
  verdict: pass
- id: M0-full-cert-share
  base: M0
  variant: M0
  area: metrics
  measure: m.full_cert_share
  expect: band
  band:
  - 0.05
  - 0.3

    PSMs, and SM-MBR v1.0 defines reports for application PSID 0x20 (the BSM) only (§1, §2.3)
  measured: '2'
  verdict: wrong-expectation
  note: 'was 3 of 3; the US profile cannot report a PSM, a real detection gap (usfp.md §3). Before the
    R-USFP fix: 1 revoked among 27 decisions'

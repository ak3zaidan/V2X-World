# SCMS configuration matrix (docs/design/scms-real/testing/matrix.md): one-change variants of
# the Midtown realism scenario (scenarios/real-world/midtown-scms-realism.yaml: 95 devices,
# us-production-2025, US SM-MBR profile, manual MA, business-day CRL, two days on the real
# calendar, seed 0xBE7C0001), run on main 2004bb87 through the run lock and read by
# tools/realworld/matrix.py (the run report, the pooled metric samples, the PKI view records).
#
# Not a sweep table: the sweep's loader passes over it by its `schema`
# (sweep::SCMS_RUN_EXPECTATIONS_SCHEMA), like scms-effects.yaml. Every `expect` was written
# down, with its source, before the run it judges. `measured` is base -> variant (or the
# one run's value for an invariant row, base == variant) as matrix.py prints it.
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
# Re-run 2026-10-24 on 81a12183 (docs/design/scms-real/testing/rerun-2026-10-24-a.md): the
# base's first live window is now 300 s. `measured` is from that re-run for the rows of M0,
# no-hsm, pq-hybrid, gnss-rtk, gnss-raw and the realism variants (44 rows judged, 0 fail);
# the other 55 rows still carry their 77cffb5b values (60 s base) and are owed.
schema: v2xw/scms-run-expectations/1
runs:
  M0:
    scenario: scenarios/real-world/midtown-scms-realism.yaml
    set: {}

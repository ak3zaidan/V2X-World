  expect: up
  min_change: 0.2
  source: software ECDSA-P256 verify on an automotive application SoC is slower than the Craton2's verify
    engine (anchors::DEVICES; C4 primitive pricing)
  measured: 0.458909 -> 0.612916
  verdict: wrong-expectation
  note: direction holds (+15 %); the pooled verify stage also counts the 30 RSUs and 26 handsets, whose
    hardware this setting does not change, and a vehicle's repeat costs 400 us (Craton2) against 645 us
    (SoC)

  measured: 0.431244 -> 0.431183
  verdict: pass
- id: pq-security-bytes
  base: no-hsm
  variant: pq-hybrid
  area: metrics
  measure: air.security
  expect: ratio
  band:
  - 4.0
  - 20.0
  source: 'a Falcon-512 signature is ~666 B and its key 897 B, against 64 B + 33 B for P-256: hybrid security
    bytes several times ECDSA''s (effects PQH: x9.2)'
  measured: 21680538 -> 204474729 (ratio 9.431)
  verdict: pass
- id: pq-fragments
  base: no-hsm
  variant: pq-hybrid
  area: metrics
  measure: r.fragments_sent
  expect: ge
  value: 1
  source: a hybrid certificate frame exceeds the 1,400-octet WSMP MTU and is fragmented (post-quantum.yaml)
  measured: '55257'
  verdict: pass
- id: pq-channel-load
  base: no-hsm
  variant: pq-hybrid
  area: metrics
  measure: m.channel_load.mean
  expect: up
  min_change: 1.0
  source: 'airtime grows with the frame: channel load at least doubles (effects PQH: x4.2)'
  measured: 0.0121231 -> 0.0506806
  verdict: pass
- id: pq-pdr-down
  base: no-hsm
  variant: pq-hybrid
  area: metrics
  measure: m.pdr
  expect: down
  source: 'longer frames: more collisions, more fragments to lose (a fragmented SDU needs every fragment)'
  measured: 0.431183 -> 0.401918
  verdict: pass
- id: pq-provisioned
  base: no-hsm
  variant: pq-hybrid

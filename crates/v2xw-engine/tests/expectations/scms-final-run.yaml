# SCMS final runs, part 2 (after fix wave 3): the post-quantum certificate-cycle re-runs
# after the R-CCSIG fix and the full-scale benchmark to completion
# (docs/design/scms-real/testing/final-run.md). Every `expect` was written down and committed
# with `measured: pending` before its run. `measured` is base -> variant, or the one run's
# value for an invariant row. Not a sweep table: `v2xw sensitivity` passes over it by its
# `schema` (sweep::SCMS_RUN_EXPECTATIONS_SCHEMA).
#
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (documented).
#
# Binary: the release build of main 09e55393 (= e4004b4c, docs only after it), copied to
# the scratchpad (sha256 prefix aee25e7d8e081322), seed 0xBE7C_0001, --record-level metrics
# --no-verify, one run per run-lock call.
schema: v2xw/scms-run-expectations/1

runs:
  PQ0:
    scenario: scenarios/real-world/stress/pq-base.yaml
    note: "quarter fleet, 60 s live, generic-sdu fragmenter, software-crypto OBU, ECDSA P-256; re-run on current code (the GNSS fix moves it)"
  PQ0old:
    scenario: scenarios/real-world/stress/pq-base.yaml
    note: "final-bench.md PQ0 on 88e24b09 (digest 8701b92c453a0b67)"
  PQHFCold:
    scenario: scenarios/real-world/stress/pq-hybrid-falcon512-certcycle.yaml
    note: "final-bench.md PQHFC on 88e24b09, R-CCSIG present (digest bcf558c227d15956)"
  PQHMold:
    scenario: scenarios/real-world/stress/pq-hybrid-mldsa44.yaml
    note: "final-bench.md PQHM on 88e24b09: hybrid ML-DSA-44 on every SPDU, generic fragmentation (digest 47fe89fb95c7b8c4)"
  PQHFC: {scenario: scenarios/real-world/stress/pq-hybrid-falcon512-certcycle.yaml, base: PQ0}
  PQHMC: {scenario: scenarios/real-world/stress/pq-hybrid-mldsa44-certcycle.yaml, base: PQ0}
  RFS:
    scenario: scenarios/real-world/midtown-scms-benchmark.yaml
    note: "final-bench.md R-FS / R-FS40 on 88e24b09 (stopped at ~155 s by the 2.5 GB cap; R-FS40 is 0-40 s complete)"
  FB2:
    scenario: scenarios/real-world/midtown-scms-benchmark.yaml
    note: >-
      the full-fleet benchmark end to end (172,800 s: 240 s live, fast-forward, 60 s live
      across the 614 -> 615 rollover, fast-forward), release build of current code, 4 rayon
      threads, run lock with a 3,500 MB cap
  QD:
    scenario: midtown-scms-benchmark-quarter.yaml
    note: "the quarter-fleet benchmark as published (docs/benchmark/scms-real-benchmark.md §2-§6, R-Q)"

rows:
# ---------------------------------------------------------------- (1) certificate cycle after R-CCSIG
- id: PQHFC.sizes
  base: PQ0
  variant: PQHFC
  area: metrics
  measure: BSM frames per BSM; BSM PSDU mean; PSM PSDU mean
  expect: >-
    NDSS 2024 Partially-Hybrid: ECDSA on every SPDU, the 858 B Falcon-512 hybrid
    certificate in alpha = 1 of each 5-SPDU cycle, so 1.00 frame per BSM and a BSM PSDU mean
    of PQ0's mean + 858/5 = about 207 + 172 = 380 B (band 330-420), down from R-CCSIG's
    1,045 B; PSM PSDU mean likewise PQ0's + about 172 B (handsets sign with the cycle's
    classical half too, run.rs hand_down_app)
  source: "NDSS 2024 (Twardokus et al.) §III, Fig. 4 (204 B frames, 858 B certificate, alpha 1); cert_cycle.rs anchors; testing/ccsig-memory.md §1"
  measured: pending
- id: PQHFC.airtime
  base: PQ0
  variant: PQHFC
  area: metrics
  measure: BSM and PSM airtime; CBR mean
  expect: >-
    airtime per frame is about 49 us + 1.333 us per PSDU byte at 6 Mb/s (PQ0: 207 B -> 325
    us, PQHFCold: 1,045 B -> 1,442 us, both fit): BSM airtime about 41,900 x 554 us = 23 s
    (band 20-27 s, x1.5-2.0 of PQ0's 13.6 s, against R-CCSIG's 60.4 s); PSM 4-6.5 s
    (against 12.3 s); CBR mean 0.014-0.022 (PQ0 0.010, PQHFCold 0.044)
  source: "IEEE 802.11-2020 §17 OFDM timing at 6 Mb/s; final-bench.md PQ0/PQHFC"
  measured: pending
- id: PQHFC.delivery
  base: PQ0
  variant: PQHFC
  area: metrics
  measure: verified messages; frame PDR 80-100 m; BSM e2e latency; unverified ratio
  expect: >-
    frames ~1.8x PQ0's and far below R-CCSIG's 5x, so loss nearer PQ0: frame PDR 80-100 m
    between PQHFCold's 0.660 and PQ0's (0.70-0.73 on the old base); verified within -8 %..+2 %
    of PQ0 (the certificate arrives every 500 ms against J2945/1's every 1,000 ms); BSM
    e2e latency PQ0's + 0.1-0.5 ms (airtime), under PQHFCold's 6.7 ms
  source: "NDSS 2024 §V-D (0.25-0.39 ms added per BSM); final-bench.md"
  measured: pending
- id: PQHFC.verify
  base: PQ0
  variant: PQHFC
  area: performance
  measure: verify cost mean; verify op; cert_pq_verifications against first-sight EE validations
  expect: >-
    every message check is ECDSA P-256: verify cost mean within 5 % of PQ0's (0.628 ms on
    the old base), not the hybrid sum 0.751; cert_pq_verifications > 0, of the order of the
    first-sight EE validations (one Falcon-512 check per certificate a receiver learns,
    PQ0 5,038 / PQHFCold 4,687 EE validations: band 2,000-12,000) and under 5 % of the
    messages checked
  source: "NDSS 2024 §III (PQ verify once per certificate); testing/ccsig-memory.md §1 (cert_verify_op)"
  measured: pending
- id: PQHFC.architecture
  base: PQ0
  variant: PQHFC
  area: architecture
  measure: backend bytes; RSU CRL installs; relay reports and MTU refusals; topups; rsus_in_cert_cycle
  expect: >-
    the credential system keeps the full hybrid scheme, so backend bytes stay at the
    hybrid level (PQHFCold 146,118 B, band +-10 %, 3x PQ0's 49 kB); under PQ the RSUs now
    fetch and install the composite CRL (R-PQRSUCRL): rsu_crls_installed 60 (30 RSUs x 2
    CRACAs; PQHFCold 0); a relay-only vehicle's report keeps the hybrid signature and
    exceeds the 1,400 B WSMP MTU, so reports_uploaded_relay 0 and reports_refused_mtu > 0
    when any relay-only vehicle reports; topups 0; rsus_in_cert_cycle 0 (no PKI view under
    PQ)
  source: "testing/ccsig-memory.md §1 and §3; pq-profile.md §2 (R-PQMBR); IEEE 1609.3 WSMP"
  measured: pending
- id: PQHFC.cost
  base: PQ0
  variant: PQHFC
  area: performance
  measure: wall, CPU, peak footprint, events, reception attempts
  expect: >-
    reception attempts within 5 % of PQ0's (same mobility, one frame per BSM); events
    1.2-1.6 M (PQHFCold 1.42 M: the cycle's fragment and P2PCD timers remain; PQ0 0.86 M);
    wall 60-130 s; peak 200-320 MB
  source: final-bench.md §1
  measured: pending
- id: PQHMC.sizes
  base: PQ0
  variant: PQHMC
  area: metrics
  measure: frames transmitted; MTU refusals; BSM frames per BSM; BSM PSDU mean
  expect: >-
    the run transmits (R-CCSIG red test was frames_transmitted 0 with 50,180 MTU
    refusals): net_mtu_refusals 0 for BSM/PSM; 1.00 frame per BSM; the ML-DSA-44 hybrid
    certificate (about 2.6-3.0 kB) in alpha = 3 equal fragments of each 5-SPDU cycle, so the
    BSM PSDU mean is PQ0's + 520-610 B = 700-850 B, with fragment-carrying SPDUs about 1.0 kB
    and the others PQ0-sized
  source: "NDSS 2024 §III-IV; tests/cert_cycle_signature.rs (3 fragments, 3,027 B; plain BSMs < 450 B)"
  measured: pending
- id: PQHMC.airtime
  base: PQ0
  variant: PQHMC
  area: metrics
  measure: BSM and PSM airtime; CBR mean
  expect: >-
    BSM airtime about 41,900 x (49 + 1.333 x 770) us = 45 s (band 38-52 s: x2.8-3.8 PQ0's,
    x0.22-0.30 PQHMold's 176 s); PSM 8-12 s (PQHMold 74.5 s); CBR mean 0.025-0.042
    (PQHMold 0.125)
  source: "802.11 OFDM timing; final-bench.md PQHM"
  measured: pending
- id: PQHMC.delivery
  base: PQ0
  variant: PQHMC
  area: metrics
  measure: verified messages; unverified ratio; frame PDR 80-100 m; BSM e2e
  expect: >-
    the certificate needs all 3 fragments of a cycle (loss amplification, 04 §7.4) and 3 of
    5 frames are ~1 kB, so verified falls below PQ0's by 2-24 % but stays above PQHMold's
    -33.8 %; BSM e2e PQ0's + 0.3-1.5 ms (PQHMold 12.1 ms)
  source: "NDSS 2024 §V-D; 04-models.md §7.4; final-bench.md PQHM.loss"
  measured: pending
- id: PQHMC.verify
  base: PQ0
  variant: PQHMC
  area: performance
  measure: verify cost mean; cert_pq_verifications
  expect: >-
    message checks are ECDSA (verify cost mean within 5 % of PQ0's, PQHMold 0.787 ms);
    cert_pq_verifications > 0 and below 5 % of messages checked, at most PQHFC's (a
    3-fragment certificate is learned no more often than a 1-fragment one)
  source: "NDSS 2024 §III; testing/ccsig-memory.md §1"
  measured: pending
- id: PQHMC.architecture
  base: PQ0
  variant: PQHMC
  area: architecture
  measure: backend bytes; RSU CRL installs; relay reports and MTU refusals
  expect: >-
    backend bytes at the hybrid ML-DSA-44 level (PQHMold 227,865 B, band +-10 %);
    rsu_crls_installed 60; relay reports keep the full scheme (ML-DSA-44, > 1,400 B):
    reports_uploaded_relay 0 and reports_refused_mtu > 0 when a relay-only vehicle reports
    (the R-PQMBR rule under the cycle)
  source: "testing/ccsig-memory.md §1, §3; pq-profile.md §2"
  measured: pending
- id: PQHMC.cost
  base: PQ0
  variant: PQHMC
  area: performance
  measure: wall, CPU, peak footprint, events
  expect: >-
    reception attempts within 5 % of PQ0's; events 1.3-2.0 M (3 fragments per cycle);
    wall 60-180 s, far below PQHMold's 583 s (no 2.3 frames per BSM); peak 200-350 MB
  source: final-bench.md §1
  measured: pending
- id: PQ.digests
  base: PQ0old
  variant: PQ0
  area: architecture
  measure: record digests of PQ0, PQHFC, PQHMC against final-bench's
  expect: >-
    all three move: PQ0 by the GNSS mean-speed fix (gauss-markov 1.2.0, positions in every
    BSM), the cycle runs by R-CCSIG as well; the three new digests differ from each other
  source: "BUILD-STATUS 2026-10-23 (DETPRIV, PQMEM)"
  measured: pending
# ---------------------------------------------------------------- (2) full-scale benchmark to completion
- id: FB2.completes
  base: RFS
  variant: FB2
  area: performance
  measure: exit status; peak footprint; footprint at ~1,600 nodes
  expect: >-
    completes (rc 0) under the 3,500 MB cap: the wave-3 de-duplication saves 10-15 % of the
    live heap, so ~1,600 nodes at 150 s cost 2.0-2.4 GB (R-FS 2,582 MB) and the peak with
    1,800-2,100 nodes is 2.6-3.4 GB, reached in the first live window (nothing grows in
    fast-forward)
  source: "testing/ccsig-memory.md §2; benchmark §0 memory model (1.4-2 MB per node)"
  measured: pending
- id: FB2.cost
  base: RFS
  variant: FB2
  area: performance
  measure: wall, CPU-hours, events, reception attempts per live second
  expect: >-
    3-4.5 CPU-hours (live: ~40-60 CPU-s per simulated s on opt-2 debug, the release build
    ~1.3x faster, 300 live s; fast-forward under 1,000 CPU-s if the D2 wake rule holds);
    wall 1.5-3.5 h at 4 threads; reception attempts 2.9-3.4 M per simulated s after the
    fill (R-FS 2.96-3.14 M)
  source: "benchmark §0 run cost; testing/stress.md §1"
  measured: pending
- id: FB2.devices
  base: QD
  variant: FB2
  area: architecture
  measure: devices_by_provider (sum and split), handsets, nodes at 240 s
  expect: >-
    about 580 handsets; 1,800-2,100 devices at the end of the first live window (R-FS 1,632
    at 150 s + ~2.5/s arrivals, few departures from the congested box); provider split
    within 45/55; 5-6x the quarter's 349
  source: "scenario file; D1 fleet split ASSUMPTION; final-bench FB.devices"
  measured: pending
- id: FB2.provisioning
  base: QD
  variant: FB2
  area: architecture
  measure: provisioning requests and PCA certificates per device; RA/ACA load per provider
  expect: >-
    one request per device at entry, 40 certificates each (2 weeks x 20, CAMP 1.2.2
    Table 67 certs_per_i_period 20, ra-maxReqs 1); per provider's RA about 900-1,050
    requests in 240 s (3.7-4.4 /s) against CAMP's design rate of ~0.5 /s for 17 M
    vehicles a year: a scenario-start burst no real RA sees (factory provisioning)
  source: "CAMP 1.2.2 Table 67; 04 §4.1; benchmark §5"
  measured: pending
- id: FB2.topups-at-rollover
  base: QD
  variant: FB2
  area: architecture
  measure: topups started/completed, certificates topped up, refusals, starved, pool
  expect: >-
    one top-up per powered, reachable device at the 614 -> 615 boundary (43,200 s; QD 275
    of 349): 75-100 % of the devices, completed >= 95 % of started, 20 certificates each,
    inside the 1 h overlap; 0 refused (no revocation expected); 0 vehicles starved;
    cert_pool_valid 20 in the first window and ~40 after the top-up
  source: "CAMP-EE R1.1 §2.1.5.3.2 (1 h overlap); NYC weekly top-off; 04 §4.1"
  measured: pending
- id: FB2.radio
  base: RFS
  variant: FB2
  area: metrics
  measure: CBR mean / p95 after the fill; PDR within 100 m; BSM e2e latency; loss causes
  expect: >-
    unchanged from R-FS at the same windows (the GNSS fix moves positions by centimetres):
    CBR mean 0.07-0.09, p95 < 0.2, below J2945/1 vMinCU 0.5 (no power adaptation); PDR
    within 100 m 0.80-0.87; BSM e2e mean 12-15 ms (fixed 9 ms CRATON2 sign); losses mostly
    below sensitivity, hidden terminal ~2 %
  source: "SAE J2945/1; final-bench FB.cbr/pdr/latency"
  measured: pending
- id: FB2.verify-load
  base: RFS
  variant: FB2
  area: performance
  measure: verifications per node per second; queue p99; unverified share
  expect: >-
    about 240 per node per second after the fill (band 200-290), a tenth of CRATON2's
    > 2,500/s; verify queue p99 under 1 ms; unverified share 3-7 % (prioritized sheds)
  source: "Unex OBU-301E sheet; final-bench FB.verify-load"
  measured: pending
- id: FB2.honest-reports
  base: RFS
  variant: FB2
  area: architecture
  measure: verdicts by detector; reports about honest devices; MA cases, decisions, honest revoked
  expect: >-
    R-FS40's constantPositionFrozen burst (165 verdicts in 40 s) is gone with the GNSS fix:
    under 10 in the whole run; positionJump verdicts (71 in R-FS40, not investigated) may
    remain at a similar rate (0-2 per simulated s); RSUs file none of their own reports
    (reports_mbr_unsecured 0); honest traffic, so 0 revoke decisions and 0 honest devices
    revoked over the two days; cases opened 0-4 (manual review, 8 h per case)
  source: "testing/measure.md (R-FS40, R-UNSEC); testing/usfp.md; D3 ASSUMPTION"
  measured: pending
- id: FB2.crl
  base: RFS
  variant: FB2
  area: architecture
  measure: CRL versions, entries, downloads, installs; overdue refusals
  expect: >-
    each CRACA publishes at t0 (2 versions, 0 entries); devices hold them (OF-3);
    60 RSU installs at t0; with no revocation no new entries, so later versions only on
    the CRL period (2-4 versions over 2 days); 0 crl-period refusals; 0 revoked receptions
  source: "testing/stress.md R-NOCRL; 03 §9 (SCMS Manager CRL SLA)"
  measured: pending
- id: FB2.trust
  base: RFS
  variant: FB2
  area: architecture
  measure: receiver refusals by cause; SPDU signature failures
  expect: 0 refusals for psid-not-permitted, off-CTL or crl-overdue; 0 SPDU signature failures (honest traffic)
  source: "testing/stress.md; BUILD-STATUS 2026-10-22 TRUST"
  measured: pending
- id: FB2.privacy
  base: QD
  variant: FB2
  area: metrics
  measure: pseudonym changes, changes heard, link claims / correct / spurious, linkability
  expect: >-
    pseudonym changes almost all at the rollover (the 240 s and 60 s live windows are
    shorter than J2945/1's 5-minute period): roughly one per vehicle on the map at 43,200 s;
    privacy_links_claimed counts only claims across a heard change (bounded by
    privacy_changes_heard); correct links near 0 for a 10 % observer and a simultaneous
    change (QD 0 of 183); newly-heard links counted as privacy_links_spurious, in the
    thousands (R-FS40: 2,873 in 40 s)
  source: "Wiedersheim et al. 2010; testing/measure.md (privacy fields); benchmark §6"
  measured: pending
- id: FB2.traffic
  base: QD
  variant: FB2
  area: metrics
  measure: mean speed in the live windows
  expect: "below the quarter's 4.12 m/s and near Midtown's ~2.2 m/s: 1.5-3 m/s late in the first window"
  source: NYC DOT Mobility Report 2018/2019
  measured: pending
- id: FB2.ff-ticks
  base: QD
  variant: FB2
  area: performance
  measure: backend ticks and skipped steps over the fast-forward windows
  expect: >-
    D2: at most one stop a minute when nothing is due, so about 2 x 1,440 idle stops plus
    due events: under 5 x 10^4 ticks (QD had 1,119,908, benchmark §9.2; MW measured
    54,511 for 33 days); skipped steps (42,930 + 129,570 s) / 0.1 s = 1,725,000
  source: "D2 design; testing/stress.md MW.cost"
  measured: pending
- id: FB2.backend-load
  base: QD
  variant: FB2
  area: architecture
  measure: per provider -- RA requests, ACA certificates, MA reports received, CRL versions; backend and backhaul bytes
  expect: >-
    per provider (~50 % each): provisioning ~1,000 requests / ~40,000 certificates at
    entry, top-ups ~1 per device per week (CAMP: one .info and one file per device a
    week), MA reports received in the hundreds, CRL versions 1-2; backend bytes roughly
    proportional to devices (QD x5-6)
  source: "04 §4.1 CAMP sizing; benchmark §5"
  measured: pending

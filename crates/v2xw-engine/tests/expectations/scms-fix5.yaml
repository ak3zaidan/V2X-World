rows:
# --- F5-TOPUP: the top-up flow's own Uu bytes per top-up ----------------------------------
- id: F5.TOPUP.bytes
  base: T
  variant: T
  area: network
  measure: topup.uu_bytes_per_topup
  expect: band
  band: [3400, 4100]
  source: 'scms-fix3-ra.yaml RA.uu-bytes-per-topup recheck_9d0fbc2c (trace track, pki.flow): the
    top-up exchange (.info, its answer, the batch request and download, the file request and
    response) is 221,859 B, 3,760 B per top-up; 1609.2.1 6.3.5.4 (the same two downloads).
    The band is 3,760 B -10 % / +9 %: the bytes per top-up are the protocol''s, not the draw''s'
  measured: '3,764.3 (222,095 B over 59 completed top-ups, 354 messages); all Uu bytes per top-up
    on the same run 17,019.3 (the 9d0fbc2c value)'
  verdict: pass
  fault: 'the extractor summing every flow''s device-side msg/pdu bytes (the flow filter
    dropped): 26,324.9, FAIL'
  note: 'RA.uu-bytes-per-topup divided every Uu byte by the top-ups, so 71 % of it was SM-MBR
    uploads (a property of the realisation: 13.5, 17.0, 22.5 and 16.3 kB per top-up across
    builds and seeds). The extractor (runtime_realism.py extract/derive) now sums the `topup`
    flow''s msg and pdu records with a device (ee/<n>) at one end: topup.uu_bytes,
    topup.uu_msgs and, per completed top-up, topup.uu_bytes_per_topup. The engine leaves
    (access.uu_*_bytes) are right for what they say: all Uu traffic'
- id: F5.TOPUP.share
  base: T
  variant: T
  area: network
  measure: topup.uu_msgs
  expect: ge
  value: 1
  source: the top-up flow crosses Uu (ee <-> ra/lop) at every top-up
  measured: '354'
  verdict: pass
# --- F5-SCOPE in a run: the strict reading refuses what the CRACA reading lets through -----
- id: F5.SCOPE.mwc-all
  base: MWC
  variant: MWCA
  area: metrics
  measure: rv.refused.crl-overdue
  expect: ge
  value: 1
  source: '[CAMP122] Table 67 ("rejecting all of them"). MWC (scms-variants.yaml RR.MWC.overdue
    note2): W4 receivers hold the t0 home list (CRACA b710ad, nextCrl day 7.0) overdue from day
    21.0, while every home sender signs under the new CRACA 4a1086, so the craca reading refuses
    0. Under all, that one overdue list refuses every message in W4'
  measured: '0 -> 326,316 (every refusal crl-overdue; 709,428 checked). MWC itself: 0 refusals
    of any kind, MWC2 110,048 (scms-variants.yaml rechecks); MWC 1,487 s, MWCA 1,144 s wall,
    peak 146 / 143 MB'
  verdict: pass
  fault: 'the setting ignored (the engine behaving as craca, i.e. the MWC run judged as MWCA): 0, FAIL'

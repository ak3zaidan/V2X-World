  base: T
  variant: T
  area: network
  measure: topup.uu_bytes_per_topup
  expect: band
  band: [3400, 4100]
  source: 'scms-fix3-ra.yaml RA.uu-bytes-per-topup recheck_9d0fbc2c (trace track, pki.flow): the
    top-up exchange (.info, its answer, the batch request and download, the file request and

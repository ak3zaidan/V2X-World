# Expectation rows of the final independent oracle check (docs/design/scms-real/testing/
# oracle-final.md). Checked by `tools/oracle/oracle.py records RUN... --expect THIS_FILE`:
# a row {run, rule, expect: pass} holds when that rule has no red check on that run's
# recording; {expect: red} records a disagreement the report documents (it must stay red until
# the engine is fixed, then flips to pass). Rows with `compare` are measured against the base
# run on the same seed and checked by hand in the report (section 3).
#
# Runs (first: release binary of main 4924a5d2; re-checked on HEAD 88e24b09, optimised debug
# build, see the report's section 8; `--record-level events`):
#   conf = scenarios/scms-conformance.yaml   (base)
#   mbr  = scenarios/scms-oracle-mbr.yaml    (variant: automatic MA at both providers, 20 %
#          liars, four radio windows over 15 days, same seed)
# Every row was first written as the standard predicts (pass) before the results were read;
# the `expect: red` rows were changed afterwards, each to a documented engine disagreement
# (OF-n in the report) with its evidence, never to fit a wrong rule.

# ---- Encoding, time, certificates ----
- {run: conf, rule: DECODE, expect: pass, source: "every PDU decodes and re-encodes byte for byte (1609.2 6.2 canonical COER)"}
- {run: mbr, rule: DECODE, expect: pass, source: "as above"}
- {run: conf, rule: TIME, expect: pass, source: "Time32 = TAI s since 2004-01-01, 5 leap seconds by 2026 (1609.2 6.3.11)"}
- {run: mbr, rule: TIME, expect: pass, source: "as above, across 15 days"}
- {run: conf, rule: CERT-ID, expect: pass, source: "HashedId8 = low 8 bytes of SHA-256 of the canonical certificate (1609.2 6.4.3)"}
- {run: mbr, rule: CERT-ID, expect: pass, source: "as above"}
- {run: conf, rule: CRACA-CERT, expect: pass, source: "cracaId = HashedId3 of a CRACA whose CRL signer lists the series; pseudonym 1, app 3, enrolment 4 ([SMP] Table 1)"}
- {run: mbr, rule: CRACA-CERT, expect: pass, source: "as above"}
- {run: conf, rule: ENR-LIFE, expect: pass, source: "6-year enrolment ([CAMP122] Table 3). Was red (OF-1: 56 vehicle enrolment certificates started at t0 with 0.9-5.5 y lifetimes); fixed by age_enrolment, passes on main 25483af3"}


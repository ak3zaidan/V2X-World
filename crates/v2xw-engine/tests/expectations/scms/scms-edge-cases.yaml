# SCMS edge cases (docs/design/scms-real/testing/edge-cases.md): one row per check, written
# before the run, with its source; `measured` and `verdict` filled from the runs.
#
# Kept in this subdirectory, not next to the sensitivity rows: `sweep::load_expectations`
# reads every `*.yaml` of `tests/expectations/` as a sensitivity row and
# `sensitivity_expectations::every_row_is_planned` fails on a row the catalogue cannot plan;
# these rows are scenario-file runs (scenarios/edge/*.yaml against scenarios/scms-conformance.yaml
# on the same seed), not one-setting sweeps.
#
# verdict: pass | fixed (failed on main d3039b53, engine fixed at its cause, test named) |
#          open (documented) | corrected (the expectation was wrong; evidence given)

- id: E1.rollover-no-expired-signer
  run: scms-conformance (main)
  expect: no vehicle's active pseudonym is past its validity at any node.security record (13,749)
  source: "CAMP-EE R1.1 §2.1.5.3.2 (169 h validity, 1 h overlap); IEEE 1609.2 §5.2 generationTime inside the signer's validity"
  measured: 0 of 13,749 records; 0 air SPDUs (the F1 oracle's validity check)
  verdict: pass
- id: E1.overlap-hour-moves-to-new-week
  run: scms-conformance (main)
  expect: a pseudonym change inside the overlap hour (600..4,200 s) picks week 615, never 614
  source: "CAMP-EE §2.1.5.3.2; stores.rs rotate prefers the newest i-period"
  measured: 4 changes in the hour, all to 615; 11 'expired' changes after the fast-forward, all to 615
  verdict: pass
- id: E1.departed-vehicle-record
  run: scms-conformance (main)
  expect: a vehicle's last node.credentials does not show a certificate active after the vehicle left
  source: "the PKI view must not show what no device does (00 §3.1)"
  measured: "15 of 56 vehicles left before 4,200 s; their last record (614 active) stood for the rest of the run: the reported 'expired certificate in use'"
  verdict: "fixed: a departing vehicle emits a last record with nothing active, departed: true (run.rs absorb; phase2 node_credentials_departed)"
- id: E1.mbr-signer-valid
  run: scms-conformance (main)
  expect: every SM-MBR is signed with a pseudonym valid at its generationTime
  source: "SM-MBR v1.0 (report signed by a pseudonym, PSID 0x26); IEEE 1609.2 §5.2"
  measured: "main, checked with the A0 oracle's COER on the MA-opened plaintext (scratch py/mbrsig.py): 6 of 1,983 SM-MBRs signed by a week-614 pseudonym after it expired (first: ee/1000015 at 196,202 s, 2.2 days past expiry); 34 of 36 reporters signed every report of the run with one pseudonym (reports linkable to each other)"
  verdict: "fixed: ScmsRun::mbr_signer (the vehicle's BSM pseudonym if valid, else the newest valid); test mbr.rs a_report_after_the_rollover_is_signed_with_a_pseudonym_valid_then"
- id: E3.ra-outage-topup-main
  run: edge/ra-outage-topup (main)
  expect: "without the SCMS-522 retry the home provider's top-ups started in the outage never complete"
  source: "validation/protocols.md B6 (the deviation); fault.rs Offline drops every delivery"
  measured: 12 started, 6 completed (the 6 home-provider vehicles lost), 144 deliveries dropped
  verdict: "fixed (see the next row)"
- id: E3.ra-outage-topup-retry
  run: edge/ra-outage-topup (new)
  expect: "every top-up completes; ten retries 10 s apart meet the outage, the eleventh waits for the SCMS-523 window"
  source: "[CAMP122] §5.2.8.3 SCMS-522 (10 s), SCMS-523 (10 per 60 min)"
  measured: "12 started, 12 completed (main 6); ee_retries 66 = 6 home-provider vehicles x 11, ee_retries_capped 6 (one each), 264 deliveries dropped (main 144), 0 duplicate answers, 0 re-acks; user time 368 s (main 449 s)"
  verdict: fixed
- id: E3.retry-idempotent
  run: proto ee_retry.rs a_retried_request_is_acknowledged_again_and_issued_once
  expect: an RA 15 s slow sees the request twice, accepts one, re-acks the retransmission, issues 6 of 6 once
  source: "[CAMP122] SCMS-520 (one request) with SCMS-522; ASSUMPTION idempotent re-ack"
  measured: 1 accepted, >= 1 re-acked, 0 RequestLimit refusals, 6 certificates, one request byte string
  verdict: pass
- id: E3.ra-outage-loses-backend-answers
  run: proto ee_retry.rs (RA itself down after the ack)
  expect: the batch still arrives once the RA is back
  source: "a real RA's peers (LA, ACA) retry their HTTP calls"
  measured: the LAs' and ACA's answers to the down RA are dropped and never resent; the batch is never made
  verdict: "open: backend-to-backend retry is not specified; the test uses a LOP partition instead"
- id: E5.crl-reissue
  run: proto ee_retry.rs an_idle_crl_generator_renews_its_list_every_next_crl
  expect: a CRL Generator with nothing new re-issues by nextCrl (issue + 7 d), so no healthy receiver ever reaches nextCrl + 14 d
  source: "IEEE 1609.2 CrlContents.nextCrl; [CAMP122] Table 67 overdue_CRL_tolerance 2 weeks"
  measured: "main: no re-issue ever (the Generator signs only on an append); a CRL idle 21 days leaves every receiver refusing the CRACA's certificates. New: re-issued days 7, 14, 21; vehicles and RSUs fetch a re-issue (publication serial)"
  verdict: fixed
- id: E6.composite-crl-bytes
  run: edge/standing-crl-10k (new) vs scms-conformance (new)
  expect: "a 10,000-entry download costs the encoded CompositeCrlSpdu, ~33 B/entry (F2 33.08) plus signature, CRL signer certificate and home CTL: ~0.33 MB, not 0.40 MB"
  source: "IEEE 1609.2.1 CompositeCrl; 04-validation-report.md (33.08 B/entry); tests crl_ctl_vectors the_composite_crl_from_held_bytes_is_the_committed_vector"
  measured: "first binary (each standing entry under a random LA pair): 43 downloads, Uu downlink 19.64 MB vs 0.24 MB without the list, about 451 KB a download (45 B an entry: every entry its own LAGroup). Fixed to the provider's own LA1/LA2 (a US provider runs one of each): proto test a_standing_crl_costs_thirty_three_bytes_an_entry measures 32.5-33.5 B. Cost: wall 1,143 s vs 382 s, peak RSS 178 MB vs 78 MB (receivers expand 10,000 entries); charged receiver validation 656 ms vs 425 ms"
  verdict: "corrected (my standing list grouped entries unrealistically) and pinned; the 33 B rerun at 10,000 is open"
- id: E6.standing-crl-provider-a-refusals
  run: edge/standing-crl-10k (new) vs scms-conformance (new, same seed)
  expect: "random standing entries match no device of the run, so refusals of revoked senders are those of the base"
  source: "a linkage entry revokes only the chain its seeds generate (1609.2 §5.1.3.4)"
  measured: "23,284 vs 29,704 (first compared with the outage run, 7,298, where provider-a's case never reaches a CRL: wrong base)"
  verdict: "corrected; the 21 % fewer refusals is open (likely the receivers' CRL-processing time)"

- id: E7.revoked-keeps-transmitting
  run: scms-conformance family (main)
  expect: a revoked liar that keeps transmitting is refused by vehicles of both providers and by RSUs
  source: "CAMP-EE §2.2.10.2; 1609.2 linkage-based revocation"
  measured: "outage run: 7,298 vehicle and 1,188 RSU refusals of revoked senders; many-cases: 29,050 / 5,012, all four receiver<-sender provider pairs"
  verdict: pass
- id: E9.thanksgiving
  run: edge/thanksgiving (main)
  expect: "a case decided Wednesday is published the next business day at 10:00 local; Thursday 26 Nov is a holiday, so Friday 27 Nov 15:00 UTC"
  source: "5 U.S.C. 6103; provider one-business-day CRL rule (calendar.rs business-day slots)"
  measured: "decisions Wed 25 16:52 UTC; published Fri 27 15:00 UTC (10:00 EST). Ordinary week: decided Wed 21 16:51, published Thu 22 14:00 UTC (10:00 EDT)"
  verdict: pass
- id: E10.no-coverage
  run: edge/no-coverage (main)
  expect: "V2V signing and verification go on from the factory pool; no top-up, report, case, CRL or download; reports pile up and leave with their vehicles"
  source: "CAMP-EE §2.2.10; [CAMP122] §3 (every SCMS exchange needs a connection)"
  measured: "0 top-ups, 0 reports at the MA, 0 cases, 0 CRLs, 0 downloads; 39,446 verified; 1,405 reports lost with departing vehicles, 14 unsent; wall 138 s vs 400 s"
  verdict: pass
- id: E12.many-cases
  run: edge/many-cases (main)
  expect: "ten cases at once go through the 8 h review and onto the next business-day CRL; refusals rise with the revoked liars"
  source: "CV-pilot manual MA (ASSUMPTION 8 h); business-day CRL rule"
  measured: "10 cases (4 + 6 by provider), 10 decisions, 3 CRL versions, 265 enforcements, 29,050 refused receptions (base family 7,298)"
  verdict: pass
- id: regression.base-new-vs-main
  run: scms-conformance, final new binary vs main, same seed
  expect: only the fixed behaviours move
  source: this package
  measured: "revoked refusals 29,704 vs 29,644; RSU 4,311 vs 4,311; real SM-MBRs 1,296 vs 1,313; 4 cases each; 12/12 top-ups each; 0 retries; SM-MBR signers outside validity 0 vs 6; departed vehicles showing a certificate in use 0 vs 15; CRL downloads 27 vs 17 and Uu downlink 245,631 vs 160,690 B (re-issue serials and the real composite size with the home CTL)"
  verdict: pass

# Batch 3 (2026-10-19), written before the runs. Binary new3 = this branch with the clock
# offset on the security path (item 2) and the device CTL install (item 8).
- id: regression.base-new3
  run: scms-conformance, new3 vs new2 (same seed)
  expect: "only the CTL install moves: the rollover CTL (AddRoot, decided at 120 s, published Friday 08:52 UTC after 3 business days) is installed by every vehicle polling in the Saturday window and by both RSUs, with 0 anchors removed; extra composite downloads in that window; refusals, cases, top-ups unchanged"
  source: "IEEE 1609.2.1 CompositeCrlSpdu carries homeCtl; Provider Req. v1.1 §3.4.11 (3 business days)"
  measured: "trust_lists_installed 16 (14 vehicles + 2 RSUs), anchors removed 0; CRL downloads 41 vs 27, RSU CRL installs 6 vs 4, Uu downlink 295,933 vs 245,631 B; refusals 29,704/4,311, 4 cases, 12/12 top-ups, BSMs and verifications per window identical"
  verdict: "pass"
- id: E2.clock-ahead-5000s
  run: edge/clock-skew-ahead (new3) vs scms-conformance (new3)
  expect: "about half the vehicles skewed. Window 0-660 s: a skewed sender believes 614 expired (its end is 4,200 s) and signs under 615 from its first BSM; accurate receivers refuse those as chain-expired until 600 s (615 not yet valid), then accept; skewed receivers refuse every 614 BSM as chain-expired. Later windows cross no edge and match the base. Top-ups, cases and CRLs unchanged (the backend runs on true time). Wall time about the base's (refused receptions skip the signature check)"
  source: "IEEE 1609.2 §6.3.9 (generationTime on the sender's clock), §5.2 (validity at the receiver's current time); CAMP-EE §2.1.5.3.2 (169 h validity)"
  measured: "28 skewed; window 0 signing under 615 by provider-a 1,899 vs 70; accurate receivers 0-600 s: 33,362 refused / 35,358 valid, 600-700 s: 0 refused / 7,137 valid; skewed receivers (own clock 5,000-5,700 s) 23,055 refused; top-ups 12/12. Cases 20 vs 4, 15 honest vehicles revoked (MBD positionJump 16,485, acceptanceRange 17,351, mapOffRoad 18,566 vs 6/0/0), 2 starved after revocation; wall 615 s vs 637 s, RSS 212 vs 71 MB"
  verdict: "validity edges pass; 'cases unchanged' corrected: kinematic detectors extrapolate from generationTime, so an honest vehicle 83 min off is reported and revoked (a GNSS-time attack surface)"
- id: E4.offline-weeks
  run: edge/offline-weeks (new3) vs edge/offline-weeks (main)
  expect: "window 611,700-612,000 s (after 615 ends at 609,000 s): every home-provider vehicle is starved and silent (0 BSMs), the peer provider's vehicles sign under 616. The device keeps retrying at most 10 an hour (SCMS-523), so within an hour of the RA's return at 700,000 s the request gets through; window 705,000-705,300 s: home vehicles sign under 616 again, all 12 top-ups complete. Main (no retry): the home vehicles stay silent and 6 of 12 top-ups complete"
  source: "[CAMP122] SCMS-522/523; CAMP-EE §2.2.10.2 (no valid certificate: stop transmitting)"
  measured: "new3: 6 home vehicles starved, 0 BSMs from them at 611,700-612,000 s; 11,977 retries, 1,197 capped; the 7 requests acknowledged at 702,610 s and installed by 702,671 s (2,610 s after the RA returned). Main: 0 of 7 acknowledged after 590 s. The 6 vehicles left the map before the last window"
  verdict: "pass (backend; the last window cannot show the departed vehicles transmitting)"
- id: E8.peer-root-removed
  run: edge/peer-root-removed (new3) vs scms-conformance (new3)
  expect: "the removal is decided at 300 s and published at 173,100 s (48 h). Thursday and Saturday windows: every device that installed it (each vehicle on its next download, both RSUs) refuses every provider-b BSM as chain-untrusted-root; verified receptions of provider-b senders fall to about 0 there; provider-a unaffected; the RAs no longer serve provider-b's CRL. Window 0-660 s matches the base"
  source: "Elector Policy v1.0 §2.2.4 (48 h); IEEE 1609.2 §5.1.2 (chain to a CTL-approved root); 1609.2.1 CompositeCrlSpdu"
  measured: "new3 panicked in Governance::home_root (fixed, provider_runs test). new5: window 0 identical; Thursday unchanged (the CTL due at 173,100 s was published at the next backend tick, after that tick's polls); Saturday 16 installs, 16 anchors removed, 42,132 chain-untrusted-root = verified provider-b drop 34,476 + revoked refusals turned untrusted 7,656; 21 CRL frames refused whole"
  verdict: "pass on the mechanism; open: CTL publication timing inside a fast-forward, whole-frame CRL refusal"
- id: E6.composite-crl-10k-rerun
  run: edge/standing-crl-10k (new3) vs scms-conformance (new3)
  expect: "about 0.33 MB per composite download (33 B an entry with the provider's own LA pair), not 0.45 MB (first binary) or 0.40 MB (estimate)"
  source: "F2 33.08 B/entry; proto test a_standing_crl_costs_thirty_three_bytes_an_entry"
  measured: "57 downloads, Uu downlink 19,153,594 B: 336 kB a download (33.1 B an entry incl. signature, signer, CTL); wall 1,092 s vs 637 s, RSS 194 vs 71 MB"
  verdict: "pass"

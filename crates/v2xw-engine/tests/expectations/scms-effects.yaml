- id: ond-reports
  base: L0N
  variant: OND
  area: metrics
  measure: reports_at_ma
  expect: same
  source: the reporter verifies the evidence it files (filing is acting), so reports reach the MA about
    as before
  measured: 897 -> 79
  verdict: wrong-expectation
  note: 'wrong: the detector suite runs on verified messages only, as a report must carry authentic evidence.
    On-demand verification left 89.5 % of receptions unverified (unverified_ratio 0.027 -> 0.895), so
    detector verdicts fell 2,704 -> 187 and reports 897 -> 79. No decision, case or revocation was made
    in 54 h (cases 2 -> 0). Security finding: verify-on-demand blinds misbehaviour detection, and a fleet
    running it never revokes these attackers'

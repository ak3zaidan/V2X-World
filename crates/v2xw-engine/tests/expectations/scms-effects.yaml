  base: ATT20
  variant: ATT20
  area: architecture
  measure: aca_control
  expect: positive
  source: 'positive control for att-aca-blind: RA-bound PDUs do carry the enrolment id, so the search
    can find one'
  measured: '0'
  verdict: wrong-expectation
  note: '0: an EeRaCertRequest carries the whole enrolment certificate, not its HashedId8, so a HashedId8
    search finds nothing even where the identity is; superseded by aca-control'

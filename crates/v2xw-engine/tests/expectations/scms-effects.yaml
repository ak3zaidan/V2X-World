  expect: zero
  source: 'the RA strips the enrolment identity before the ACA (1609.2.1 §4.1.3; RAPRE ACA blindness):
    no ACA-bound PDU carries an enrolment HashedId8'
  measured: '0'
  verdict: wrong-expectation
  note: '0 of 4,603 ACA-bound PDUs carry an enrolment HashedId8, but the positive control (att-aca-control)
    found none in RA-bound PDUs either: the requests carry the whole enrolment certificate, not its digest,
    so this byte search cannot fail as written. Replaced by aca-control / aca-control-search / aca-blind
    / aca-inject (oracle-decoded signers, a search for the enrolment certificates'' bytes, and an injected
    leak that turns it red)'

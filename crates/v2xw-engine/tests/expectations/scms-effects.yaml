# SCMS effects table: what an SCMS or environment change does to (a) the metrics, (b) the
# run's cost and (c) the PKI architecture the run records, measured in real same-seed runs
# of the release binary (docs/design/scms-real/testing/effects.md has the method and the
# table in prose). Not a sweep table: `v2xw sensitivity` passes over it by its `schema`
# (sweep::SCMS_RUN_EXPECTATIONS_SCHEMA); tests/scms_effects.rs checks it is whole.
#
# Every expectation was written down before its run. `measured` is base -> variant (or
# the one run's value, for a row whose base and variant are the same run: an invariant).
# verdict: pass | fixed (an engine defect, fixed at its cause; `test` pins it) |
#          wrong-expectation (corrected with the evidence in `note`) | open (a documented
#          deviation or a row not yet measured).
schema: v2xw/scms-run-expectations/1

runs:
  L0:
    scenario: scenarios/credential-weeks.yaml
    set: {actors.vehicles.demand.rate_veh_per_h: 300.0, time.duration_s: 196500.0,
          time.fast_forward: [{from_s: 900.0, to_s: 196200.0}],
          threats.attackers.0.schedule.to_s: 196500.0}
    note: >-
      Real calendar from Tue 2026-10-20 08:50Z (i = 614 -> 615 rollover at 600 s), two
      providers 50/50, manual MA (8 h), business-day CRL at 10:00 ET, 5 % ConstPos, seed
      0xC0FFEE5EED; radio on 0-900 s and 196200-196500 s (Thu 15:20Z), backend only between.
  L0b: {base: L0, set: {}, note: "L0 again, rerun for its metric samples (the first pass kept only run-report.json)"}
  ATT20: {base: L0, set: {threats.attackers.0.fraction: 0.2}}
  MAAUTO: {base: L0, set: {security.protocol.params: {ma_review_s: 0}}}
  C40: {base: L0, set: {security.protocol.params: {certs_per_period: 40}}}
  AALL: {base: L0, set: {security.signer_id_policy.digest_otherwise: false}}
  F2X: {base: L0, set: {actors.vehicles.demand.rate_veh_per_h: 600.0}}
  P90: {base: L0, set: {security.scms.deployment: {preset: us-production-2025, providers: [
          {name: provider-a, fleet_share: 0.9}, {name: provider-b, fleet_share: 0.1}]}}}
  CAMP: {base: L0, set: {security.scms.deployment: {preset: camp-reference}}}
  PEN0R0: {base: L0, set: {net.uu.params.penetration: 0.0, actors.rsus: []}}
  SLOW: {base: L0, set: {nodes.default_obu: obu/generic-automotive-soc-no-hsm}}
  PQH: {base: L0, set: {nodes.default_obu: obu/generic-automotive-soc-no-hsm,
          net.fragmenter: {id: fragmenter/generic-sdu},
          security.signature: hybrid-falcon512-ecdsa-p256}}
  P60: {base: L0, set: {security.pseudonym_change.period_s: 60.0}}
  PEN0: {base: L0, set: {net.uu.params.penetration: 0.0}}
  ONDEC: {base: L0, set: {security.scms.deployment: {preset: us-production-2025, providers: [
          {name: provider-a, crl_publication: on-decision}, {name: provider-b, crl_publication: on-decision}]}}}
  A450: {base: L0, set: {security.signer_id_policy.full_cert_every_ms: 450}}


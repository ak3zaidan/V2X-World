# The reference OBU (obu/unex-obu-301-craton2) with ECDSA in software (rule H2: hsm.kind
# none sends every operation to the CPU through the software cost table).
id: obu/unex-obu-301-craton2-software
kind: obu
version: 2026-09-18.1
reference_profile: false
purpose: >-
  The reference OBU (Unex OBU-301E, Autotalks CRATON2) with its security hardware set
  aside: every ECDSA operation runs in software on the application cores. This is the
  profile for studying verify-dominated cost — on one processor ECDSA verification costs
  about twice signing — where the hardware variant signs in a slow secure element and
  verifies on a line-rate accelerator. The software figures are Cortex-A53 proxies,
  flagged as such.
sources:
  - {kind: info-sheet, ref: "Unex OBU-301E information sheet", accessed: 2026-09-18}
  - {kind: info-sheet, ref: "Unex OBU-351U information sheet", accessed: 2026-09-18}
  - {kind: security-policy, ref: "Autotalks CRATON2/SECTON eHSM FIPS 140-2 Security Policy, CMVP #3556", accessed: 2026-09-18}
  - {kind: fcc-filing, ref: "Unex OBU-201U spec v2.03 (CRATON gen-1, per-MCS sensitivity proxy)", accessed: 2026-09-18}
cpu:
  cores: {value: 2, source: "\"dual 600 MHz ARM Cortex-A7 cores\" [Unex OBU-301E information sheet]"}
  clock_hz: {value: 6.0e8, source: "[Unex OBU-301E information sheet]"}
  arch: {value: armv7-a, source: "Cortex-A7 [Unex OBU-301E information sheet]"}
  dmips: {value: 2280, source: "1140 DMIPS per core x 2 cores (derived from the per-core rating) [Unex OBU-301E information sheet]"}
ram_bytes: {value: 134217728, source: "128 MB DDR3 as integrated in the OBU-301E [Unex OBU-301E information sheet]"}
flash_bytes: {value: 134217728, source: "128 MB NAND [Unex OBU-301E information sheet]"}
hsm:
  kind: none
  part: {value: null, status: not-applicable, calibration: "rule H2: this variant declares no security hardware on purpose, to model the same OBU with ECDSA in software on its application cores. The hardware-crypto variant is obu/unex-obu-301-craton2"}
  ops: {}
  queue_depth: {value: null, status: not-applicable, calibration: "rule H2: no HSM queue exists on this profile; the node's CPU queue carries the work"}
  servers: {value: null, status: not-applicable, calibration: "rule H2: no HSM server exists on this profile"}
# Placement: sign and verify both run in software on the application processor.
software_crypto:
  ecdsa-p256-sign: {us: 613, status: proxy, ops_per_s: 1631.1, source: "PROXY, flagged: no OpenSSL benchmark on the OBU-301's Cortex-A7 was found; Raspberry Pi 3B Cortex-A53 @ 1.2 GHz, OpenSSL, 1631.1 sign/s (613 us, derived) [dchest Pi 3B and HimaJyun Pi 4 openssl speed gists], the slowest benchmarked Cortex-A class. Run `openssl speed ecdsap256` on the device"}
  ecdsa-p256-verify: {us: 1290, status: proxy, ops_per_s: 775.3, source: "PROXY, flagged: as ecdsa-p256-sign; Pi 3B 775.3 verify/s (1290 us, derived) [dchest Pi 3B and HimaJyun Pi 4 openssl speed gists]"}
radio:
  rat: [dsrc-80211p]
  chipset: {value: "Autotalks CRATON2 + PLUTON2 RF transceiver", source: "[Unex OBU-301E information sheet]"}
  tx_power_dbm:
    min: {value: null, status: not-published, calibration: "not stated for CRATON2; the gen-1 CRATON unit had a 4.5-25 dBm dynamic range [Unex OBU-201U spec v2.03], a different generation; measure or request from Unex"}
    max: {value: 20.0, status: lower-bound, source: "\">+20 dBm, Class C mask\" (OBU-301E); \"max +20 dBm\" (OBU-351U) [Unex OBU-301E/OBU-351U information sheets]"}
    default: {value: 20.0, source: "J2945/1 constant-rate baseline [Rostami et al., SAE J2945/1 scalability, 2016]"}
  sensitivity_dbm: {value: -92.0, source: "\"RX threshold <-92 dBm, SAE J2945-compliant\" [Unex OBU-301E/OBU-351U information sheets]; per-MCS table only exists for CRATON gen-1 [Unex OBU-201U spec v2.03], carried as a previous-generation proxy in the sheet"}
  noise_figure_db: {value: 9.0, status: evaluation-assumption, source: "NOT PUBLISHED for CRATON2/PLUTON2; 3GPP TR 36.885 Annex A.1.1 UE receiver noise figure 9 dB (schema default)"}
  antenna:
    gain_dbi: {value: 5.0, source: "\"2x detachable FAKRA-Z, 5 dBi omni dipole\" [Unex OBU-301E/OBU-351U information sheets]"}
    height_m: {value: 1.5, status: evaluation-assumption, source: "3GPP TR 36.885 Annex A.1.1; override per vehicle type"}
    pattern: {value: omni, source: "[Unex OBU-301E/OBU-351U information sheets]"}
power_w: {value: null, status: not-published, calibration: "not stated; input 6-48 V DC [Unex OBU-301E/OBU-351U information sheets]; measure at 12 V"}
storage_model: inherit

# The `kind: vru-device` slot of the profile schema. **No VRU-device profile is published**,
# and no vendor datasheet for a V2X-capable handset or pedestrian beacon was found. So every
# compute field here is either not-published with the measurement that would publish it, or
# a flagged proxy from the developer-board benchmarks obu/generic-automotive-soc-no-hsm
# already anchors on — exactly the pattern obu/cohda-mk5 uses when it proxies the Cohda
# MK5's verify rate from a later NXP baseband.
#
# The three radio figures that *are* cited are 3GPP evaluation assumptions for a pedestrian
# UE, not device data, and carry `status: evaluation-assumption`, as every profile does for that
# class of number.
id: vru-device/handset-generic
kind: vru-device
version: 2026-09-22.1
purpose: >-
  A generic vulnerable-road-user device: a handset or a pedestrian beacon whose V2X
  application runs in software on its own application processor. Nothing about a real
  handset was found in public sources, so the compute block is
  not-published and the two software-crypto figures are flagged proxies from the
  Cortex-A72-class benchmarks of obu/generic-automotive-soc-no-hsm. The radio block carries
  the pedestrian-UE transmit power, antenna gain and receiver noise figure of the 3GPP
  evaluation methodology, marked as assumptions rather than as device data. A handset with
  a hardware-backed keystore, or a C-V2X rather than an ITS-G5 radio, is a different
  profile and not this one.
sources:
  - {kind: benchmark, ref: "Raspberry Pi 4 OpenSSL 1.1.1d `openssl speed` gist (HimaJyun), via obu/generic-automotive-soc-no-hsm", accessed: 2026-09-18}
  - {kind: spec, ref: "3GPP TR 36.885 V14.0.0 Annex A.1.1 and Table A.1.1-1 (pedestrian-UE transmit power, antenna gain, receiver noise figure)", accessed: 2026-09-18}
  - {kind: spec, ref: "SAE J2945/9 — minimum performance requirements for PSM from VRU devices over DSRC/1609; scope VERIFIED (secondary), rate rules UNVERIFIED", accessed: 2026-09-18}
  - {kind: spec, ref: "ETSI TS 103 300-3 V2.2.1 §6.2 (VAM generation rules) and EN 302 571 V2.1.1 §4.2.10.2 (duty-cycle limits)", accessed: 2026-09-18}
  - {kind: gap, ref: "No VRU-device datasheet found: no vendor publishes a V2X handset or beacon profile", accessed: 2026-09-22}
cpu:
  cores: {value: null, status: not-published, calibration: "NOT PUBLISHED: there is no reference VRU device, so there is no part to read a core count from. Pick the handset the study is about, read /proc/cpuinfo, and record the model in the manifest; until then the runtime charges one server (the `or(1)` fallback of ProfileServiceModel::servers)"}
  clock_hz: {value: null, status: not-published, calibration: "NOT PUBLISHED, as cpu.cores; a handset also clocks down under thermal and battery pressure, so a single figure is the wrong shape and the calibration should record a sustained rather than a peak clock"}
  arch: {value: null, status: not-published, calibration: "NOT PUBLISHED, as cpu.cores. The proxy below assumes a Cortex-A72-class ARMv8-A application processor; confirm the ISA of the chosen device before relying on the proxy"}
  dmips: {value: null, status: not-published, calibration: "NOT PUBLISHED, as cpu.cores. The node model scales application-task costs by a DMIPS ratio, which cannot be formed until both this figure and the reference laptop's exist; measure with Dhrystone 2.1 on the device"}
ram_bytes: {value: null, status: not-published, calibration: "NOT PUBLISHED: a handset's total RAM is published per model but nothing published says how much a V2X application is permitted, which is the number the store accounting of §2.2 needs. Measure the resident set of a reference VRU application"}
flash_bytes: {value: null, status: not-published, calibration: "NOT PUBLISHED, as ram_bytes: the quantity that matters is the application's storage quota, not the device's capacity. Take it from the application's own allowance"}
hsm:
  kind: none
  part: {value: null, status: not-applicable, calibration: "rule H2: this profile deliberately declares no security hardware, because the modelled case is a V2X application signing in software on the application processor. A handset that keeps its authorization-ticket keys in a hardware-backed keystore is a different profile; add it with hsm.kind: secure-element and the keystore's published rates"}
  ops: {}
  queue_depth: {value: null, status: not-applicable, calibration: "rule H2: no secure-element queue exists on this profile; the node's CPU queue carries the work"}
  servers: {value: null, status: not-applicable, calibration: "rule H2: no secure-element server exists on this profile"}
# Catalogue anchors (v2xw_sec::primitive) for an operation this profile publishes no figure
# for: the Raspberry Pi 4 liboqs measurements (arXiv 2503.10238 Table 8) of the same
# Cortex-A72-class core its ECDSA figures are proxied from, as obu/generic-automotive-soc-no-hsm
# does. Without it a handset priced no post-quantum signature and signed and verified at the
# ECDSA price whatever `security.signature` said.
crypto_anchors: [hw-profile/cortex-a72-pi4-liboqs]
software_crypto:
  ecdsa-p256-sign: {us: 244, status: proxy, ops_per_s: 4097.4, source: "PROXY, flagged: no handset ECDSA benchmark was found, so the Cortex-A72-class figure obu/generic-automotive-soc-no-hsm anchors on is reused — OpenSSL 1.1.1d on a Raspberry Pi 4B, 0.0002 s/sign, 4097.4 sign/s [dchest Pi 3B and HimaJyun Pi 4 openssl speed gists; HimaJyun Pi 4 openssl speed gist]. A handset application processor is the same class of core; the proxy is a class match, not a device match, and every run that uses it must say so"}
  ecdsa-p256-verify: {us: 645, status: proxy, ops_per_s: 1550.7, source: "PROXY, flagged, as ecdsa-p256-sign: OpenSSL 1.1.1d on a Raspberry Pi 4B, 0.0006 s/verify, 1550.7 verify/s [dchest Pi 3B and HimaJyun Pi 4 openssl speed gists; HimaJyun Pi 4 openssl speed gist]"}
  ecdsa-p256-keygen: {us: null, status: not-published, calibration: "no key-generation figure for this class of core was found. It matters for a VRU device because an authorization-ticket pool is generated on the device; measure with `openssl speed ecdsap256` on the chosen handset"}
radio:
  rat: [dsrc-80211p]
  chipset: {value: null, status: not-published, calibration: "NOT PUBLISHED: no ITS-G5 handset radio datasheet was found. Record the module of the device being modelled; a C-V2X VRU device is a separate profile with rat: [lte-v2x-pc5]"}
  tx_power_dbm:
    min: {value: null, status: not-published, calibration: "NOT PUBLISHED: no VRU-device power-control floor is published. Take it from the module datasheet of the chosen device; the duty-cycle model does not depend on it, the link budget does"}
    max: {value: 23.0, status: evaluation-assumption, source: "3GPP TR 36.885 V14.0.0 Annex A.1.1: 'UE Tx power: Vehicle/pedestrian UE or UE type RSU: 23 dBm. Note: 33 dBm is not precluded' [verified directly]. An evaluation assumption for a pedestrian UE, not a datasheet figure for a handset, and is marked as such"}
    default: {value: 23.0, status: evaluation-assumption, source: "the same pedestrian-UE assumption as tx_power_dbm.max: with no published power-control behaviour for a VRU device, the default is the assumed maximum, which is also the pessimistic reading for battery drain [3GPP TR 36.885 Annex A.1.1]"}
  sensitivity_dbm: {value: null, status: not-published, calibration: "NOT PUBLISHED for a handset ITS-G5 receiver. The per-MCS table is what the PHY wants; take it from the module datasheet, or fall back to the SensitivityPreset the radio crate already carries and record which"}
  noise_figure_db: {value: 9.0, status: evaluation-assumption, source: "3GPP TR 36.885 Annex A.1.1 UE receiver noise figure 9 dB — the same figure v2xw_radio::phy::NOISE_FIGURE_3GPP_DB carries, and an evaluation assumption rather than device data"}
  antenna:
    gain_dbi: {value: 0.0, status: evaluation-assumption, source: "3GPP TR 36.885 Table A.1.1-1: pedestrian UE 0 dBi, against vehicle UE and UE-type RSU 3 dBi. This is the number that makes a pedestrian harder to hear than a car, and it is an assumption, not a measurement"}
    height_m: {value: null, status: not-published, calibration: "NOT PUBLISHED: TR 36.885 gives vehicle 1.5 m and TR 37.885's per-type UE heights of 0.75, 1.6 and 3 m, none of which is stated to be a hand-held device. Pick the TR 37.885 type the scenario means — 1.6 m is the nearest published figure for a person holding a phone — and record the choice in the scenario rather than defaulting here"}
    pattern: {value: null, status: not-published, calibration: "NOT PUBLISHED, and a hand-held antenna's pattern is dominated by the body holding it. The calibration is a measured pattern with a phantom, or the body-loss term of a published pedestrian-UE study; no pattern file is published here"}
power_w: {value: null, status: not-published, calibration: "NOT PUBLISHED, and this is the field the whole VRU-device question turns on: how long a handset can transmit a personal safety message before its battery is the binding constraint. Measure the device's draw with the V2X application transmitting at a fixed rate and at a fixed power, and with it idle, and record both — the difference is what the runtime's power budget needs"}
storage_model: inherit

  thea25: [6, 0.166, 0.20, 0.292]
  thea29: [4, 0.341, 0.41, 0.211]
  thea33: [2, 0.534, 0.65, 0.154]
  thea39: [3, 0.291, 0.35, 0.201]
  thea4:  [2, 0.579, 0.70, 0.158]
  thea42: [11, 0.751, 0.91, 0.374]
